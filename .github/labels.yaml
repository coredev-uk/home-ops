---
# Semantic Types
- name: type/digest
  color: "ffeC19"
- name: type/patch
  color: "ffeC19"
- name: type/minor
  color: "ff9800"
- name: type/major
  color: "f6412d"
# Clarence (kubernetes/apps/clarence): label sync deletes any label missing here.
# Verdict, exactly one on a Renovate pull request
- name: clarence/pass
  color: "0e8a16"
  description: "Clarence: policy passed"
- name: clarence/review
  color: "d93f0b"
  description: "Clarence: needs a human"
- name: clarence/wait
  color: "fbca04"
  description: "Clarence: waiting on checks, age or reconcile"
# Lifecycle, at most one
- name: clarence/queued
  color: "5319e7"
  description: "Queued to merge with /clarence merge"
- name: clarence/deploying
  color: "1d76db"
  description: "Merged; Clarence is checking the deploy"
- name: clarence/live
  color: "0e8a16"
  description: "Deploy healthy after Clarence merged it"
- name: clarence/unhealthy
  color: "b60205"
  description: "Deploy unhealthy; merging halted until removed"
# Set by people or Jev
- name: clarence/hold
  color: "000000"
  description: "Clarence will never merge this"
- name: clarence/security
  color: "5319e7"
  description: "Jev: fixes a security issue; merged first"
# Opened by Clarence
- name: clarence/proposal
  color: "c2e0c6"
  description: "Pull request Clarence proposes"
- name: clarence/revert
  color: "b60205"
  description: "Revert by Clarence; /clarence merge to merge"
- name: clarence/report
  color: "c2e0c6"
  description: "Clarence's daily report"
