---
# Semantic Types
- name: type/digest
  color: "ffeC19"
- name: type/patch
  color: "ffeC19"
- name: type/minor
  color: "ff9800"
- name: type/major
  color: "f6412d"
# Clarence (kubernetes/apps/clarence) creates these with the same colours and descriptions; label
# sync deletes any label missing here, so keep them in step with Clarence's label definitions.
# Verdict, exactly one on a Renovate pull request
- name: verdict/pass
  color: "0e8a16"
  description: "Verdict: policy passed"
- name: verdict/review
  color: "d93f0b"
  description: "Verdict: needs a human"
- name: verdict/wait
  color: "fbca04"
  description: "Verdict: waiting on checks, age or reconcile"
# State, at most one
- name: state/queued
  color: "5319e7"
  description: "Queued: Clarence merges it once ready"
- name: state/deploying
  color: "1d76db"
  description: "Merged; Clarence is checking the deploy"
- name: state/soaking
  color: "0052cc"
  description: "Live; Clarence is watching it for restarts"
- name: state/live
  color: "0e8a16"
  description: "Deploy healthy after Clarence merged it"
- name: state/unhealthy
  color: "b60205"
  description: "Deploy unhealthy; merging halted until removed"
- name: state/hold
  color: "000000"
  description: "On hold: Clarence will never merge this"
# Kind
- name: kind/security
  color: "5319e7"
  description: "Fixes a security issue; merged first"
- name: kind/proposal
  color: "c2e0c6"
  description: "Change Clarence proposes"
- name: kind/revert
  color: "b60205"
  description: "Revert Clarence opened; merged on command"
- name: kind/report
  color: "c2e0c6"
  description: "Clarence's daily report"
# Renovate's stopUpdatingLabel: Clarence pins a pull request that waits only on release age with it
- name: stop-updating
  color: "fbca04"
  description: "Renovate keeps this branch on its version"
