---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A pull request's newer push cancels its older run. On main every commit gets
# its own run: Clarence checks each merge commit's Build Success, and a shared
# group would drop a pending run whenever a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image-pull-extract:
    if: ${{ github.event_name == 'pull_request' }}
    name: Image Pull - Extract Images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tools come from flake.nix, pinned by flake.lock, like the dev shell
      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}

      - name: Extract Images
        id: extract
        # The nodes pull ghcr.io/coredev-uk/* (private) with the workload's imagePullSecrets;
        # talosctl image pull has no credentials, so those are left out of the pull test.
        run: |
          images=$(nix develop --command flate diff images -p ./kubernetes/apps -o json)
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          jq -c '[.[] | select(startswith("ghcr.io/coredev-uk/") | not)]' <<< "$images" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  image-pull:
    if: >-
      ${{
        needs.image-pull-extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: image-pull-extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.image-pull-extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}

      # Only talosctl, from the flake's locked nixpkgs: the whole dev shell is not worth
      # fetching once per image
      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: nix shell --inputs-from . nixpkgs#talosctl --command talosctl --nodes "$NODE" image pull "$IMAGE"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - image-pull-extract
      - image-pull
      - zizmor
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
