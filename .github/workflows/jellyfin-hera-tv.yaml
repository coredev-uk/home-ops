---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds Hera TV, the Jellyfin plugin in containers/jellyfin-hera-tv, and publishes the image that
# carries it as ghcr.io/coredev-uk/jellyfin-hera-tv:<commit> and, from main, :main. Jellyfin's
# HelmRelease (kubernetes/apps/default/jellyfin) runs that image as an init container pinned by
# commit tag and digest, so a merged build reaches the server only through a deliberate bump.
name: Jellyfin Hera TV

on:
  push:
    branches:
      - main
    paths:
      - containers/jellyfin-hera-tv/**
      - .github/workflows/jellyfin-hera-tv.yaml
  pull_request:
    paths:
      - containers/jellyfin-hera-tv/**
      - .github/workflows/jellyfin-hera-tv.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds without pushing, so a plugin that fails to compile fails before it merges.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/jellyfin-hera-tv
          file: containers/jellyfin-hera-tv/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/coredev-uk/jellyfin-hera-tv:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/coredev-uk/jellyfin-hera-tv:main' || '' }}
          # Clarence's private-pin job reads the build's commit from this label and opens the pull
          # request that pins a new main build in kubernetes/apps/default/jellyfin/app/helmrelease.yaml.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: echo "### Pushed ghcr.io/coredev-uk/jellyfin-hera-tv:${SHA}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
