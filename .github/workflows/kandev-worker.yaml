---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds the image Kandev's Kubernetes executor runs tasks in (containers/kandev-worker) and
# publishes it as ghcr.io/coredev-uk/kandev-worker:<commit>. Kandev reads the image from its
# executor profile (containers/kandev-worker/pod-template.yaml), so a new build reaches tasks
# once that profile names its digest.
name: Kandev Worker

on:
  push:
    branches:
      - main
    paths:
      - containers/kandev-worker/Containerfile
      - containers/kandev-worker/pi/**
      - .github/workflows/kandev-worker.yaml
  pull_request:
    paths:
      - containers/kandev-worker/Containerfile
      - containers/kandev-worker/pi/**
      - .github/workflows/kandev-worker.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds without pushing, so a broken Containerfile fails before it merges.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/kandev-worker
          file: containers/kandev-worker/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/coredev-uk/kandev-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: echo "### Pushed ghcr.io/coredev-uk/kandev-worker:${SHA}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
