---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: 20 */2 * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # Pinned to main's bundled build: the action's v1 and v1.1.0 tags point at a commit before
      # dist/ was committed, so they can't run. pass-cli is pinned with its release hash
      # (pass-cli-linux-x86_64 of https://github.com/protonpass/pass-cli/releases/tag/2.7.1).
      # PROTON_PASS_PERSONAL_ACCESS_TOKEN is the `home-ops-ci` token, granted viewer on the
      # Proton Pass item Kubernetes/bot-cecil only. An item grant shows the token no vault, so the
      # references are pass://<share ID>/<item ID>/<field>: the share is that grant
      # (`pass-cli pat access list-access --personal-access-token-name home-ops-ci`), and a new
      # token or grant needs the new share ID here and in tag.yaml.
      - name: Load Secrets
        id: load-secrets
        uses: protonpass/load-secret-action@e51765b8ef320ff9304a1f6523737714b67c5ddf # main, after v1.1.0
        with:
          version: 2.7.1
          hash: 3e9520fe79ab4698e03905c8bf0fff4889b3028975e832a5f801a9c82008b612
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: pass://nHYmEj3I19Sc65PUoJdMk02hP5sbGQAY-8wMnrye6R7r_HFQ8pPhOP4ftIYTJwdMwftjC9gSCwPZamjI4nPMIg==/4j2nXzZ_q_VA7frHAlEcbKK8WUbQ-lOQIeBcH0YdUhZO4xzmMofkYvXOkTbcQZOeIvzQF8SFjWioqRy_6E3LpA==/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: pass://nHYmEj3I19Sc65PUoJdMk02hP5sbGQAY-8wMnrye6R7r_HFQ8pPhOP4ftIYTJwdMwftjC9gSCwPZamjI4nPMIg==/4j2nXzZ_q_VA7frHAlEcbKK8WUbQ-lOQIeBcH0YdUhZO4xzmMofkYvXOkTbcQZOeIvzQF8SFjWioqRy_6E3LpA==/GITHUB_BOT_APP_PRIVATE_KEY

      - name: Generate Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
