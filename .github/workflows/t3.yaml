---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds the image every T3 Code environment runs (containers/t3) and publishes it as
# ghcr.io/coredev-uk/t3:<commit> and, from main, :main. The environments' HelmRelease
# (kubernetes/apps/t3) pins a commit tag and digest, so a merged build reaches them only through a
# deliberate bump; running environments keep the image their pod started with.
name: T3

on:
  push:
    branches:
      - main
    paths:
      - containers/t3/**
      - .github/workflows/t3.yaml
  pull_request:
    paths:
      - containers/t3/**
      - .github/workflows/t3.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds without pushing, so a broken Containerfile fails before it merges.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/t3
          file: containers/t3/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/coredev-uk/t3:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/coredev-uk/t3:main' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: echo "### Pushed ghcr.io/coredev-uk/t3:${SHA}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
