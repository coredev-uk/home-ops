---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
skills:
  scope:
    reviewing-pull-requests:
      load: true
tools:
  "github:google/go-containerregistry":
    # renovate: datasource=github-releases depName=google/go-containerregistry
    version: "0.22.1"
    filter_bins: crane
  # renovate: datasource=github-releases depName=home-operations/flate
  "github:home-operations/flate": "0.6.5"
trigger:
  exclude:
    # Only major or breaking (`!:`) Renovate updates are worth a model's
    # review; `@<bot> review` still reviews any pull request on demand
    - name: non-major-updates
      expr: >-
        pr.headRef.startsWith("renovate/") && pr.event != "manual"
        && !pr.labels.exists(l, l.name == "type/major") && !pr.title.contains("!:")
