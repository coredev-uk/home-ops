# The PodTemplate of Kandev's Kubernetes executor profile. Kandev keeps executor profiles in its
# database, not in Flux, so a change to this file goes into Settings > Executors > Kubernetes by
# hand. Image updates need nothing: the profile names :main, which the Kandev Worker workflow
# moves on every merged build, and pulls it for each new task pod. The profile's other fields:
#   connection: in-cluster (the control plane's kandev ServiceAccount), namespace kandev-agents
#   platform: linux/amd64, main container: kandev-agent
#   workspace: managed_pvc, 20Gi, ceph-block, ReadWriteOnce
#
# No gVisor: Kandev reaches agentctl in the pod through `kubectl port-forward`, which fails under
# runsc (the kubelet dials localhost in the pod's network namespace, which gVisor's netstack
# does not serve; tested on hyperion-0). kandev-agents' CiliumNetworkPolicy and this pod's
# security context are the boundary instead.
apiVersion: v1
kind: PodTemplate
template:
  spec:
    automountServiceAccountToken: false
    # hyperion-0 first (14 cores, and Attic and Prometheus prefer other nodes to leave it room);
    # hyperion-2 once it is full, so a task runs slower rather than failing to schedule. Never
    # hyperion-1: its 128G system disk could not hold a task's Nix store in ephemeral storage.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [hyperion-0, hyperion-2]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [hyperion-0]
    imagePullSecrets:
      - name: kandev-worker-pull
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: { type: RuntimeDefault }
    containers:
      - name: kandev-agent
        image: ghcr.io/coredev-uk/kandev-worker:main
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        # The Claude login for every process in the pod: Kandev 0.98.0 passes the executor
        # profile's environment to the task's agent only, so the utility agents agentctl runs
        # here (PR description, commit message) were not logged in. Kandev reserves envFrom.
        env:
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: kandev-agent-secret
                key: CLAUDE_CODE_OAUTH_TOKEN
        # The Nix store is in the container's writable layer, so a repository's devenv closure
        # (sona-go: GTK, GStreamer, sway) counts against ephemeral storage, not the workspace.
        # A sona-go task (devenv, go build, the UI tests) uses several GiB: requesting 4Gi keeps
        # the scheduler from packing more task pods onto a node than it can hold beside Ceph.
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
            ephemeral-storage: 5Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 30Gi
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
    volumes:
      # sway, WebKitGTK and Chromium want more shared memory than the runtime's 64Mi.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
