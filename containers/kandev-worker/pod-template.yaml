# The PodTemplate of Kandev's Kubernetes executor profile. Kandev keeps executor profiles in its
# database, not in Flux, so a change to this file goes into Settings > Executors > Kubernetes by
# hand. Image updates need nothing: the profile names :main, which the Kandev Worker workflow
# moves on every merged build, and pulls it for each new task pod. The profile's other fields:
#   connection: in-cluster (the control plane's kandev ServiceAccount), namespace kandev-agents
#   platform: linux/amd64, main container: kandev-agent
#   workspace: managed_pvc, 20Gi, ceph-block, ReadWriteOnce
#   remote credentials: Pi's "Copy auth files". Kandev 0.101.0 offers and admits Pi on this executor
#   only with one of Pi's credential methods selected. The control plane has no Pi auth.json, so
#   nothing is copied (Kandev logs and skips a missing file), and Pi reads /opt/pi/agent anyway;
#   the pods log in through CLAUDE_CODE_OAUTH_TOKEN below. Pi's API-key methods would put
#   ANTHROPIC_API_KEY in the pod, which Claude Code would use instead of that login.
#
# No gVisor: Kandev reaches agentctl in the pod through `kubectl port-forward`, which fails under
# runsc (the kubelet dials localhost in the pod's network namespace, which gVisor's netstack
# does not serve; tested on hyperion-0). kandev-agents' CiliumNetworkPolicy and this pod's
# security context are the boundary instead.
apiVersion: v1
kind: PodTemplate
template:
  spec:
    automountServiceAccountToken: false
    # hyperion-0 and hyperion-2, never hyperion-1: its 128G system disk could not hold a task's Nix
    # store in ephemeral storage. The spread is strict: neither node holds more than one task pod
    # beyond the other. Preferring hyperion-0 was not enough: other apps had requested 91% of its
    # memory, so no 4Gi task pod fit and five went to hyperion-2, whose 6 cores they saturated.
    # A task whose pod has no room on the node it must use fails to start (Unschedulable, after
    # Kandev's 30s pod wait) rather than piling onto the other node or preempting other apps.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [hyperion-0, hyperion-2]
    # The node affinity above limits the spread to those two nodes. Kandev labels every task pod
    # app.kubernetes.io/name=kandev-agent. The descheduler leaves task pods alone (they have no
    # owner), so it never evicts a running task to restore the spread.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kandev-agent
    imagePullSecrets:
      - name: kandev-worker-pull
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: { type: RuntimeDefault }
    containers:
      - name: kandev-agent
        image: ghcr.io/coredev-uk/kandev-worker:main
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        # The Claude login for every process in the pod: Kandev 0.98.0 passes the executor
        # profile's environment to the task's agent only, so the utility agents agentctl runs
        # here (PR description, commit message) were not logged in. Kandev reserves envFrom.
        env:
          - name: CLAUDE_CODE_OAUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: kandev-agent-secret
                key: CLAUDE_CODE_OAUTH_TOKEN
          # Trust the checkout: the volume's root belongs to root, so git rejects it as dubious
          # ownership. The image's /etc/gitconfig trusts it too, but Kandev runs some git commands
          # with GIT_CONFIG_NOSYSTEM=1, and HOME is Kandev's. Kandev merges these entries with
          # the ones it sets.
          # Commits are authored by Cliffe, the bot-cliffe GitHub App's bot user (id 353538383),
          # whose noreply address links them to its avatar. Nothing else sets an identity: the
          # executor profile has none and Kandev picks HOME per session, so `git commit` failed
          # with "Author identity unknown". These entries outrank the checkout's .git/config.
          - name: GIT_CONFIG_COUNT
            value: "3"
          - name: GIT_CONFIG_KEY_0
            value: safe.directory
          - name: GIT_CONFIG_VALUE_0
            value: /workspace
          - name: GIT_CONFIG_KEY_1
            value: user.name
          - name: GIT_CONFIG_VALUE_1
            value: bot-cliffe[bot]
          - name: GIT_CONFIG_KEY_2
            value: user.email
          - name: GIT_CONFIG_VALUE_2
            value: 353538383+bot-cliffe[bot]@users.noreply.github.com
          # Without a CPU limit cargo runs one job per node core (6 on hyperion-2, 18 on
          # hyperion-0), and each job's GNU ld links a test binary in about 1GiB. Six at once
          # with the agents' own ~1.5GiB OOM-killed a task pod at the 8Gi limit; the kill takes
          # agentctl with it, so the task fails. Three jobs keep a Rust build near 5GiB.
          - name: CARGO_BUILD_JOBS
            value: "3"
        # The Nix store is in the container's writable layer, so a repository's devenv closure
        # (sona-go: GTK, GStreamer, sway) counts against ephemeral storage, not the workspace.
        # A sona-go task (devenv, go build, the UI tests) uses several GiB: requesting 4Gi keeps
        # the scheduler from packing more task pods onto a node than it can hold beside Ceph.
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
            ephemeral-storage: 5Gi
          limits:
            memory: 8Gi
            ephemeral-storage: 30Gi
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
    volumes:
      # sway, WebKitGTK and Chromium want more shared memory than the runtime's 64Mi.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
