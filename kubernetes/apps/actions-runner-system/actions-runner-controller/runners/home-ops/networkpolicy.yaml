---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name home-ops-runner
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: *name
  enableDefaultDeny:
    egress: true
  egress:
    # DNS resolution
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Cluster-internal: pod/service CIDRs, needed for containerMode:kubernetes job pods and in-cluster API access
    - toCIDR:
        - 10.42.0.0/16
        - 10.43.0.0/16
    # Public internet: standard web ports only (GitHub, registries, 1Password, etc. are all HTTPS/HTTP).
    # Deliberately not an FQDN allowlist - Renovate autodiscovers and checks every registry referenced
    # anywhere in this repo, so enumerating destinations is fragile. Restricting to 80/443 still blocks
    # arbitrary-protocol/port egress (e.g. the anomalous UDP:8080 traffic this policy was written for).
    - toCIDR:
        - 0.0.0.0/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
  # Deny takes precedence over the 0.0.0.0/0:80/443 allow above - without this, that rule would also
  # permit reaching LAN devices with a web UI on those ports.
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.42.0.0/16
            - 10.43.0.0/16
    - toCIDR:
        - 172.16.0.0/12
    - toCIDRSet:
        - cidr: 192.168.0.0/16
          except:
            - 192.168.20.0/24
