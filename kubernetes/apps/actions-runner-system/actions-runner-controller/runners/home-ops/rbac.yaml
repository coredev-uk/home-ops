---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-ops-runner
spec:
  # The runner's only use of the Talos API is `talosctl image pull` (ci.yaml), which operator
  # allows. Pull request workflows run on this runner, so it gets nothing more. Its Kubernetes
  # service account is the chart's own, limited to the job pods in this namespace.
  roles:
    - os:operator
