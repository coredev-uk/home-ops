---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: nixos-runner
    files:
      - start.sh=./resources/start.sh
      - nix.conf=./resources/nix.conf
generatorOptions:
  disableNameSuffixHash: true
