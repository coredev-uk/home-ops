# The nixos runner's nix.conf, read through NIX_CONF_DIR=/config (helmrelease.yaml). Substituters
# match the hosts' (coredev-uk/nixos hosts/default.nix), so what a build downloads instead of
# building is what atlas downloads too.
experimental-features = nix-command flakes
build-users-group = nixbld
sandbox = true
# Fail instead of quietly building without the sandbox.
sandbox-fallback = false
# Build directories on the persistent store image, not the VM's root filesystem.
build-dir = /nix/var/nix/builds
# No fsync per store path and no synchronous SQLite writes: each would flush the store image
# through virtiofs to Ceph. Durability comes from start.sh instead: one flush on a clean exit,
# and a full store check after any job that did not get there.
fsync-store-paths = false
fsync-metadata = false
# Two builds of four cores each in the VM's vCPUs: a lone big build gets the whole VM, two at
# once share it.
max-jobs = 2
cores = 4
substituters = https://cache.nixos.org https://nix-community.cachix.org https://nix-citizen.cachix.org https://attic.hera.ac/coredev
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nix-citizen.cachix.org-1:lPMkWc2X8XD4/7YPEEwXKKBg+SVbYTVrAaLA2wQTKCo= coredev:g2+SrYgQg5HPBFIFHqHszqjvH7n52Zi3HVraAlY0kl8=
connect-timeout = 10
# A path whose substitute fails to download is built instead (NixOS/nix#16722: a NAR that arrived
# whole before its stream broke is retried past its end and fails with HTTP 416).
fallback = true
accept-flake-config = false
warn-dirty = false
log-lines = 200
# Collect garbage mid-build when the store image runs low: start under 10 GiB free, stop at
# 20 GiB.
min-free = 10737418240
max-free = 21474836480
