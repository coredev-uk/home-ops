---
# bot-cecil, the GitHub App octo-sts mints installation tokens as.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: octo-sts
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: octo-sts-secret
    template:
      data:
        GITHUB_APP_IDS: "{{ .GITHUB_BOT_APP_ID }}"
        APP_SECRET_CERTIFICATE_ENV_VAR: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: bot-cecil
