---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-rules
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerAbsent
          expr: |-
            absent(up{job="cert-manager"})
          for: 5m
          annotations:
            summary: >-
              Cert Manager has dissapeared from Prometheus service discovery
          labels:
            severity: critical

    - name: certificates
      rules:
        - alert: CertManagerCertNotReady
          expr: |-
            max by (name, exported_namespace, namespace, condition) (certmanager_certificate_ready_status{condition!="True"} == 1)
          for: 5m
          annotations:
            summary: >-
              The cert {{ $labels.name }} is not ready to serve traffic
          labels:
            severity: critical

        # Certificates last 160h and renew about 53h before expiry, so under 36h left means
        # renewal has been failing for most of a day.
        - alert: CertManagerCertExpiringSoon
          expr: |-
            max by (name, exported_namespace) (certmanager_certificate_expiration_timestamp_seconds) - time() < 129600
          for: 15m
          annotations:
            summary: >-
              The cert {{ $labels.name }} expires in under 36 hours and has not renewed
          labels:
            severity: critical

        - alert: CertManagerHittingRateLimits
          expr: |-
            sum by (host) (rate(certmanager_http_acme_client_request_count{status="429"}[5m])) > 0
          for: 5m
          annotations:
            summary: >-
              Cert manager hitting LetsEncrypt rate limits
          labels:
            severity: critical
