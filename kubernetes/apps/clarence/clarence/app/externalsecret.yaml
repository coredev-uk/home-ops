---
# openrouter-api-key: Jev (typesafe/jev-1.14) through OpenRouter, billed per input token; cap it
#   with a credit limit under openrouter.ai/settings/keys.
# app-id, private-key.pem: the bot-clarence GitHub App (1Password item bot-clarence, like
#   bot-cecil), installed on coredev-uk/home-ops, coredev-uk/sona-go, coredev-uk/clarence and
#   coredev-uk/nixos. A leaked key can merge to all of them: revoke it under App settings -> Private keys.
# webhook-secret: signs GitHub's webhook deliveries; the same value goes in the App's webhook
#   settings (field CLARENCE_WEBHOOK_SECRET). Without it Clarence only polls.
# home-assistant-token: a Home Assistant long-lived access token (field CLARENCE_HASS_TOKEN), so
#   Clarence reads which integrations run from /api/config and sets aside upstream issues about
#   the others (policy upstreamIssues.components). Empty until the field exists: then nothing is
#   set aside.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clarence
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clarence-secret
    template:
      data:
        openrouter-api-key: "{{ .OPENROUTER_API_KEY }}"
        app-id: "{{ .GITHUB_BOT_APP_ID }}"
        private-key.pem: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
        webhook-secret: "{{ .CLARENCE_WEBHOOK_SECRET }}"
        home-assistant-token: '{{ .CLARENCE_HASS_TOKEN | default "" }}'
  dataFrom:
    - extract:
        key: bot-clarence
---
# Pulls the private ghcr.io/coredev-uk/clarence image; also mounted so the image check can read
# private ghcr.io/coredev-uk images. GHCR_PULL_TOKEN: classic token with only read:packages.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clarence-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clarence-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: bot-clarence
