---
# openrouter-api-key: Jev (typesafe/jev-1.14) through OpenRouter, billed per input token; cap it
#   with a credit limit under openrouter.ai/settings/keys.
# app-id, private-key.pem: the Clarence GitHub App, installed on coredev-uk/home-ops and
#   coredev-uk/sona-go. A leaked key can merge to both: revoke it under App settings -> Private keys.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clarence
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clarence-secret
    template:
      data:
        openrouter-api-key: "{{ .OPENROUTER_API_KEY }}"
        app-id: "{{ .CLARENCE_APP_ID }}"
        private-key.pem: "{{ .CLARENCE_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: clarence
---
# Pulls the private ghcr.io/coredev-uk/clarence image; also mounted so the image check can read
# private ghcr.io/coredev-uk images. GHCR_PULL_TOKEN: classic token with only read:packages.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clarence-ghcr-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: clarence-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: clarence
