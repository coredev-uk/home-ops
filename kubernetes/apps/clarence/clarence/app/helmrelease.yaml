---
# Clarence (github.com/coredev-uk/clarence) rules on Renovate pull requests with Jev, labels them and
# merges what the policy passes, one at a time; then checks the deploy, soaks and reverts.
# One controller per repository it serves, each with its own policy file and state.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clarence
spec:
  chartRef:
    kind: OCIRepository
    name: clarence
  interval: 1h
  values:
    controllers:
      # Never two at once per repository: two pods could each merge a pull request
      # before either checks a deploy, hence one replica and Recreate.
      home-ops:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: clarence
        pod:
          automountServiceAccountToken: true
          # SIGTERM lets the current poll finish, so a merge is not cut off before its labels.
          terminationGracePeriodSeconds: 300
        containers:
          app:
            # Built from coredev-uk/clarence main; the tag is the commit SHA, pinned here by hand.
            image: &image
              repository: ghcr.io/coredev-uk/clarence
              tag: 28bbc6f9f8594d994d1c77153e30b6186d754819@sha256:80f7eebc4d5b8d25d559942586307290cdd244304e28b877e2f1d09fdeaf84ec
            args:
              - -policy=/etc/clarence/config/policy.json
              - -secrets=/etc/clarence/secret
              - -state=/var/lib/clarence/state.db
            probes: &probes
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # Checks keep a few repository snapshots in memory and render them with kustomize;
            # CVE scans run the Trivy client in the same container, which unpacks image layers.
            resources: &resources
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
      # sona-go deploys nowhere: no Kubernetes API access at all.
      sona-go:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: sona-go
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 300
        containers:
          app:
            image: *image
            args:
              - -policy=/etc/clarence/config/policy.json
              - -secrets=/etc/clarence/secret
              - -state=/var/lib/clarence/state.db
            probes: *probes
            securityContext: *securityContext
            resources: *resources
      # self serves coredev-uk/clarence, Clarence's own source: like sona-go, nothing deploys
      # (a merge builds an image this file pins by hand), so no Kubernetes API access.
      self:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: self
        pod:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 300
        containers:
          app:
            image: *image
            args:
              - -policy=/etc/clarence/config/policy.json
              - -secrets=/etc/clarence/secret
              - -state=/var/lib/clarence/state.db
            probes: *probes
            securityContext: *securityContext
            resources: *resources
    defaultPodOptions:
      imagePullSecrets:
        - name: clarence-ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      clarence:
        forceRename: clarence
      sona-go:
        forceRename: clarence-sona-go
        automountServiceAccountToken: false
      self:
        forceRename: clarence-self
        automountServiceAccountToken: false
    # Read-only: Clarence maps changed files onto the Kustomizations and HelmReleases that deploy
    # them, gates merges on node, Ceph and tuppr health, and checks the deploy afterwards.
    # It never writes to the cluster; Flux deploys what it merges.
    rbac:
      roles:
        clarence:
          forceRename: clarence-read
          type: ClusterRole
          rules:
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list"]
            - apiGroups: ["source.toolkit.fluxcd.io"]
              resources: ["ocirepositories"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["nodes", "pods", "persistentvolumeclaims", "persistentvolumes"]
              verbs: ["get", "list"]
            - apiGroups: ["tuppr.home-operations.com"]
              resources: ["talosupgrades", "kubernetesupgrades"]
              verbs: ["get", "list"]
            # The validate check reads each CRD's schema, so custom resources are checked
            # against what this cluster's API server accepts.
            - apiGroups: ["apiextensions.k8s.io"]
              resources: ["customresourcedefinitions"]
              verbs: ["get", "list"]
            - apiGroups: ["ceph.rook.io"]
              resources: ["cephclusters"]
              verbs: ["get", "list"]
            # The daily report counts apps the zeroscaler HPA holds at zero as parked.
            - apiGroups: ["autoscaling"]
              resources: ["horizontalpodautoscalers"]
              verbs: ["get", "list"]
      bindings:
        clarence:
          forceRename: clarence-read
          type: ClusterRoleBinding
          roleRef:
            identifier: clarence
          subjects:
            - identifier: clarence
    service:
      home-ops:
        controller: home-ops
        ports:
          http:
            port: *port
      sona-go:
        controller: sona-go
        ports:
          http:
            port: *port
      self:
        controller: self
        ports:
          http:
            port: *port
    # GitHub's webhook deliveries for every repository arrive at the home-ops controller, which
    # checks the signature and forwards other repositories' deliveries to their controller
    # (webhook.peers in policy-home-ops.json). Only /webhook is public; /metrics stays inside.
    route:
      webhook:
        # Gatus probes /webhook, not /, which no rule matches: a GET there reaches Clarence,
        # which answers 405 to anything but a POST.
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 405"]
            path: /webhook
        hostnames:
          - clarence.hera.ac
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: home-ops
                port: *port
            matches:
              - path:
                  type: Exact
                  value: /webhook
    # `repo` names the GitHub repository each controller serves, so the dashboard links pull
    # requests to the right one.
    serviceMonitor:
      home-ops:
        service:
          identifier: home-ops
        endpoints:
          - port: http
            relabelings:
              - targetLabel: repo
                replacement: home-ops
      sona-go:
        service:
          identifier: sona-go
        endpoints:
          - port: http
            relabelings:
              - targetLabel: repo
                replacement: sona-go
      self:
        service:
          identifier: self
        endpoints:
          - port: http
            relabelings:
              - targetLabel: repo
                replacement: clarence
    persistence:
      config-home-ops:
        type: configMap
        name: clarence-home-ops-policy
        advancedMounts:
          home-ops:
            app:
              - path: /etc/clarence/config
                readOnly: true
      config-sona-go:
        type: configMap
        name: clarence-sona-go-policy
        advancedMounts:
          sona-go:
            app:
              - path: /etc/clarence/config
                readOnly: true
      config-self:
        type: configMap
        name: clarence-self-policy
        advancedMounts:
          self:
            app:
              - path: /etc/clarence/config
                readOnly: true
      secret:
        type: secret
        name: clarence-secret
        defaultMode: 0440
        globalMounts:
          - path: /etc/clarence/secret
            readOnly: true
      # Pull credentials, so the image check can see private ghcr.io/coredev-uk images.
      registry:
        type: secret
        name: clarence-ghcr-pull
        defaultMode: 0440
        globalMounts:
          - path: /etc/clarence/registry
            readOnly: true
      state-home-ops:
        existingClaim: clarence-home-ops-state
        advancedMounts:
          home-ops:
            app:
              - path: /var/lib/clarence
      state-sona-go:
        existingClaim: clarence-sona-go-state
        advancedMounts:
          sona-go:
            app:
              - path: /var/lib/clarence
      state-self:
        existingClaim: clarence-self-state
        advancedMounts:
          self:
            app:
              - path: /var/lib/clarence
      # The Trivy client's cache (security.cacheDir): the Java index, fetched on the first image
      # with JAR files, and the layers it unpacks while scanning. sona-go scans nothing.
      trivy-cache:
        type: emptyDir
        sizeLimit: 4Gi
        advancedMounts:
          home-ops:
            app:
              - path: /var/cache/trivy
          self:
            app:
              - path: /var/cache/trivy
      # kubeconform's schema cache; the root filesystem is read-only.
      tmp:
        type: emptyDir
        sizeLimit: 256Mi
