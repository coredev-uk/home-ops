---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: clarence-home-ops-policy
    files:
      - policy.json=./policy-home-ops.json
  - name: clarence-sona-go-policy
    files:
      - policy.json=./policy-sona-go.json
  - name: clarence-self-policy
    files:
      - policy.json=./policy-clarence.json
  - name: clarence-dashboard
    files:
      - clarence.json=./resources/clarence.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
