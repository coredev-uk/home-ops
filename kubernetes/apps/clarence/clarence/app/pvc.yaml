---
# Clarence's state file (/var/lib/clarence/state.db), one per controller: job schedules, the
# command cursor, Jev's answers, proposal history, Trivy scans and the report's first-seen times.
# Plain claims rather than the kopiur component (which backs up one claim named ${APP});
# snapshotpolicy.yaml backs each one up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clarence-home-ops-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clarence-sona-go-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clarence-self-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
