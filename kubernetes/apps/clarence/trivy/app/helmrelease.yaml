---
# Trivy server for Clarence's CVE scans: Clarence runs the Trivy client (`trivy image --server`)
# against http://trivy.clarence.svc.cluster.local:4954 (security.trivyServer in its policy files).
# The client pulls the image and analyses its layers; the server holds the vulnerability
# database (mirror.gcr.io/aquasec/trivy-db, then ghcr.io), downloads it on start and checks for
# a new one hourly. No token: only in-cluster callers.
# Keep the image at the version of the client in Clarence's Dockerfile (TRIVY_VERSION).
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy
spec:
  chartRef:
    kind: OCIRepository
    name: trivy
  interval: 1h
  values:
    controllers:
      # One replica on a ReadWriteOnce cache, hence Recreate.
      trivy:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/aquasecurity/trivy
              tag: 0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
            args:
              - server
              - --listen=0.0.0.0:4954
              - --cache-dir=/var/cache/trivy
            probes:
              # The first start downloads the database before it listens.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 4954
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # The database is memory-mapped; unpacking an update is the peak.
            resources:
              requests:
                cpu: 10m
                memory: 112Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        forceRename: trivy
        ports:
          http:
            port: *port
    persistence:
      cache:
        existingClaim: trivy-cache
        globalMounts:
          - path: /var/cache/trivy
      # An update unpacks the whole database (1.6 GB) here before copying it into the cache.
      tmp:
        type: emptyDir
        sizeLimit: 4Gi
