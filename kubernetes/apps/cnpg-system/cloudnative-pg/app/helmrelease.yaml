---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 1h
  values:
    monitoring:
      podMonitorEnabled: true
    # The manager's RSS p95 over 30 days is 65Mi, daily peak 71Mi (2026-11-13).
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 512Mi
