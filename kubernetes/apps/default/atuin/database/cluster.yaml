---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atuin-postgres
spec:
  instances: 1
  # One instance: a PDB would block every node drain (Talos upgrades). Drains move the primary instead.
  enablePDB: false
  # A single instance goes down with its node, so keep the databases on different nodes: one
  # node outage then takes out a few apps, not all of them.
  affinity:
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                cnpg.io/podRole: instance
            namespaceSelector: {}
            topologyKey: kubernetes.io/hostname
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: atuin
      owner: atuin
      secret:
        name: atuin-postgres-credentials
