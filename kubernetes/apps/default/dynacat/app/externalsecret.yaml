---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynacat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dynacat-secret
    template:
      data:
        WEATHER_LOCATION: "{{ .WEATHER_LOCATION }}"
        AUTH_SECRET_KEY: "{{ .AUTH_SECRET_KEY }}"
        CHANGE_DETECTION_API_KEY: "{{ .CHANGE_DETECTION_API_KEY }}"
        QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USERNAME }}"
        QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
        PIHOLE_APP_PASSWORD: "{{ .PIHOLE_APP_PASSWORD }}"
        PLEX_TOKEN: "{{ .PLEX_API_TOKEN }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  data:
    - secretKey: WEATHER_LOCATION
      remoteRef:
        key: dynacat
        property: WEATHER_LOCATION
    - secretKey: AUTH_SECRET_KEY
      remoteRef:
        key: dynacat
        property: AUTH_SECRET_KEY
    - secretKey: CHANGE_DETECTION_API_KEY
      remoteRef:
        key: change-detection
        property: CHANGE_DETECTION_API_KEY
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: qbittorrent
        property: QBITTORRENT_USERNAME
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: QBITTORRENT_PASSWORD
    - secretKey: PIHOLE_APP_PASSWORD
      remoteRef:
        key: dynacat
        property: PIHOLE_APP_PASSWORD
    - secretKey: PLEX_API_TOKEN
      remoteRef:
        key: plex
        property: PLEX_API_TOKEN
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
