---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynacat
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dynacat-secret
    template:
      data:
        WEATHER_LOCATION: "{{ .WEATHER_LOCATION }}"
        AUTH_SECRET_KEY: "{{ .AUTH_SECRET_KEY }}"
        CHANGE_DETECTION_API_KEY: "{{ .CHANGE_DETECTION_API_KEY }}"
        QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USERNAME }}"
        QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
        PLEX_TOKEN: "{{ .PLEX_API_TOKEN }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
        SURE_API_KEY: "{{ .SURE_API_KEY }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: WEATHER_LOCATION
      remoteRef:
        key: dynacat
        property: WEATHER_LOCATION
    # Shared with the github-status Flux provider, so one token covers the
    # dashboard's reads and Flux's commit statuses. Needs repo read plus
    # commit-status write.
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: flux
        property: FLUX_GITHUB_TOKEN
    - secretKey: AUTH_SECRET_KEY
      remoteRef:
        key: dynacat
        property: AUTH_SECRET_KEY
    # Read-only Sure API key (Settings > API Keys: "Dynacat") for Portfolio.
    - secretKey: SURE_API_KEY
      remoteRef:
        key: dynacat
        property: SURE_API_KEY
    # Pocket ID client "Home".
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: dynacat
        property: OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dynacat
        property: OIDC_CLIENT_SECRET
    - secretKey: CHANGE_DETECTION_API_KEY
      remoteRef:
        key: change-detection
        property: CHANGE_DETECTION_API_KEY
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: qbittorrent
        property: QBITTORRENT_USERNAME
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: QBITTORRENT_PASSWORD
    - secretKey: PLEX_API_TOKEN
      remoteRef:
        key: plex
        property: PLEX_API_TOKEN
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
    # The unifi-vpn-restarter CronJob's key; the dashboard only sends GETs.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: unifi
        property: UNIFI_API_KEY
