---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: dynacat-configmap
    files:
      - dynacat.yml=./resources/config.yml
  - name: dynacat-theme
    files:
      - ./resources/theme/meridian.css
      - ./resources/theme/atkinson-hyperlegible-next-latin-wght-normal.woff2
generatorOptions:
  disableNameSuffixHash: true
