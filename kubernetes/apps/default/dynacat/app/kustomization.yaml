---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./agent-daemonset.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml
configMapGenerator:
  - name: dynacat-configmap
    files:
      - dynacat.yml=./resources/config.yml
generatorOptions:
  disableNameSuffixHash: true
