---
server:
  host: 0.0.0.0
  port: 8080
  proxied: true
  cache-dir: /app/assets/.cache
  # The config is mounted read-only from a ConfigMap and managed in git, so the
  # web UI editor could never save anyway. Dynacat defaults this to true and
  # warns that it is reachable without authentication, so turn it off.
  allow-editing: false
  # Server-side to-do storage needs a writable, persistent file; the default
  # path resolves under the read-only /app/config.
  db-path: /app/data/dynacat.db

auth:
  secret-key: ${AUTH_SECRET_KEY}

# Meridian, the desktop's system palette (lib/theme in ~/.dotfiles). These HSL
# values are the base tokens Dynacat derives from; meridian.css (the
# dynacat-theme ConfigMap, served under /assets/meridian/) assigns the rest of
# the palette by role and sets the type. One theme, no picker.
theme:
  background-color: 218 21 10
  primary-color: 41 53 55
  positive-color: 158 31 57
  negative-color: 8 68 62
  disable-picker: true
  custom-css-file: /assets/meridian/meridian.css

branding:
  app-background-color: "#151920"

pages:
  - name: Home
    # The only page, so the navigation bar has nothing to switch between.
    hide-desktop-navigation: true
    head-widgets:
      - type: monitor
        title: Critical Services
        style: compact
        show-failing-only: true
        show-history: true
        update-interval: 1m
        sites:
          - title: Plex
            url: https://plex.hera.ac
            check-url: https://plex.hera.ac/identity
            icon: si:plex
          - title: Seerr
            url: https://seerr.hera.ac
            icon: sh:jellyseerr-light
          - title: Radarr
            url: https://radarr.hera.ac
            icon: si:radarr
          - title: Sonarr
            url: https://sonarr.hera.ac
            icon: si:sonarr
          - title: SABnzbd
            url: https://sabnzbd.hera.ac
            icon: sh:sabnzbd-light
          - title: qBittorrent
            url: https://qbittorrent.hera.ac
            icon: si:qbittorrent
          - title: Home Assistant
            url: https://hass.hera.ac
            icon: si:homeassistant

    columns:
      # Infrastructure: the cluster, the network and the money.
      - size: small
        widgets:
          # node_exporter already runs on every node (kube-prometheus-stack),
          # so no Dynacat agent is needed. Talos mounts a lot of tmpfs and
          # read-only system paths; only the EPHEMERAL partition is worth
          # watching.
          - type: server-stats
            title: Cluster Nodes
            servers:
              - &node
                type: node-exporter
                name: hyperion-0
                url: http://hyperion-0.internal:9100
                hide-swap: true
                hide-mountpoints-by-default: true
                mountpoints:
                  /var:
                    name: Ephemeral
                    hide: false
              - <<: *node
                name: hyperion-1
                url: http://hyperion-1.internal:9100
              - <<: *node
                name: hyperion-2
                url: http://hyperion-2.internal:9100

          # The UniFi gateway's view of the ProtonVPN WireGuard client (which
          # carries the VPN VLAN: qBittorrent and Prowlarr) and the WAN.
          # unifi.internal serves a self-signed cert.
          - type: custom-api
            title: Network
            title-url: https://unifi.internal/network/default/vpn
            cache: 1m
            allow-insecure: true
            url: https://unifi.internal/proxy/network/v2/api/site/default/vpn/connections
            headers: &unifi-headers
              X-API-KEY: ${UNIFI_API_KEY}
              Accept: application/json
            subrequests:
              health:
                url: https://unifi.internal/proxy/network/api/s/default/stat/health
                allow-insecure: true
                headers: *unifi-headers
              networks:
                url: https://unifi.internal/proxy/network/api/s/default/rest/networkconf
                allow-insecure: true
                headers: *unifi-headers
              routes:
                url: https://unifi.internal/proxy/network/v2/api/site/default/trafficroutes
                allow-insecure: true
                headers: *unifi-headers
            template: |
              {{ $health := .Subrequest "health" }}
              {{ $networks := .Subrequest "networks" }}
              {{ $routes := .Subrequest "routes" }}
              <ul class="list list-gap-14 network-widget">
                {{ range .JSON.Array "connections" }}
                {{ $id := .String "network_id" }}
                {{ $up := eq (.String "status") "CONNECTED" }}
                {{ $route := $routes.JSON.Array (concat "#(network_id==\"" $id "\")#") }}
                <li>
                  <div class="network-row">
                    <span class="network-dot {{ if $up }}is-on{{ else }}is-down{{ end }}"></span>
                    <span class="color-highlight grow min-width-0 text-truncate">{{ $networks.JSON.String (concat "data.#(_id==\"" $id "\").name") }}</span>
                    {{ if $up }}
                    <span class="network-state is-on">Connected</span>
                    {{ else }}
                    <span class="network-state is-down">{{ .String "status" | replaceAll "_" " " }}</span>
                    {{ end }}
                  </div>
                  <ul class="list-horizontal-text size-h5 network-meta">
                    <li>{{ .String "remote_ip" }}</li>
                    {{ if $up }}<li>connected <span {{ .String "assoc_time" | parseTime "unix" | toRelativeTime }}></span></li>{{ end }}
                    <li>down {{ printf "%.1f" (div (.Float "rx_rate_bps") 1000000) }} · up {{ printf "%.1f" (div (.Float "tx_rate_bps") 1000000) }} Mbps</li>
                  </ul>
                  {{ range $route }}
                  {{ $target := .String "target_devices.0.network_id" }}
                  <ul class="list-horizontal-text size-h5 network-meta">
                    <li>Routes {{ $networks.JSON.String (concat "data.#(_id==\"" $target "\").name") }}</li>
                    <li>{{ if .Bool "kill_switch_enabled" }}kill switch on{{ else }}<span class="color-negative">no kill switch</span>{{ end }}</li>
                  </ul>
                  {{ end }}
                </li>
                {{ end }}

                <li>
                  {{ $wan := "data.#(subsystem==\"wan\")" }}
                  {{ $www := "data.#(subsystem==\"www\")" }}
                  {{ $wanUp := eq ($health.JSON.String (concat $wan ".status")) "ok" }}
                  <div class="network-row">
                    <span class="network-dot {{ if $wanUp }}is-ok{{ else }}is-down{{ end }}"></span>
                    <span class="color-highlight grow min-width-0 text-truncate">{{ $health.JSON.String (concat $wan ".isp_name") }}</span>
                    <span class="network-state">{{ $health.JSON.Int (concat $www ".latency") }} ms</span>
                  </div>
                  <ul class="list-horizontal-text size-h5 network-meta">
                    <li>{{ $health.JSON.String (concat $wan ".wan_ip") }}</li>
                    <li>down {{ printf "%.0f" ($health.JSON.Float (concat $www ".xput_down")) }} · up {{ printf "%.0f" ($health.JSON.Float (concat $www ".xput_up")) }} Mbps</li>
                  </ul>
                </li>
              </ul>

          # Pi-hole runs passwordless (admin.enabled: false); dynacat >= 3.0.2
          # skips /api/auth when no password is set (Panonim/dynacat#177).
          # pihole-web load-balances across both replicas, and each keeps its
          # own FTL stats, so figures reflect whichever pod answered.
          - type: dns-stats
            service: pihole-v6
            url: http://pihole-web.network.svc.cluster.local
            hour-format: "24h"

          - type: speedtest
            update-interval: 6h

          - type: group
            widgets:
              - type: markets
                title: Portfolio
                markets:
                  - symbol: VUSA.L
                    name: S&P 500 ACC
                  - symbol: NVDA
                    name: Nvidia
                  - symbol: MAB.L
                    name: Mitchells & Butlers

              - type: markets
                title: Crypto
                markets:
                  - symbol: BTC-USD
                    name: Bitcoin
                  - symbol: ETH-USD
                    name: Ethereum

      - size: full
        widgets:
          - type: search
            hide-header: true
            autofocus: true
            new-tab: true
            search-engine: google
            autocomplete: true
            autocomplete-provider: brave
            bangs:
              - title: YouTube
                shortcut: "!y"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Amazon
                shortcut: "!a"
                url: https://www.amazon.co.uk/s?k={QUERY}

          - type: latest-media
            title: Recently Added
            update-interval: 30m
            item-count: 12
            columns: 6
            hosts:
              - url: plex:http://plex.default.svc.cluster.local:32400
                token: ${PLEX_TOKEN}
                public-url: https://plex.hera.ac

          - type: bookmarks
            title: Services
            groups:
              - title: Core Infrastructure
                links:
                  - title: Status
                    url: https://status.hera.ac
                    icon: di:gatus
                  - title: UniFi
                    url: https://unifi.internal
                    icon: si:ubiquiti
                  - title: UNAS
                    url: https://expanse.internal
                    icon: si:ubiquiti
                  - title: Rook Ceph
                    url: https://rook.hera.ac
                    icon: di:rook
                  - title: Nix Cache
                    url: https://attic.hera.ac/coredev/nix-cache-info
                    icon: si:nixos

              - title: Identity & Monitoring
                links:
                  - title: Grafana
                    url: https://grafana.hera.ac
                    icon: si:grafana
                  - title: Pocket ID
                    url: https://id.hera.ac
                    icon: sh:pocket-id
                  - title: Victoria Logs
                    url: https://vlogs.hera.ac
                    icon: si:victoriametrics
                  - title: Prometheus
                    url: https://prometheus.hera.ac
                    icon: si:prometheus

              - title: Ops
                links:
                  - title: Alertmanager
                    url: https://alertmanager.hera.ac
                    icon: si:prometheus
                  - title: Pi-hole
                    url: https://pihole.hera.ac
                    icon: si:pihole
                  - title: Flux Operator
                    url: https://flux-operator.hera.ac
                    icon: di:flux-cd
                  - title: T3 Code (a)
                    url: https://t3-a.hera.ac
                    icon: mdi:robot-outline
                  - title: T3 Code (b)
                    url: https://t3-b.hera.ac
                    icon: mdi:robot-outline

              - title: Media Discovery & Servers
                links:
                  - title: Plex
                    url: https://plex.hera.ac
                    icon: si:plex
                  - title: Seerr
                    url: https://seerr.hera.ac
                    icon: sh:jellyseerr-light
                  - title: Tautulli
                    url: https://tautulli.hera.ac
                    icon: sh:tautulli
                  - title: Radarr
                    url: https://radarr.hera.ac
                    icon: si:radarr
                  - title: Sonarr
                    url: https://sonarr.hera.ac
                    icon: si:sonarr
                  - title: Sportarr
                    url: https://sportarr.hera.ac
                    icon: di:sportarr
                  - title: Maintainerr
                    url: https://maintainerr.hera.ac
                    icon: sh:maintainerr

              - title: Media Automation
                links:
                  - title: Bazarr
                    url: https://bazarr.hera.ac
                    icon: sh:bazarr-light
                  - title: Profilarr
                    url: https://profilarr.hera.ac
                    icon: di:profilarr
                  - title: Prowlarr
                    url: https://prowlarr.hera.ac
                    icon: sh:prowlarr-light
                  - title: Qui
                    url: https://qui.hera.ac
                    icon: di:qui

              - title: Downloads
                links:
                  - title: SABnzbd
                    url: https://sabnzbd.hera.ac
                    icon: sh:sabnzbd-light
                  - title: qBittorrent
                    url: https://qbittorrent.hera.ac
                    icon: si:qbittorrent

              - title: Home & Security
                links:
                  - title: Change Detection
                    url: https://changes.hera.ac
                    icon: si:changedetection
                  - title: Home Assistant
                    url: https://hass.hera.ac
                    icon: si:homeassistant

              - title: Personal & Docs
                links:
                  - title: Docs
                    url: https://docs.hera.ac
                    icon: si:outline
                  - title: Atuin
                    url: https://atuin.hera.ac
                    icon: di:atuin
                  - title: Mealie
                    url: https://mealie.hera.ac
                    icon: si:mealie
                  - title: Sure
                    url: https://sure.hera.ac
                    icon: mdi:finance

          - type: repository
            title: Home Ops Repo
            repository: coredev-uk/home-ops
            pull-requests-limit: 8
            issues-limit: -1
            commits-limit: 5
            cache: 1h

          - type: to-do
            id: home-ops
            storage: server
            collapse-after: 10

          - type: rss
            style: horizontal-cards
            title: Tech News
            feeds:
              - url: https://itsfoss.com/rss/
                title: "It's FOSS"
              - url: https://www.techradar.com/uk/feeds.xml
                title: "TechRadar"
              - url: https://9to5mac.com/feed/
                title: "9to5Mac"
              - url: https://hackernewsrss.com/feed.xml
                title: "HackerNews"
            limit: 8

          - type: group
            widgets:
              - type: hacker-news
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: unixporn
                show-thumbnails: true
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: technology
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: ubiquiti
                limit: 10
                collapse-after: 5

      # The day: what's on, what's playing, what's coming.
      - size: small
        widgets:
          - type: weather
            location: ${WEATHER_LOCATION}
            show-area-name: true

          - type: calendar
            show-release-state: true
            hosts:
              - url: radarr:http://radarr.default.svc.cluster.local
                token: ${RADARR_API_KEY}
                public-url: https://radarr.hera.ac
              - url: sonarr:http://sonarr.default.svc.cluster.local
                token: ${SONARR_API_KEY}
                public-url: https://sonarr.hera.ac

          - type: playing
            hosts:
              - url: plex:http://plex.default.svc.cluster.local:32400
                token: ${PLEX_TOKEN}

          - type: torrenting
            title: Active Torrents
            hosts:
              - url: http://qbittorrent.default.svc.cluster.local
                client: qbittorrent
                username: ${QBITTORRENT_USERNAME}
                password: ${QBITTORRENT_PASSWORD}
            hide-completed: true
            hide-inactive: true
            collapse-after: 5
            update-interval: 30s

          - type: releases
            title: Upstream Releases
            show-source-icon: true
            token: ${GITHUB_TOKEN}
            limit: 10
            collapse-after: 5
            repositories:
              - Panonim/dynacat
              - outline/outline
              - pocket-id/pocket-id
              - mealie-recipes/mealie
              - we-promise/sure
              - seerr-team/seerr
              - autobrr/qui
              - cloudnative-pg/cloudnative-pg
              - valkey-io/valkey

          - type: change-detection
            instance-url: https://changes.hera.ac
            token: ${CHANGE_DETECTION_API_KEY}

          - type: twitch-channels
            channels:
              - ThePrimeagen
              - TheMrSark
              - CallumFromTheCorner
              - SMii7Y
