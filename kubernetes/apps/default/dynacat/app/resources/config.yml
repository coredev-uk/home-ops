---
server:
  host: 0.0.0.0
  port: 8080
  proxied: true
  # Envoy Gateway's pods. Without this Dynacat ignores X-Forwarded-*, so it
  # sees every request as plain HTTP from Envoy: session cookies lose Secure
  # and login rate limits count Envoy, not the visitor.
  trusted-proxies:
    - 10.42.0.0/16
  cache-dir: /app/assets/.cache
  # The config is mounted read-only from a ConfigMap and managed in git, so the
  # web UI editor could never save anyway. Dynacat defaults this to true and
  # warns that it is reachable without authentication, so turn it off.
  allow-editing: false
  # Server-side to-do storage needs a writable, persistent file; the default
  # path resolves under the read-only /app/config.
  db-path: /app/data/dynacat.db

# Pocket ID only (client "Home"): no local users, so the password form goes
# and the login page hands straight over to id.hera.ac.
auth:
  secret-key: ${AUTH_SECRET_KEY}
  disable-password: true
  auto-redirect-oidc: true
  oidc:
    issuer-url: https://id.hera.ac
    client-id: ${OIDC_CLIENT_ID}
    client-secret: ${OIDC_CLIENT_SECRET}
    redirect-url: https://home.hera.ac/api/oidc/callback

# Meridian, the desktop's system palette (lib/theme in ~/.dotfiles). These HSL
# values are the base tokens Dynacat derives from; meridian.css (the
# dynacat-theme ConfigMap, served under /assets/meridian/) assigns the rest of
# the palette by role and sets the type. One theme, no picker.
theme:
  background-color: 218 21 10
  primary-color: 41 53 55
  positive-color: 158 31 57
  negative-color: 8 68 62
  disable-picker: true
  custom-css-file: /assets/meridian/meridian.css

# The Hera mark (resources/theme): an H whose crossbar carries a gilt dot.
# icon.svg is the tab favicon on its plate; app-icon.png is a full-bleed
# square the home screen rounds itself. No logo-url: the navigation it would
# sit in is hidden.
branding:
  favicon-url: /assets/meridian/icon.svg
  app-icon-url: /assets/meridian/app-icon.png
  app-background-color: "#151920"

pages:
  - name: Home
    # The only page, so the navigation bar has nothing to switch between.
    hide-desktop-navigation: true
    head-widgets:
      - type: monitor
        title: Critical Services
        style: compact
        show-failing-only: true
        show-history: true
        update-interval: 1m
        sites:
          - title: Plex
            url: https://plex.hera.ac/web
            check-url: https://plex.hera.ac/identity
            icon: si:plex
          - title: Seerr
            url: https://seerr.hera.ac
            icon: sh:jellyseerr-light
          - title: Radarr
            url: https://radarr.hera.ac
            icon: si:radarr
          - title: Sonarr
            url: https://sonarr.hera.ac
            icon: si:sonarr
          - title: SABnzbd
            url: https://sabnzbd.hera.ac
            icon: sh:sabnzbd-light
          - title: qBittorrent
            url: https://qbittorrent.hera.ac
            icon: si:qbittorrent
          - title: Home Assistant
            url: https://hass.hera.ac
            icon: si:homeassistant

    columns:
      # Infrastructure: the cluster, the network and the money.
      - size: small
        widgets:
          # From Prometheus rather than server-stats: server-stats reports the
          # load average as CPU, which on these nodes counts tasks waiting on
          # Ceph I/O and reads several times the real use. CPU here is the
          # time not idle, in iowait or stolen, over 2m; RAM is
          # MemTotal - MemAvailable; disk is /var, Talos's EPHEMERAL
          # partition; temperature is the hottest coretemp sensor.
          - type: custom-api
            title: Cluster Nodes
            title-url: https://grafana.hera.ac
            cache: 1m
            url: &prometheus http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090/api/v1/query
            parameters:
              query: node_uname_info{job="node-exporter"}
            subrequests:
              up:
                url: *prometheus
                parameters:
                  query: up{job="node-exporter"}
              boot:
                url: *prometheus
                parameters:
                  query: node_boot_time_seconds{job="node-exporter"}
              cores:
                url: *prometheus
                parameters:
                  query: count by (instance) (node_cpu_seconds_total{job="node-exporter",mode="idle"})
              cpu:
                url: *prometheus
                parameters:
                  query: 100 * sum by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode!~"idle|iowait|steal"}[2m])) / count by (instance) (node_cpu_seconds_total{job="node-exporter",mode="idle"})
              iowait:
                url: *prometheus
                parameters:
                  query: 100 * avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter",mode="iowait"}[2m]))
              mem:
                url: *prometheus
                parameters:
                  query: 100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
              mem-total:
                url: *prometheus
                parameters:
                  query: node_memory_MemTotal_bytes{job="node-exporter"}
              disk:
                url: *prometheus
                parameters:
                  query: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var"})
              temp:
                url: *prometheus
                parameters:
                  query: max by (instance) (node_hwmon_temp_celsius{job="node-exporter",chip=~"platform_coretemp_.*"})
            template: |
              {{ $up := .Subrequest "up" }}
              {{ $boot := .Subrequest "boot" }}
              {{ $cores := .Subrequest "cores" }}
              {{ $cpu := .Subrequest "cpu" }}
              {{ $iowait := .Subrequest "iowait" }}
              {{ $mem := .Subrequest "mem" }}
              {{ $memTotal := .Subrequest "mem-total" }}
              {{ $disk := .Subrequest "disk" }}
              {{ $temp := .Subrequest "temp" }}
              {{ range sortByString "metric.nodename" "asc" (.JSON.Array "data.result") }}
              {{ $q := concat "data.result.#(metric.instance==\"" (.String "metric.instance") "\").value.1" }}
              {{ $reachable := eq ($up.JSON.String $q) "1" }}
              {{ $c := $cpu.JSON.Float $q }}
              {{ $m := $mem.JSON.Float $q }}
              {{ $d := $disk.JSON.Float $q }}
              {{ $t := $temp.JSON.Float $q }}
              <div class="node">
                <div class="status-row">
                  <span class="status-dot {{ if $reachable }}is-ok{{ else }}is-down{{ end }}"></span>
                  <span class="color-highlight grow min-width-0 text-truncate">{{ .String "metric.nodename" }}</span>
                  {{ if $reachable }}
                  <span class="status-state">up <span {{ $boot.JSON.String $q | findMatch "^[0-9]+" | parseTime "unix" | toRelativeTime }}></span></span>
                  {{ else }}
                  <span class="status-state is-down">Unreachable</span>
                  {{ end }}
                </div>
                <ul class="list-horizontal-text size-h5 status-meta">
                  <li>{{ $cores.JSON.String $q }} threads</li>
                  <li>{{ printf "%.0f" (div ($memTotal.JSON.Float $q) 1073741824) }} GiB</li>
                  {{ if gt $t 0.0 }}<li{{ if ge $t 80.0 }} class="node-hot"{{ end }}>{{ printf "%.0f" $t }} °C{{ if ge $t 80.0 }} hot{{ end }}</li>{{ end }}
                </ul>
                <div class="node-stats">
                  <div>
                    <div class="node-stat"><span>CPU</span><span class="color-highlight">{{ printf "%.0f" $c }}%</span></div>
                    <div class="progress-bar"><div class="progress-value{{ if ge $c 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $c }}"></div></div>
                    <div class="node-sub">iowait {{ printf "%.0f" ($iowait.JSON.Float $q) }}%</div>
                  </div>
                  <div>
                    <div class="node-stat"><span>RAM</span><span class="color-highlight">{{ printf "%.0f" $m }}%</span></div>
                    <div class="progress-bar"><div class="progress-value{{ if ge $m 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $m }}"></div></div>
                  </div>
                  <div>
                    <div class="node-stat"><span>Disk</span><span class="color-highlight">{{ printf "%.0f" $d }}%</span></div>
                    <div class="progress-bar"><div class="progress-value{{ if ge $d 85.0 }} progress-value-notice{{ end }}" style="--percent: {{ printf "%.0f" $d }}"></div></div>
                  </div>
                </div>
              </div>
              {{ end }}

          # The UniFi gateway's view of the ProtonVPN WireGuard client (which
          # carries the VPN VLAN: qBittorrent and Prowlarr) and the WAN.
          # unifi.internal serves a self-signed cert.
          - type: custom-api
            title: Network
            title-url: https://unifi.internal/network/default/vpn
            cache: 1m
            allow-insecure: true
            url: https://unifi.internal/proxy/network/v2/api/site/default/vpn/connections
            headers: &unifi-headers
              X-API-KEY: ${UNIFI_API_KEY}
              Accept: application/json
            subrequests:
              health:
                url: https://unifi.internal/proxy/network/api/s/default/stat/health
                allow-insecure: true
                headers: *unifi-headers
              networks:
                url: https://unifi.internal/proxy/network/api/s/default/rest/networkconf
                allow-insecure: true
                headers: *unifi-headers
              routes:
                url: https://unifi.internal/proxy/network/v2/api/site/default/trafficroutes
                allow-insecure: true
                headers: *unifi-headers
            template: |
              {{ $health := .Subrequest "health" }}
              {{ $networks := .Subrequest "networks" }}
              {{ $routes := .Subrequest "routes" }}
              <ul class="list list-gap-14">
                {{ range .JSON.Array "connections" }}
                {{ $id := .String "network_id" }}
                {{ $up := eq (.String "status") "CONNECTED" }}
                {{ $route := $routes.JSON.Array (concat "#(network_id==\"" $id "\")#") }}
                {{/* Proton names the server in the config's [Peer] comment
                     (e.g. CH#1119); ip-api.com places its endpoint. */}}
                {{ $server := findSubmatch "\\[Peer\\]\\s*#\\s*(\\S+)" ($networks.JSON.String (concat "data.#(_id==\"" $id "\").wireguard_client_configuration_file")) }}
                {{ $geo := getResponse (newRequest (concat "http://ip-api.com/json/" (.String "remote_ip") "?fields=status,country,city")) }}
                <li>
                  <div class="status-row">
                    <span class="status-dot {{ if $up }}is-on{{ else }}is-down{{ end }}"></span>
                    <span class="color-highlight grow min-width-0 text-truncate">{{ $networks.JSON.String (concat "data.#(_id==\"" $id "\").name") }}</span>
                    {{ if $up }}
                    <span class="status-state is-on">Connected</span>
                    {{ else }}
                    <span class="status-state is-down">{{ .String "status" | replaceAll "_" " " }}</span>
                    {{ end }}
                  </div>
                  <ul class="list-horizontal-text size-h5 status-meta">
                    {{ if eq ($geo.JSON.String "status") "success" }}<li class="color-highlight">{{ $geo.JSON.String "city" }}, {{ $geo.JSON.String "country" }}</li>{{ end }}
                    {{ if $server }}<li>{{ $server }}</li>{{ end }}
                    <li>{{ .String "remote_ip" }}</li>
                    {{ if $up }}<li>connected <span {{ .String "assoc_time" | parseTime "unix" | toRelativeTime }}></span></li>{{ end }}
                    <li>down {{ printf "%.1f" (div (.Float "rx_rate_bps") 1000000) }} · up {{ printf "%.1f" (div (.Float "tx_rate_bps") 1000000) }} Mbps</li>
                  </ul>
                  {{ range $route }}
                  {{ $target := .String "target_devices.0.network_id" }}
                  <ul class="list-horizontal-text size-h5 status-meta">
                    <li>Routes {{ $networks.JSON.String (concat "data.#(_id==\"" $target "\").name") }}</li>
                    <li>{{ if .Bool "kill_switch_enabled" }}kill switch on{{ else }}<span class="color-negative">no kill switch</span>{{ end }}</li>
                  </ul>
                  {{ end }}
                </li>
                {{ end }}

                <li>
                  {{ $wan := "data.#(subsystem==\"wan\")" }}
                  {{ $www := "data.#(subsystem==\"www\")" }}
                  {{ $wanUp := eq ($health.JSON.String (concat $wan ".status")) "ok" }}
                  <div class="status-row">
                    <span class="status-dot {{ if $wanUp }}is-ok{{ else }}is-down{{ end }}"></span>
                    <span class="color-highlight grow min-width-0 text-truncate">{{ $health.JSON.String (concat $wan ".isp_name") }}</span>
                    <span class="status-state">{{ $health.JSON.Int (concat $www ".latency") }} ms</span>
                  </div>
                  <ul class="list-horizontal-text size-h5 status-meta">
                    <li>{{ $health.JSON.String (concat $wan ".wan_ip") }}</li>
                    <li>down {{ printf "%.0f" ($health.JSON.Float (concat $www ".xput_down")) }} · up {{ printf "%.0f" ($health.JSON.Float (concat $www ".xput_up")) }} Mbps</li>
                  </ul>
                </li>
              </ul>

          # Pi-hole runs passwordless (admin.enabled: false); dynacat >= 3.0.2
          # skips /api/auth when no password is set (Panonim/dynacat#177).
          # pihole-web load-balances across both replicas, and each keeps its
          # own FTL stats, so figures reflect whichever pod answered.
          - type: dns-stats
            service: pihole-v6
            url: http://pihole-web.network.svc.cluster.local
            hour-format: "24h"

          - type: speedtest
            update-interval: 6h

          - type: group
            widgets:
              # Live from Sure, so it follows trades without editing: each
              # investment account's value, its market gain over 30 days
              # (net_market_flows, so deposits don't count as growth) and its
              # largest holdings. Sure's API formats amounts as money strings
              # and has no sort, so holdings are ranked by their digits,
              # space-padded so a text sort is a numeric one; USD and GBP rank
              # together at face value.
              - type: custom-api
                title: Portfolio
                title-url: https://sure.hera.ac
                cache: 15m
                url: http://sure.default.svc.cluster.local:3000/api/v1/accounts
                headers:
                  X-Api-Key: ${SURE_API_KEY}
                parameters:
                  per_page: "100"
                options:
                  api-key: ${SURE_API_KEY}
                template: |
                  {{ $key := .Options.StringOr "api-key" "" }}
                  {{ $api := "http://sure.default.svc.cluster.local:3000/api/v1/" }}
                  {{ range .JSON.Array "accounts.#(account_type==\"investment\")#" }}
                  {{ $id := .String "id" }}
                  {{ $balances := newRequest (concat $api "balances") | withHeader "X-Api-Key" $key | withParameter "account_id" $id | withParameter "start_date" (offsetNow "-720h" | formatTime "DateOnly") | withParameter "per_page" "100" | getResponse }}
                  {{ $gain := 0 }}
                  {{ range $balances.JSON.Array "balances" }}{{ $gain = add $gain (.Int "net_market_flows_cents") }}{{ end }}
                  {{ $abs := $gain }}{{ if lt $gain 0 }}{{ $abs = sub 0 $gain }}{{ end }}
                  {{ $count := $balances.JSON.Int "balances.#" }}
                  {{ $start := $balances.JSON.Int (printf "balances.%d.start_balance_cents" (sub $count 1)) }}
                  {{ $holdings := newRequest (concat $api "holdings") | withHeader "X-Api-Key" $key | withParameter "account_id" $id | withParameter "date" ($balances.JSON.String "balances.0.date") | withParameter "per_page" "100" | getResponse }}
                  {{ $ranked := list }}
                  {{ range $holdings.JSON.Array "holdings" }}
                  {{ if ne (.Float "qty") 0.0 }}
                  {{ $ranked = append $ranked (concat (printf "%14s" (replaceMatches "[^0-9]" "" (.String "amount"))) "|" (.String "security.ticker") "|" (.String "security.name") "|" (.String "amount")) }}
                  {{ end }}
                  {{ end }}
                  {{ $ranked = sortAlpha $ranked }}
                  {{ $n := len $ranked }}
                  <div class="portfolio-account">
                    <div class="flex justify-between items-baseline gap-10">
                      <span class="color-highlight text-truncate">{{ .String "name" | replaceMatches " \\(\\d+\\)$" "" }}</span>
                      <span class="size-h3 color-highlight shrink-0">{{ .String "balance" }}</span>
                    </div>
                    <div class="size-h5 color-subdue">
                      Market, 30 days:
                      <span class="{{ if ge $gain 0 }}color-positive{{ else }}color-negative{{ end }}">{{ if ge $gain 0 }}+{{ else }}−{{ end }}£{{ formatNumber (div $abs 100) }}{{ if gt $start 0 }} ({{ printf "%+.1f" (div (mul (toFloat $gain) 100.0) (toFloat $start)) }}%){{ end }}</span>
                    </div>
                    <ul class="list list-gap-8 margin-top-10">
                      {{ range $k := list 1 2 3 4 5 }}
                      {{ if le $k $n }}
                      {{ $row := index $ranked (sub $n $k) }}
                      <li class="flex items-baseline gap-10">
                        <span class="color-highlight shrink-0">{{ findSubmatch "^[^|]*\\|([^|]*)\\|" $row }}</span>
                        <span class="grow min-width-0 text-truncate color-subdue">{{ findSubmatch "^[^|]*\\|[^|]*\\|([^|]*)\\|" $row }}</span>
                        <span class="shrink-0">{{ findSubmatch "\\|([^|]*)$" $row }}</span>
                      </li>
                      {{ end }}
                      {{ end }}
                    </ul>
                    {{ if gt $n 5 }}<div class="size-h5 color-subdue margin-top-10">and {{ sub $n 5 }} smaller holdings</div>{{ end }}
                  </div>
                  {{ end }}

              # Crypto accounts from Sure (Coinbase), largest first: what each
              # holds and is worth. No period change: Sure keeps no crypto
              # price history, so holdings carry the purchase price forward
              # until the live price lands, and any change would be that jump.
              - type: custom-api
                title: Crypto
                title-url: https://sure.hera.ac
                cache: 30m
                url: http://sure.default.svc.cluster.local:3000/api/v1/accounts
                headers:
                  X-Api-Key: ${SURE_API_KEY}
                parameters:
                  per_page: "100"
                options:
                  api-key: ${SURE_API_KEY}
                template: |
                  {{ $key := .Options.StringOr "api-key" "" }}
                  {{ $api := "http://sure.default.svc.cluster.local:3000/api/v1/" }}
                  {{ $accounts := sortByInt "balance_cents" "desc" (.JSON.Array "accounts.#(account_type==\"crypto\")#") }}
                  {{ if eq (len $accounts) 0 }}
                  <p class="color-subdue">No crypto accounts in Sure.</p>
                  {{ else }}
                  {{ $symbol := findMatch "^[^0-9]+" ((index $accounts 0).String "balance") }}
                  {{ $total := 0 }}
                  {{ range $accounts }}{{ $total = add $total (.Int "balance_cents") }}{{ end }}
                  <div class="flex justify-between items-baseline gap-10">
                    <span class="color-highlight">{{ (index $accounts 0).String "institution_name" }}</span>
                    <span class="size-h3 color-highlight shrink-0">{{ $symbol }}{{ formatNumber (div $total 100) }}.{{ printf "%02d" (mod $total 100) }}</span>
                  </div>
                  <ul class="list list-gap-10 margin-top-10">
                    {{ range $accounts }}
                    {{ $id := .String "id" }}
                    {{ $balances := newRequest (concat $api "balances") | withHeader "X-Api-Key" $key | withParameter "account_id" $id | withParameter "per_page" "1" | getResponse }}
                    {{ $holding := newRequest (concat $api "holdings") | withHeader "X-Api-Key" $key | withParameter "account_id" $id | withParameter "date" ($balances.JSON.String "balances.0.date") | withParameter "per_page" "1" | getResponse }}
                    {{ $coin := $holding.JSON.String "holdings.0.security.ticker" | trimPrefix "CRYPTO:" }}
                    <li>
                      <div class="flex items-baseline gap-10">
                        <span class="color-highlight shrink-0">{{ $coin }}</span>
                        <span class="grow min-width-0 text-truncate color-subdue">{{ .String "name" }}</span>
                        <span class="shrink-0">{{ .String "balance" }}</span>
                      </div>
                      <div class="size-h5 color-subdue">
                        {{ $holding.JSON.String "holdings.0.qty" }} {{ $coin }}
                      </div>
                    </li>
                    {{ end }}
                  </ul>
                  {{ end }}

      - size: full
        widgets:
          - type: search
            hide-header: true
            autofocus: true
            new-tab: true
            search-engine: google
            autocomplete: true
            autocomplete-provider: brave
            bangs:
              - title: YouTube
                shortcut: "!y"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Amazon
                shortcut: "!a"
                url: https://www.amazon.co.uk/s?k={QUERY}

          - type: latest-media
            title: Recently Added
            update-interval: 30m
            item-count: 12
            columns: 6
            hosts:
              - url: plex:http://plex.default.svc.cluster.local:32400
                token: ${PLEX_TOKEN}
                public-url: https://plex.hera.ac

          # Six groups, so the grid fills evenly at both three columns (wide)
          # and two (laptop): the cluster row first, then the media row.
          - type: bookmarks
            title: Services
            groups:
              - title: Infrastructure
                links:
                  - title: UniFi
                    url: https://unifi.internal
                    icon: si:ubiquiti
                  - title: UNAS
                    url: https://expanse.internal
                    icon: si:ubiquiti
                  - title: Pi-hole
                    url: https://pihole.hera.ac
                    icon: si:pihole
                  - title: Rook Ceph
                    url: https://rook.hera.ac
                    icon: di:rook
                  - title: Flux Operator
                    url: https://flux-operator.hera.ac
                    icon: di:flux-cd
                  - title: Pocket ID
                    url: https://id.hera.ac
                    icon: sh:pocket-id

              - title: Monitoring
                links:
                  - title: Status
                    url: https://status.hera.ac
                    icon: di:gatus
                  - title: Grafana
                    url: https://grafana.hera.ac
                    icon: si:grafana
                  - title: Prometheus
                    url: https://prometheus.hera.ac
                    icon: si:prometheus
                  - title: Alertmanager
                    url: https://alertmanager.hera.ac
                    icon: si:prometheus
                  - title: Change Detection
                    url: https://changes.hera.ac
                    icon: si:changedetection

              - title: Personal
                links:
                  - title: Home Assistant
                    url: https://hass.hera.ac
                    icon: si:homeassistant
                  - title: Docs
                    url: https://docs.hera.ac
                    icon: si:outline
                  - title: Mealie
                    url: https://mealie.hera.ac
                    icon: si:mealie
                  - title: Sure
                    url: https://sure.hera.ac
                    icon: mdi:finance

              - title: Watch
                links:
                  - title: Plex
                    url: https://plex.hera.ac/web
                    icon: si:plex
                  - title: Seerr
                    url: https://seerr.hera.ac
                    icon: sh:jellyseerr-light
                  - title: Tautulli
                    url: https://tautulli.hera.ac
                    icon: sh:tautulli
                  - title: Maintainerr
                    url: https://maintainerr.hera.ac
                    icon: sh:maintainerr

              - title: Library
                links:
                  - title: Radarr
                    url: https://radarr.hera.ac
                    icon: si:radarr
                  - title: Sonarr
                    url: https://sonarr.hera.ac
                    icon: si:sonarr
                  - title: Sportarr
                    url: https://sportarr.hera.ac
                    icon: di:sportarr
                  - title: Bazarr
                    url: https://bazarr.hera.ac
                    icon: sh:bazarr-light
                  - title: Profilarr
                    url: https://profilarr.hera.ac
                    icon: di:profilarr

              - title: Downloads
                links:
                  - title: Prowlarr
                    url: https://prowlarr.hera.ac
                    icon: sh:prowlarr-light
                  - title: SABnzbd
                    url: https://sabnzbd.hera.ac
                    icon: sh:sabnzbd-light
                  - title: Qui
                    url: https://qui.hera.ac
                    icon: di:qui

          # What needs a look: firing alerts (Watchdog and other severity
          # "none" heartbeats left out), Flux objects that failed to
          # reconcile, and the repo's open pull requests.
          - type: custom-api
            title: Health
            title-url: https://alertmanager.hera.ac
            cache: 1m
            url: http://kube-prometheus-stack-alertmanager.o11y.svc.cluster.local:9093/api/v2/alerts
            parameters:
              active: "true"
              silenced: "false"
              inhibited: "false"
            subrequests:
              flux-failing:
                url: http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090/api/v1/query
                parameters:
                  query: gotk_resource_info{ready="False"}
              flux-ready:
                url: http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090/api/v1/query
                parameters:
                  query: count(gotk_resource_info{ready="True"})
              source:
                url: http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090/api/v1/query
                parameters:
                  query: gotk_resource_info{customresource_kind="GitRepository",exported_namespace="flux-system",name="flux-system"}
              pulls:
                url: https://api.github.com/search/issues
                headers:
                  Authorization: Bearer ${GITHUB_TOKEN}
                  Accept: application/vnd.github+json
                parameters:
                  q: repo:coredev-uk/home-ops is:pr is:open
            template: |
              {{ $alerts := .JSON.Array "#(labels.severity!=\"none\")#" }}
              {{ $failing := (.Subrequest "flux-failing").JSON.Array "data.result" }}
              {{ $ready := (.Subrequest "flux-ready").JSON.String "data.result.0.value.1" }}
              {{ $revision := (.Subrequest "source").JSON.String "data.result.0.metric.revision" }}
              {{ $sha := findSubmatch "sha1:([0-9a-f]{7})" $revision }}
              {{ $pulls := (.Subrequest "pulls").JSON.Int "total_count" }}
              <ul class="list list-gap-14">
                {{ if and (eq (len $alerts) 0) (eq (len $failing) 0) }}
                <li>
                  <div class="status-row">
                    <span class="status-dot is-ok"></span>
                    <span class="color-highlight grow">Nothing needs attention</span>
                  </div>
                  <ul class="list-horizontal-text size-h5 status-meta">
                    <li>No alerts firing</li>
                    <li>{{ $ready }} Flux objects ready</li>
                  </ul>
                </li>
                {{ end }}

                {{ range sortByString "labels.severity" "asc" $alerts }}
                {{ $severity := .String "labels.severity" }}
                <li>
                  <div class="status-row">
                    <span class="status-dot {{ if eq $severity "critical" }}is-down{{ else if eq $severity "warning" }}is-warn{{ end }}"></span>
                    <a class="color-highlight grow min-width-0 text-truncate" href="{{ .String "generatorURL" }}" target="_blank" rel="noreferrer">{{ .String "labels.alertname" }}</a>
                    <span class="status-state" {{ .String "startsAt" | parseTime "rfc3339" | toRelativeTime }}></span>
                  </div>
                  <ul class="list-horizontal-text size-h5 status-meta">
                    <li>{{ $severity }}</li>
                    {{ if .String "labels.namespace" }}<li>{{ .String "labels.namespace" }}</li>{{ end }}
                    <li>{{ .String "annotations.summary" }}</li>
                  </ul>
                </li>
                {{ end }}

                {{ range $failing }}
                <li>
                  <div class="status-row">
                    <span class="status-dot is-down"></span>
                    <span class="color-highlight grow min-width-0 text-truncate">{{ .String "metric.exported_namespace" }}/{{ .String "metric.name" }}</span>
                    <span class="status-state is-down">Not ready</span>
                  </div>
                  <ul class="list-horizontal-text size-h5 status-meta">
                    <li>{{ .String "metric.customresource_kind" }}</li>
                  </ul>
                </li>
                {{ end }}

                <li>
                  <div class="status-row">
                    <span class="status-dot"></span>
                    <a class="color-highlight grow" href="https://github.com/coredev-uk/home-ops/pulls" target="_blank" rel="noreferrer">{{ $pulls }} open pull request{{ if ne $pulls 1 }}s{{ end }}</a>
                    {{ if $sha }}<a class="status-state" href="https://github.com/coredev-uk/home-ops/commit/{{ $sha }}" target="_blank" rel="noreferrer">main @ {{ $sha }}</a>{{ end }}
                  </div>
                </li>
              </ul>

          - type: to-do
            id: home-ops
            storage: server
            collapse-after: 10

          - type: rss
            style: horizontal-cards
            title: Tech News
            feeds:
              - url: https://itsfoss.com/rss/
                title: "It's FOSS"
              - url: https://www.techradar.com/uk/feeds.xml
                title: "TechRadar"
              - url: https://9to5mac.com/feed/
                title: "9to5Mac"
              - url: https://hackernewsrss.com/feed.xml
                title: "HackerNews"
            limit: 8

          - type: group
            widgets:
              - type: hacker-news
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: unixporn
                show-thumbnails: true
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: technology
                limit: 10
                collapse-after: 5
              - type: reddit
                subreddit: ubiquiti
                limit: 10
                collapse-after: 5

      # The day: what's on, what's playing, what's coming.
      - size: small
        widgets:
          - type: weather
            location: ${WEATHER_LOCATION}
            show-area-name: true

          - type: calendar
            show-release-state: true
            hosts:
              - url: radarr:http://radarr.default.svc.cluster.local
                token: ${RADARR_API_KEY}
                public-url: https://radarr.hera.ac
              - url: sonarr:http://sonarr.default.svc.cluster.local
                token: ${SONARR_API_KEY}
                public-url: https://sonarr.hera.ac

          - type: playing
            hosts:
              - url: plex:http://plex.default.svc.cluster.local:32400
                token: ${PLEX_TOKEN}

          - type: torrenting
            title: Active Torrents
            hosts:
              - url: http://qbittorrent.default.svc.cluster.local
                client: qbittorrent
                username: ${QBITTORRENT_USERNAME}
                password: ${QBITTORRENT_PASSWORD}
            hide-completed: true
            hide-inactive: true
            collapse-after: 5
            update-interval: 30s

          - type: releases
            title: Upstream Releases
            show-source-icon: true
            token: ${GITHUB_TOKEN}
            limit: 10
            collapse-after: 5
            repositories:
              - Panonim/dynacat
              - outline/outline
              - pocket-id/pocket-id
              - mealie-recipes/mealie
              - we-promise/sure
              - seerr-team/seerr
              - autobrr/qui
              - cloudnative-pg/cloudnative-pg
              - valkey-io/valkey

          - type: change-detection
            instance-url: https://changes.hera.ac
            token: ${CHANGE_DETECTION_API_KEY}

          - type: twitch-channels
            channels:
              - ThePrimeagen
              - TheMrSark
              - CallumFromTheCorner
              - SMii7Y
