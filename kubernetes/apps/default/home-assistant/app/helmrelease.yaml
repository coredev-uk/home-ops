---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.3@sha256:96c244d8aa3586026bb8d4fdc0dcf9b34f348874a1ea5060942356cf181177bc
            env:
              TZ: Europe/London
              HASS_AUTH_OIDC_DISCOVERY_URL: https://id.hera.ac/.well-known/openid-configuration
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8123
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                memory: 592Mi
                cpu: 10m
              limits:
                memory: 1Gi
          # Sidecar so the WebSocket stays on the pod's localhost (Matter integration URL:
          # ws://localhost:5580/ws). Fabric data lives on the config volume and is backed up with it.
          matter:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.6.1@sha256:5591f9f65926ca4b13b34cfd9c9888cb9d9ee9f147fe0b04c8e025cbeeee0eb7
            env:
              STORAGE_PATH: /config/matter
              LISTEN_ADDRESS: 127.0.0.1
              PRIMARY_INTERFACE: net1
              MATTER_LOG_FORMAT: plain
              NODE_OPTIONS: --max-old-space-size=384
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/local/bin/healthcheck.sh"]
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                memory: 128Mi
                cpu: 10m
              limits:
                memory: 512Mi
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: ceph-block
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
    defaultPodOptions:
      # A second interface (net1) on the IoT VLAN, beside the HomePod and the IoT devices: mDNS,
      # IPv6 link-local and the HomePod's Thread routes for Matter, HomeKit and discovery.
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.130.20/24"],
            "mac": "02:bd:e6:84:38:74"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
          - hass.hera.ac
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/configuration.yaml
            subPath: configuration.yaml
            readOnly: true
          - path: /config/ui-lovelace.yaml
            subPath: ui-lovelace.yaml
            readOnly: true
          - path: /config/themes/hera-glass.yaml
            subPath: hera-glass.yaml
            readOnly: true
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      deps:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /config/deps
            readOnly: false
      tmp:
        type: emptyDir
