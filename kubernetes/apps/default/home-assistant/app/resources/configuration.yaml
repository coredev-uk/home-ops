---
default_config:

homeassistant:
  latitude: !env_var HASS_LATITUDE
  longitude: !env_var HASS_LONGITUDE
  elevation: !env_var HASS_ELEVATION
  time_zone: Europe/London

auth_oidc:
  client_id: !env_var HASS_AUTH_OIDC_CLIENT_ID
  client_secret: !env_var HASS_AUTH_OIDC_CLIENT_SECRET ""
  discovery_url: !env_var HASS_AUTH_OIDC_DISCOVERY_URL
  display_name: HyperionID
  roles:
    admin: cluster_admin

frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
