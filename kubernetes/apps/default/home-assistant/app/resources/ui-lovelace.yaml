            title: Yesterday
            entities:
              - entity: sensor.octopus_energy_gas_461654_7514536408_previous_accumulative_consumption_kwh
              - entity: sensor.octopus_energy_gas_461654_7514536408_previous_accumulative_cost
              - entity: sensor.octopus_energy_gas_461654_7514536408_previous_rate
      - type: grid
        title: Octoplus
        cards:
          - type: entities
            title: Rewards
            entities:
