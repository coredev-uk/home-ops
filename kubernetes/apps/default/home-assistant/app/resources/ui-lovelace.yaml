---
# Pulled every entity_id below from the live /config/.storage/core.entity_registry
# and core.config_entries on the running pod - these are real, not guesses.
#
# Known gaps (see Media Stack / Household views for details):
#   - Sonarr/Radarr are connected but produce zero entities: no monitored
#     conditions are ticked in their integration options. Settings > Devices
#     & Services > [Sonarr|Radarr] > Configure > tick Queue/Wanted/Upcoming/
#     Diskspace, and the sensors above will appear.
#   - Plex is connected but failing: logs show a refused connection to its
#     remote relay address (178.79.172.216:8443), not your LAN address.
#     Check Plex's Remote Access setting / the direct local URL.
#   - qBittorrent, SABnzbd, Pi-hole, Mealie, Seerr, Tautulli, UK Bin
#     Collection: no config entry exists yet - not started.
#   - No HomePod media_player exists (no Apple TV/pyatv integration set up) -
#     UniFi just sees it as a network client (device_tracker.paulshoepodmini).
#   - Octopus Energy: the 7 "ignore"d config entries are dismissed Energy
#     Dashboard cost-tracker suggestions, not a real setup - matches needing
#     the smart hub first.
#   - VW car has no device_tracker (GPS) entity - likely one of the commands
#     hidden by the legacy-gateway 401 flagged earlier. Not an EV, so no
#     battery/range sensors either.

views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.pirateweather
            show_forecast: true
      - type: grid
        title: Quick Controls
        cards:
          - type: tile
            entity: media_player.bravia_k_55xr80
            name: TV
          - type: tile
            entity: lock.garage_volkswagen_579126_central_locking
            name: Car
          - type: tile
            entity: climate.garage_volkswagen_579126_climate_control
            name: Car Climate
      - type: grid
        title: Who's Home
        cards:
          - type: tile
            entity: device_tracker.pauls_iphone
            name: Paul
          - type: tile
            entity: device_tracker.dads_iphone
            name: Dad
          - type: tile
            entity: device_tracker.mums_iphone
            name: Mum
          - type: tile
            entity: device_tracker.bens_macbook_pro
            name: Ben
          - type: tile
            entity: device_tracker.guys_apple_watch
            name: Guy
          - type: tile
            entity: device_tracker.kerrys_apple_watch
            name: Kerry

  - title: Entertainment
    path: entertainment
    icon: mdi:television
    type: sections
    sections:
      - type: grid
        title: Living Room
        cards:
          - type: media-control
            entity: media_player.bravia_k_55xr80
          - type: tile
            entity: remote.bravia_k_55xr80
            name: TV Remote
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              No HomePod media control exists. UniFi only sees it as a
              network client (`device_tracker.paulshoepodmini`) - control
              requires setting up the Apple TV (pyatv) integration against
              it, which hasn't been done yet.

  - title: Network
    path: network
    icon: mdi:router-network
    type: sections
    sections:
      - type: grid
        title: Gateway (PTNET)
        cards:
          - type: tile
            entity: sensor.ptnet_state
            name: State
          - type: tile
            entity: sensor.ptnet_uptime
            name: Uptime
          - type: tile
            entity: sensor.ptnet_clients
            name: Clients
          - type: tile
            entity: sensor.ptnet_cpu_utilisation
            name: CPU
          - type: tile
            entity: sensor.ptnet_memory_utilisation
            name: Memory
      - type: grid
        title: WAN Latency
        cards:
          - type: tile
            entity: sensor.ptnet_cloudflare_wan_latency
            name: Cloudflare
          - type: tile
            entity: sensor.ptnet_google_wan_latency
            name: Google
          - type: tile
            entity: sensor.ptnet_microsoft_wan_latency
            name: Microsoft
      - type: grid
        title: VPN & Remote Access
        cards:
          - type: tile
            entity: switch.unifi_network_protonvpn
            name: ProtonVPN
          - type: tile
            entity: switch.unifi_network_plex_remote_access
            name: Plex Remote Access
      - type: grid
        title: Office Switch - PoE
        cards:
          - type: entities
            title: PTNET-SW-OFFICE Ports
            entities:
              - entity: switch.ptnet_sw_office_port_1_poe
              - entity: switch.ptnet_sw_office_port_2_poe
              - entity: switch.ptnet_sw_office_port_3_poe
              - entity: switch.ptnet_sw_office_port_4_poe
              - entity: sensor.ptnet_sw_office_uptime
              - entity: sensor.ptnet_sw_office_cpu_utilisation
      - type: grid
        title: Network Presence
        cards:
          - type: entities
            title: Devices
            entities:
              - entity: device_tracker.hyperion_0
              - entity: device_tracker.hyperion_1
              - entity: device_tracker.hyperon_2
              - entity: device_tracker.hyperion_unas
              - entity: device_tracker.sony_bravia_8
              - entity: device_tracker.paulshoepodmini
              - entity: device_tracker.macbookpro
              - entity: device_tracker.iphone_2
              - entity: device_tracker.watch

  - title: Media Stack
    path: media-stack
    icon: mdi:server
    type: sections
    sections:
      - type: grid
        title: Needs Attention
        cards:
          - type: markdown
            content: >-
              **Sonarr & Radarr** are connected (config entries exist) but
              expose zero sensors - no monitored conditions were ticked
              during setup. Go to Settings > Devices & Services >
              Sonarr/Radarr > Configure and enable Queue/Wanted/Upcoming/
              Diskspace, then this view can get real cards.


              **Plex** is connected but currently failing: the log shows a
              refused connection to `178.79.172.216:8443` - that's a remote
              relay address, not your LAN. Check whether Remote Access is
              forcing an external route, or re-add the integration pointed
              at the local `plex.direct` LAN address.
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              qBittorrent, SABnzbd, Pi-hole, Mealie, Seerr, and Tautulli
              have no config entry yet - none of these have been added in
              Settings > Devices & Services.

  - title: Household
    path: household
    icon: mdi:home-city
    type: sections
    sections:
      - type: grid
        title: Car
        cards:
          - type: entities
            title: Volkswagen
            entities:
              - entity: lock.garage_volkswagen_579126_central_locking
              - entity: climate.garage_volkswagen_579126_climate_control
              - entity: switch.garage_volkswagen_579126_window_heating
              - entity: switch.garage_volkswagen_579126_active_ventilation
              - entity: sensor.garage_volkswagen_579126_portal_feed_health
              - entity: button.garage_volkswagen_579126_refresh_data
          - type: markdown
            content: >-
              No location/GPS entity exists for this car - likely one of
              the commands the legacy-gateway 401 hides. Not an EV, so no
              battery/range sensors either.
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              Bin collection (UK Bin Collection Data) and Mealie have no
              config entry yet.
