            name: Rate Today
            entities:
              - sensor.octopus_energy_electricity_d06g503888_1460001146039_current_rate
            hours_to_show: 24
            points_per_hour: 2
            show:
              extrema: true
      - type: grid
        title: Gas
        cards:
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_current_rate
            name: Current Rate
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_next_rate
            name: Next Rate
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_current_standing_charge
            name: Standing Charge
