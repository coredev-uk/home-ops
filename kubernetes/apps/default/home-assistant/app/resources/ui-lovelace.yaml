            content: >-
              No location/GPS entity exists for this car - likely one of
              the commands the legacy-gateway 401 hides. Not an EV, so no
              battery/range sensors either.
      - type: grid
        title: Meal Planning
        cards:
          - type: todo-list
            entity: todo.mealie_shopping_list
            title: Shopping List
          - type: calendar
            title: This Week's Meals
            entities:
