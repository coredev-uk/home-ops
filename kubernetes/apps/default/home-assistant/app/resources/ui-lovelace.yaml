---
# Pulled every entity_id below from the live /config/.storage/core.entity_registry
# and core.config_entries on the running pod - these are real, not guesses.
#
# Known gaps (see Media Stack / Household views for details):
#   - Pi-hole: not addable while running passwordless - its integration
#     requires an app password/API key that passwordless mode doesn't issue.
#   - UK Bin Collection: Gloucester's council site needs a Selenium web
#     driver (JS-rendered page) - now reachable at
#     http://changedetection-selenium:4444/wd/hub (reusing changedetection's
#     sidecar), use that when adding the integration.
#   - Seerr: not added (not using it, or deferred).
#   - No HomePod media_player exists (no Apple TV/pyatv integration set up) -
#     UniFi just sees it as a network client (device_tracker.paulshoepodmini).
#   - VW car has no device_tracker (GPS) entity - likely one of the commands
#     hidden by the legacy-gateway 401 flagged earlier. Not an EV, so no
#     battery/range sensors either.

views:
  - title: Entertainment
    path: entertainment
    icon: mdi:television
    type: sections
    sections:
      - type: grid
        title: Living Room
        cards:
          - type: media-control
            entity: media_player.bravia_k_55xr80
          - type: tile
            entity: remote.bravia_k_55xr80
            name: TV Remote
          - type: media-control
            entity: media_player.plex_plex_for_android_tv_living_room_tv
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              No HomePod media control exists. UniFi only sees it as a
              network client (`device_tracker.paulshoepodmini`) - control
              requires setting up the Apple TV (pyatv) integration against
              it, which hasn't been done yet.

  - title: Network
    path: network
    icon: mdi:router-network
    type: sections
    sections:
      - type: grid
        title: Gateway (PTNET)
        cards:
          - type: tile
            entity: sensor.ptnet_state
            name: State
          - type: tile
            entity: sensor.ptnet_uptime
            name: Uptime
          - type: tile
            entity: sensor.ptnet_clients
            name: Clients
          - type: tile
            entity: sensor.ptnet_cpu_utilisation
            name: CPU
          - type: tile
            entity: sensor.ptnet_memory_utilisation
            name: Memory
      - type: grid
        title: VPN & Remote Access
        cards:
          - type: tile
            entity: switch.unifi_network_protonvpn
            name: ProtonVPN
          - type: tile
            entity: switch.unifi_network_plex_remote_access
            name: Plex Remote Access
      - type: grid
        title: Office Switch
        cards:
          - type: entities
            title: PTNET-SW-OFFICE
            entities:
              - entity: sensor.ptnet_sw_office_uptime
              - entity: sensor.ptnet_sw_office_cpu_utilisation
              - entity: button.ptnet_sw_office_port_1_power_cycle
              - entity: button.ptnet_sw_office_port_2_power_cycle
              - entity: button.ptnet_sw_office_port_3_power_cycle
              - entity: button.ptnet_sw_office_port_4_power_cycle
      - type: grid
        title: Network Presence
        cards:
          - type: entities
            title: Devices
            entities:
              - entity: device_tracker.hyperion_0
              - entity: device_tracker.hyperion_1
              - entity: device_tracker.hyperon_2
              - entity: device_tracker.hyperion_unas
              - entity: device_tracker.sony_bravia_8
      - type: grid
        title: Not Yet Enabled
        cards:
          - type: markdown
            content: >-
              WAN latency (Cloudflare/Google/Microsoft), the office switch's
              per-port PoE power draw, and device trackers for iPhone/
              MacBook/HomePod mini/Watch are all disabled by default on the
              UniFi integration. The power-cycle buttons above work as a
              substitute for PoE toggle switches, which are also disabled.
              Enable what you want in Settings > Devices & Services > UniFi
              Network > Entities.

  - title: Media Stack
    path: media-stack
    icon: mdi:server
    type: sections
    sections:
      - type: grid
        title: Plex & Tautulli
        cards:
          - type: entities
            title: Plex Library
            entities:
              - entity: sensor.hyperion
              - entity: button.hyperion_scan_clients
              - entity: update.hyperion_update
          - type: entities
            title: Now Playing
            entities:
              - entity: sensor.tautulli_watching
              - entity: sensor.tautulli_total_bandwidth
              - entity: sensor.paul_thompson_state
              - entity: sensor.mum_state
              - entity: sensor.b_t33_state
          - type: markdown
            content: >-
              A lot of Plex/Tautulli sensors (library counts, top
              film/show/user, direct plays/streams, per-user title/progress/
              resolution) are disabled by default by those integrations -
              they're not missing, just never turned on. Enable the ones you
              want in Settings > Devices & Services > [Plex|Tautulli] >
              Entities, and I'll add them back here.
      - type: grid
        title: Sonarr / Radarr
        cards:
          - type: entities
            title: Sonarr
            entities:
              - entity: sensor.sonarr_upcoming
              - entity: calendar.sonarr
          - type: entities
            title: Radarr
            entities:
              - entity: sensor.radarr_disk_space_movies
              - entity: binary_sensor.radarr_health
              - entity: calendar.radarr
          - type: markdown
            content: >-
              Shows/Queue/Wanted/Commands (Sonarr) and Films/Queue (Radarr)
              are disabled by default. Enable them in Settings > Devices &
              Services > [Sonarr|Radarr] > Entities, and I'll add them back.
      - type: grid
        title: Downloads
        cards:
          - type: entities
            title: qBittorrent
            entities:
              - entity: sensor.qbittorrent_status
              - entity: sensor.qbittorrent_download_speed
              - entity: sensor.qbittorrent_upload_speed
              - entity: sensor.qbittorrent_active_torrents
              - entity: sensor.qbittorrent_paused_torrents
              - entity: sensor.qbittorrent_errored_torrents
              - entity: switch.qbittorrent_alternative_speed
          - type: entities
            title: SABnzbd
            entities:
              - entity: sensor.sabnzbd_status
              - entity: sensor.sabnzbd_speed
              - entity: sensor.sabnzbd_queue
              - entity: sensor.sabnzbd_queue_count
              - entity: sensor.sabnzbd_left_to_download
              - entity: button.sabnzbd_pause
              - entity: button.sabnzbd_resume
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              **Pi-hole**: can't add it while running passwordless - the
              integration needs an app password/API key that mode doesn't
              issue.


              **Seerr**: not added.


              **qBittorrent**: global ratio is disabled by default too -
              same fix, Settings > Devices & Services > qBittorrent >
              Entities.

  - title: Energy
    path: energy
    icon: mdi:flash
    type: sections
    sections:
      - type: grid
        title: Electricity
        cards:
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_current_rate
            name: Current Rate
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_next_rate
            name: Next Rate
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_current_standing_charge
            name: Standing Charge
          - type: tile
            entity: binary_sensor.octopus_energy_electricity_d06g503888_1460001146039_off_peak
            name: Off Peak
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_previous_rate
            name: Previous Rate
          - type: custom:mini-graph-card
            name: Rate Today
            entities:
              - sensor.octopus_energy_electricity_d06g503888_1460001146039_current_rate
            hours_to_show: 24
            points_per_hour: 2
            show:
              extrema: true
      - type: grid
        title: Gas
        cards:
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_current_rate
            name: Current Rate
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_next_rate
            name: Next Rate
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_current_standing_charge
            name: Standing Charge
          - type: tile
            entity: sensor.octopus_energy_gas_461654_7514536408_previous_rate
            name: Previous Rate
      - type: grid
        title: Not Yet Enabled
        cards:
          - type: markdown
            content: >-
              Yesterday's consumption and cost (electricity and gas) are the
              most useful part of an energy dashboard, but both are
              disabled-by-default sensors on this integration. Enable
              `previous_accumulative_consumption`/`previous_accumulative_cost`
              for electricity and
              `previous_accumulative_consumption_kwh`/`previous_accumulative_cost`
              for gas in Settings > Devices & Services > Octopus Energy >
              Entities, and I'll wire them in.
      - type: grid
        title: Octoplus
        cards:
          - type: entities
            title: Rewards
            entities:
              - entity: sensor.octopus_energy_a_db2bd179_wheel_of_fortune_spins_electricity
              - entity: sensor.octopus_energy_a_db2bd179_wheel_of_fortune_spins_gas
          - type: calendar
            title: Power Down Events
            entities:
              - entity: calendar.octopus_energy_a_db2bd179_octoplus_power_down

  - title: Household
    path: household
    icon: mdi:home-city
    type: sections
    sections:
      - type: grid
        title: Car
        cards:
          - type: entities
            title: Volkswagen
            entities:
              - entity: lock.garage_volkswagen_579126_central_locking
              - entity: climate.garage_volkswagen_579126_climate_control
              - entity: switch.garage_volkswagen_579126_window_heating
              - entity: switch.garage_volkswagen_579126_active_ventilation
              - entity: sensor.garage_volkswagen_579126_portal_feed_health
              - entity: button.garage_volkswagen_579126_refresh_data
          - type: markdown
            content: >-
              No location/GPS entity exists for this car - likely one of
              the commands the legacy-gateway 401 hides. Not an EV, so no
              battery/range sensors either.
      - type: grid
        title: Meal Planning
        cards:
          - type: todo-list
            entity: todo.mealie_shopping_list
            title: Shopping List
          - type: calendar
            title: This Week's Meals
            entities:
              - entity: calendar.mealie_breakfast
              - entity: calendar.mealie_lunch
              - entity: calendar.mealie_dinner
              - entity: calendar.mealie_snack
              - entity: calendar.mealie_dessert
          - type: entities
            title: Mealie
            entities:
              - entity: sensor.mealie_recipes
              - entity: sensor.mealie_categories
              - entity: sensor.mealie_tags
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              **Bin collection**: not added yet, but the Selenium blocker is
              cleared - use `http://changedetection-selenium:4444/wd/hub`
              as the web driver URL when you add UK Bin Collection Data.
