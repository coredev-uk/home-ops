---
# Pulled every entity_id below from the live /config/.storage/core.entity_registry
# and core.config_entries on the running pod - these are real, not guesses.
#
# Known gaps (see Media Stack / Household views for details):
#   - Pi-hole: not addable while running passwordless - its integration
#     requires an app password/API key that passwordless mode doesn't issue.
#   - UK Bin Collection: Gloucester's council site needs a Selenium web
#     driver (JS-rendered page) - now reachable at
#     http://changedetection-selenium:4444/wd/hub (reusing changedetection's
#     sidecar), use that when adding the integration.
#   - Seerr: not added (not using it, or deferred).
#   - No HomePod media_player exists (no Apple TV/pyatv integration set up) -
#     UniFi just sees it as a network client (device_tracker.paulshoepodmini).
#   - VW car has no device_tracker (GPS) entity - likely one of the commands
#     hidden by the legacy-gateway 401 flagged earlier. Not an EV, so no
#     battery/range sensors either.

views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.pirateweather
            show_forecast: true
      - type: grid
        title: Quick Controls
        cards:
          - type: custom:mushroom-entity-card
            entity: media_player.bravia_k_55xr80
            name: TV
            icon: mdi:television
          - type: custom:mushroom-entity-card
            entity: lock.garage_volkswagen_579126_central_locking
            name: Car
            icon: mdi:car
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: climate.garage_volkswagen_579126_climate_control
            name: Car Climate
          - type: custom:mushroom-entity-card
            entity: media_player.plex_plex_for_android_tv_living_room_tv
            name: Plex
            icon: mdi:plex
          - type: custom:mushroom-entity-card
            entity: sensor.tautulli_watching
            name: Now Watching
            icon: mdi:eye
      - type: grid
        title: Who's Home
        cards:
          - type: custom:mushroom-person-card
            entity: device_tracker.pauls_iphone
            name: Paul
          - type: custom:mushroom-person-card
            entity: device_tracker.dads_iphone
            name: Dad
          - type: custom:mushroom-person-card
            entity: device_tracker.mums_iphone
            name: Mum
          - type: custom:mushroom-person-card
            entity: device_tracker.bens_macbook_pro
            name: Ben
          - type: custom:mushroom-person-card
            entity: device_tracker.guys_apple_watch
            name: Guy
          - type: custom:mushroom-person-card
            entity: device_tracker.kerrys_apple_watch
            name: Kerry

  - title: Entertainment
    path: entertainment
    icon: mdi:television
    type: sections
    sections:
      - type: grid
        title: Living Room
        cards:
          - type: media-control
            entity: media_player.bravia_k_55xr80
          - type: tile
            entity: remote.bravia_k_55xr80
            name: TV Remote
          - type: media-control
            entity: media_player.plex_plex_for_android_tv_living_room_tv
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              No HomePod media control exists. UniFi only sees it as a
              network client (`device_tracker.paulshoepodmini`) - control
              requires setting up the Apple TV (pyatv) integration against
              it, which hasn't been done yet.

  - title: Network
    path: network
    icon: mdi:router-network
    type: sections
    sections:
      - type: grid
        title: Gateway (PTNET)
        cards:
          - type: tile
            entity: sensor.ptnet_state
            name: State
          - type: tile
            entity: sensor.ptnet_uptime
            name: Uptime
          - type: tile
            entity: sensor.ptnet_clients
            name: Clients
          - type: tile
            entity: sensor.ptnet_cpu_utilisation
            name: CPU
          - type: tile
            entity: sensor.ptnet_memory_utilisation
            name: Memory
      - type: grid
        title: WAN Latency
        cards:
          - type: custom:mini-graph-card
            name: WAN Latency
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.ptnet_cloudflare_wan_latency
                name: Cloudflare
              - entity: sensor.ptnet_google_wan_latency
                name: Google
              - entity: sensor.ptnet_microsoft_wan_latency
                name: Microsoft
      - type: grid
        title: VPN & Remote Access
        cards:
          - type: tile
            entity: switch.unifi_network_protonvpn
            name: ProtonVPN
          - type: tile
            entity: switch.unifi_network_plex_remote_access
            name: Plex Remote Access
      - type: grid
        title: Office Switch - PoE
        cards:
          - type: entities
            title: PTNET-SW-OFFICE Ports
            entities:
              - entity: switch.ptnet_sw_office_port_1_poe
              - entity: switch.ptnet_sw_office_port_2_poe
              - entity: switch.ptnet_sw_office_port_3_poe
              - entity: switch.ptnet_sw_office_port_4_poe
              - entity: sensor.ptnet_sw_office_uptime
              - entity: sensor.ptnet_sw_office_cpu_utilisation
      - type: grid
        title: Network Presence
        cards:
          - type: entities
            title: Devices
            entities:
              - entity: device_tracker.hyperion_0
              - entity: device_tracker.hyperion_1
              - entity: device_tracker.hyperon_2
              - entity: device_tracker.hyperion_unas
              - entity: device_tracker.sony_bravia_8
              - entity: device_tracker.paulshoepodmini
              - entity: device_tracker.macbookpro
              - entity: device_tracker.iphone_2
              - entity: device_tracker.watch

  - title: Media Stack
    path: media-stack
    icon: mdi:server
    type: sections
    sections:
      - type: grid
        title: Plex & Tautulli
        cards:
          - type: entities
            title: Plex Library
            entities:
              - entity: sensor.hyperion
              - entity: sensor.hyperion_library_films
              - entity: sensor.hyperion_library_tv_programmes
              - entity: sensor.hyperion_library_sports
              - entity: button.hyperion_scan_clients
              - entity: update.hyperion_update
          - type: entities
            title: Now Playing
            entities:
              - entity: sensor.tautulli_watching
              - entity: sensor.tautulli_direct_plays
              - entity: sensor.tautulli_direct_streams
              - entity: sensor.tautulli_transcodes
              - entity: sensor.tautulli_total_bandwidth
              - entity: sensor.paul_thompson_state
              - entity: sensor.paul_thompson_full_title
              - entity: sensor.mum_state
              - entity: sensor.mum_full_title
              - entity: sensor.b_t33_state
              - entity: sensor.b_t33_full_title
          - type: entities
            title: Top This Month
            entities:
              - entity: sensor.tautulli_top_film
              - entity: sensor.tautulli_top_tv_show
              - entity: sensor.tautulli_top_user
      - type: grid
        title: Sonarr / Radarr
        cards:
          - type: entities
            title: Sonarr
            entities:
              - entity: sensor.sonarr_shows
              - entity: sensor.sonarr_queue
              - entity: sensor.sonarr_wanted
              - entity: sensor.sonarr_upcoming
              - entity: sensor.sonarr_disk_space
              - entity: sensor.sonarr_commands
              - entity: calendar.sonarr
          - type: entities
            title: Radarr
            entities:
              - entity: sensor.radarr_films
              - entity: sensor.radarr_queue
              - entity: sensor.radarr_disk_space_movies
              - entity: binary_sensor.radarr_health
              - entity: calendar.radarr
      - type: grid
        title: Downloads
        cards:
          - type: entities
            title: qBittorrent
            entities:
              - entity: sensor.qbittorrent_status
              - entity: sensor.qbittorrent_download_speed
              - entity: sensor.qbittorrent_upload_speed
              - entity: sensor.qbittorrent_active_torrents
              - entity: sensor.qbittorrent_paused_torrents
              - entity: sensor.qbittorrent_errored_torrents
              - entity: sensor.qbittorrent_global_ratio
              - entity: switch.qbittorrent_alternative_speed
          - type: entities
            title: SABnzbd
            entities:
              - entity: sensor.sabnzbd_status
              - entity: sensor.sabnzbd_speed
              - entity: sensor.sabnzbd_queue
              - entity: sensor.sabnzbd_queue_count
              - entity: sensor.sabnzbd_left_to_download
              - entity: button.sabnzbd_pause
              - entity: button.sabnzbd_resume
      - type: grid
        title: Not Yet Set Up
        cards:
          - type: markdown
            content: >-
              **Pi-hole**: can't add it while running passwordless - the
              integration needs an app password/API key that mode doesn't
              issue.


              **Seerr**: not added.

  - title: Energy
    path: energy
    icon: mdi:flash
    type: sections
    sections:
      - type: grid
        title: Electricity
        cards:
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_current_rate
            name: Current Rate
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_next_rate
            name: Next Rate
          - type: tile
            entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_current_standing_charge
            name: Standing Charge
          - type: tile
            entity: binary_sensor.octopus_energy_electricity_d06g503888_1460001146039_off_peak
            name: Off Peak
          - type: entities
            title: Yesterday
            entities:
              - entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_previous_accumulative_consumption
              - entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_previous_accumulative_cost
              - entity: sensor.octopus_energy_electricity_d06g503888_1460001146039_previous_rate
