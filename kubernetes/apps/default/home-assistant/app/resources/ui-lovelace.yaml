---
# Hera Glass dashboard: dark glass Sections views, styled by
# themes/hera-glass.yaml (set as the default theme on start).
#
# Cards: built-in tile/heading/forecast/statistics cards, plus Mushroom and
# Bubble Card from the Marketplace (resources in configuration.yaml).
# Derived sensors (bins, updates pending, energy cost today, media disk used)
# are template sensors in configuration.yaml.
#
# Every entity_id below was checked against the live entity registry.

views:
  # ════════════════════════════════════════════════════════════════════════
  # HOME
  # ════════════════════════════════════════════════════════════════════════
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      badges_wrap: scroll
      card:
        type: markdown
        text_only: true
        content: >-
          {%- set h = now().hour -%}
          # {{ 'Good morning' if h < 12 else 'Good afternoon' if h < 18 else 'Good evening' }}, {{ user.split(' ')[0] }}

          {{ now().strftime('%A %-d %B') }}
    badges:
      - type: entity
        entity: weather.pirateweather
        state_content: [state, temperature]
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_demand
        name: Using now
        show_name: true
        color: orange
        icon: mdi:lightning-bolt
        tap_action:
          action: navigate
          navigation_path: /lovelace/energy
      - type: entity
        entity: sensor.energy_cost_today
        name: Today
        show_name: true
        color: amber
        tap_action:
          action: navigate
          navigation_path: /lovelace/energy
    sections:
      # ── Needs attention: only renders when something does ──────────────
      - type: grid
        column_span: 3
        visibility:
          - condition: or
            conditions:
              - condition: numeric_state
                entity: sensor.food_waste_collection
                below: 2
              - condition: numeric_state
                entity: sensor.recycling_collection
                below: 2
              - condition: numeric_state
                entity: sensor.updates_pending
                above: 0
              - condition: state
                entity: sensor.qbittorrent_connection_status
                state: firewalled
              - condition: state
                entity: binary_sensor.radarr_health
                state: "on"
              - condition: state
                entity: binary_sensor.sabnzbd_warnings
                state: "on"
              - condition: state
                entity: binary_sensor.octopus_energy_a_db2bd179_octoplus_scratchcard_available
                state: "on"
        cards:
          - type: heading
            heading: Needs attention
            heading_style: title
            icon: mdi:bell-badge-outline
          - type: custom:mushroom-template-card
            entity: sensor.food_waste_collection
            primary: Put the food waste caddy out
            secondary: "{{ state_attr('sensor.food_waste_collection', 'label') }}"
            icon: mdi:food-apple
            color: green
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.food_waste_collection
                below: 2
          - type: custom:mushroom-template-card
            entity: sensor.recycling_collection
            primary: Put the recycling out
            secondary: "{{ state_attr('sensor.recycling_collection', 'label') }}"
            icon: mdi:recycle
            color: blue
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.recycling_collection
                below: 2
          - type: custom:mushroom-template-card
            entity: sensor.updates_pending
            primary: >-
              {{ states('sensor.updates_pending') }} update{{ '' if states('sensor.updates_pending') | int == 1 else 's' }} available
            secondary: "{{ state_attr('sensor.updates_pending', 'titles') }}"
            icon: mdi:package-up
            color: blue
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: /config/updates
            grid_options:
              columns: 6
            visibility:
              - condition: numeric_state
                entity: sensor.updates_pending
                above: 0
          - type: tile
            entity: sensor.qbittorrent_connection_status
            name: qBittorrent is firewalled
            icon: mdi:wall-fire
            color: orange
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: sensor.qbittorrent_connection_status
                state: firewalled
          - type: tile
            entity: binary_sensor.radarr_health
            name: Radarr reports a problem
            color: red
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: binary_sensor.radarr_health
                state: "on"
          - type: tile
            entity: binary_sensor.sabnzbd_warnings
            name: SABnzbd has warnings
            color: orange
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: binary_sensor.sabnzbd_warnings
                state: "on"
          - type: tile
            entity: binary_sensor.octopus_energy_a_db2bd179_octoplus_scratchcard_available
            name: Octoplus scratchcard ready
            icon: mdi:ticket-percent-outline
            color: pink
            grid_options:
              columns: 6
            visibility:
              - condition: state
                entity: binary_sensor.octopus_energy_a_db2bd179_octoplus_scratchcard_available
                state: "on"

      # ── Weather ───────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Outside
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: weather-forecast
            entity: weather.pirateweather
            show_current: true
            show_forecast: true
            forecast_type: hourly
            forecast_slots: 6
            grid_options:
              columns: 12
          - type: tile
            entity: sun.sun
            name: Sun
            state_content: [state, next_setting]
            grid_options:
              columns: 12

      # ── Family ────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Family
            heading_style: title
            icon: mdi:account-group-outline
          - type: tile
            entity: person.paul_thompson_2
            name: Paul
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: person.kerry_thompson
            name: Kerry
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: person.guy_thompson
            name: Guy
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: person.ben_thompson
            name: Ben
            color: green
            grid_options:
              columns: 6

      # ── Living room ───────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Living room
            heading_style: title
            icon: mdi:sofa-outline
            badges:
              - type: entity
                entity: sensor.tautulli_watching
                show_state: true
                show_icon: true
                icon: mdi:plex
                color: amber
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/media
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.bravia_k_55xr80
            name: Bravia TV
            icon: mdi:television
            cover_background: true
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#tv"
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.plex_plex_for_android_tv_living_room_tv
            name: Plex on the TV
            icon: mdi:plex
            cover_background: true
            hide:
              power_button: true
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: media_player.plex_plex_for_android_tv_living_room_tv
                state: [playing, paused, buffering]
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#tv"
            name: Bravia TV
            icon: mdi:television
            entity: media_player.bravia_k_55xr80
            bg_opacity: "70"
            bg_blur: "24"
            cards:
              - type: custom:bubble-card
                card_type: media-player
                entity: media_player.bravia_k_55xr80
                name: Bravia TV
                icon: mdi:television
                cover_background: true
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: button
                    name: Home
                    icon: mdi:home-outline
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Home
                  - type: button
                    show_state: false
                    name: Up
                    icon: mdi:chevron-up
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Up
                  - type: button
                    show_state: false
                    name: Back
                    icon: mdi:arrow-u-left-top
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Return
                  - type: button
                    show_state: false
                    name: Left
                    icon: mdi:chevron-left
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Left
                  - type: button
                    show_state: false
                    name: OK
                    icon: mdi:circle-outline
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Confirm
                  - type: button
                    show_state: false
                    name: Right
                    icon: mdi:chevron-right
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Right
                  - type: button
                    show_state: false
                    name: Volume down
                    icon: mdi:volume-minus
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: VolumeDown
                  - type: button
                    show_state: false
                    name: Down
                    icon: mdi:chevron-down
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: Down
                  - type: button
                    show_state: false
                    name: Volume up
                    icon: mdi:volume-plus
                    tap_action:
                      action: perform-action
                      perform_action: remote.send_command
                      target:
                        entity_id: remote.bravia_k_55xr80
                      data:
                        command: VolumeUp
              - type: tile
                entity: button.bravia_k_55xr80_terminate_apps
                name: Close all apps
                icon: mdi:close-box-multiple-outline
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.bravia_k_55xr80_terminate_apps

      # ── Energy today ──────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Energy today
            heading_style: title
            icon: mdi:lightning-bolt-outline
            tap_action:
              action: navigate
              navigation_path: /lovelace/energy
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_demand
            name: Using now
            icon: mdi:flash
            color: orange
            tap_action:
              action: navigate
              navigation_path: /lovelace/energy
            features:
              - type: trend-graph
                hours_to_show: 12
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_accumulative_cost
            name: Electricity
            icon: mdi:transmission-tower
            color: orange
            state_content: [state]
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_accumulative_cost
            name: Gas
            icon: mdi:fire
            color: deep-orange
            grid_options:
              columns: 6

      # ── Bins ──────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Bins
            heading_style: title
            icon: mdi:trash-can-outline
          - type: custom:mushroom-template-card
            entity: sensor.food_waste_collection
            primary: Food waste
            secondary: "{{ state_attr('sensor.food_waste_collection', 'label') }}"
            icon: mdi:food-apple
            color: >-
              {{ 'green' if states('sensor.food_waste_collection') | int(9) <= 1 else 'grey' }}
            grid_options:
              columns: 12
          - type: custom:mushroom-template-card
            entity: sensor.recycling_collection
            primary: Recycling
            secondary: "{{ state_attr('sensor.recycling_collection', 'label') }}"
            icon: mdi:recycle
            color: >-
              {{ 'blue' if states('sensor.recycling_collection') | int(9) <= 1 else 'grey' }}
            grid_options:
              columns: 12

  # ════════════════════════════════════════════════════════════════════════
  # MEDIA
  # ════════════════════════════════════════════════════════════════════════
  - title: Media
    path: media
    icon: mdi:play-box-multiple-outline
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            heading_style: title
            icon: mdi:television
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.bravia_k_55xr80
            name: Bravia TV
            icon: mdi:television
            cover_background: true
            button_action:
              tap_action:
                action: navigate
                navigation_path: "/lovelace/home#tv"
            grid_options:
              columns: 12
          - type: tile
            entity: media_player.plex_plex_for_android_tv_living_room_tv
            name: Plex on the TV
            icon: mdi:plex
            features:
              - type: media-player-playback
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Plex
            heading_style: title
            icon: mdi:plex
            badges:
              - type: entity
                entity: update.hyperion_update
                show_state: false
                icon: mdi:package-up
                color: blue
                visibility:
                  - condition: state
                    entity: update.hyperion_update
                    state: "on"
          - type: tile
            entity: sensor.tautulli_watching
            name: Streams
            icon: mdi:play-network-outline
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.tautulli_total_bandwidth
            name: Bandwidth
            icon: mdi:speedometer
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.paul_thompson_state
            name: Paul
            icon: mdi:account-outline
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.mum_state
            name: Mum
            icon: mdi:account-outline
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.b_t33_state
            name: B_T33
            icon: mdi:account-outline
            grid_options:
              columns: 4
          - type: tile
            entity: update.hyperion_update
            name: Plex Media Server
            features:
              - type: update-actions
            visibility:
              - condition: state
                entity: update.hyperion_update
                state: "on"
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Downloads
            heading_style: title
            icon: mdi:download-network-outline
          - type: tile
            entity: sensor.qbittorrent_download_speed
            name: qBittorrent down
            icon: mdi:arrow-down-bold-circle-outline
            color: blue
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.qbittorrent_upload_speed
            name: qBittorrent up
            icon: mdi:arrow-up-bold-circle-outline
            color: green
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.qbittorrent_active_torrents
            name: Active torrents
            icon: mdi:magnet
            grid_options:
              columns: 6
          - type: tile
            entity: switch.qbittorrent_alternative_speed
            name: Slow mode
            icon: mdi:speedometer-slow
            color: orange
            features:
              - type: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sabnzbd_speed
            name: SABnzbd
            icon: mdi:download-outline
            color: amber
            state_content: [state]
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.sabnzbd_left_to_download
            name: Left in queue
            icon: mdi:tray-arrow-down
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sabnzbd_status
            name: SABnzbd status
            icon: mdi:information-outline
            grid_options:
              columns: 6
          - type: tile
            entity: button.sabnzbd_pause
            name: Pause
            icon: mdi:pause
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.sabnzbd_pause
            grid_options:
              columns: 6
          - type: tile
            entity: button.sabnzbd_resume
            name: Resume
            icon: mdi:play
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.sabnzbd_resume
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Storage
            heading_style: title
            icon: mdi:harddisk
          - type: gauge
            entity: sensor.media_disk_used
            name: Media disk used
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 75
              red: 90
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.sabnzbd_free_disk_space
            name: Free
            icon: mdi:harddisk-plus
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.sabnzbd_total_disk_space
            name: Total
            icon: mdi:harddisk
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.radarr_health
            name: Radarr health
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.sabnzbd_warnings
            name: SABnzbd warnings
            grid_options:
              columns: 6

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Coming up
            heading_style: title
            icon: mdi:calendar-star
            badges:
              - type: entity
                entity: sensor.sonarr_upcoming
                show_state: true
                icon: mdi:television-classic
                color: blue
          - type: calendar
            initial_view: listWeek
            entities:
              - entity: calendar.sonarr
              - entity: calendar.radarr
            grid_options:
              columns: 12

  # ════════════════════════════════════════════════════════════════════════
  # ENERGY
  # ════════════════════════════════════════════════════════════════════════
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt-outline
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Electricity
            heading_style: title
            icon: mdi:transmission-tower
            badges:
              - type: entity
                entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_rate
                color: orange
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_demand
            name: Using now
            icon: mdi:flash
            color: orange
            features:
              - type: trend-graph
                hours_to_show: 24
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_accumulative_consumption
            name: Today
            icon: mdi:lightning-bolt
            color: orange
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_accumulative_cost
            name: Cost today
            icon: mdi:currency-gbp
            color: orange
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_previous_accumulative_consumption
            name: Yesterday
            icon: mdi:history
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_previous_accumulative_cost
            name: Cost yesterday
            icon: mdi:currency-gbp
            grid_options:
              columns: 6
          - type: statistics-graph
            title: Daily cost, last 2 weeks
            entities:
              - entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_accumulative_cost
                name: Electricity
            stat_types: [change]
            period: day
            days_to_show: 14
            chart_type: bar
            hide_legend: true
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.octopus_energy_electricity_26p4107928_1460001146039_current_standing_charge
            name: Standing charge
            icon: mdi:calendar-today-outline
            grid_options:
              columns: 12

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Gas
            heading_style: title
            icon: mdi:fire
            badges:
              - type: entity
                entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_rate
                color: deep-orange
          - type: tile
            entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_accumulative_consumption_kwh
            name: Today
            icon: mdi:fire
            color: deep-orange
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_accumulative_cost
            name: Cost today
            icon: mdi:currency-gbp
            color: deep-orange
            grid_options:
              columns: 6
          - type: statistics-graph
            title: Daily cost, last 2 weeks
            entities:
              - entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_accumulative_cost
                name: Gas
            stat_types: [change]
            period: day
            days_to_show: 14
            chart_type: bar
            hide_legend: true
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.octopus_energy_gas_e6e24156452643_7514536408_current_standing_charge
            name: Standing charge
            icon: mdi:calendar-today-outline
            grid_options:
              columns: 12

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Water
            heading_style: title
            icon: mdi:water-outline
            badges:
              - type: entity
                entity: sensor.severn_trent_water_a_d17e68db_smart_meter_status
                icon: mdi:water-check-outline
                color: cyan
          - type: tile
            entity: sensor.severn_trent_water_a_d17e68db_yesterday_usage
            name: Yesterday
            icon: mdi:water
            color: cyan
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.severn_trent_water_a_d17e68db_daily_average
            name: Daily average
            icon: mdi:water-sync
            color: cyan
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.severn_trent_water_a_d17e68db_week_to_date
            name: This week
            icon: mdi:calendar-week
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.severn_trent_water_a_d17e68db_previous_week
            name: Last week
            icon: mdi:calendar-arrow-left
            grid_options:
              columns: 6
          - type: tile
