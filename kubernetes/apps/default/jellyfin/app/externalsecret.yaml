---
# API keys for Hera TV's Seerr, Sonarr, Radarr and SABnzbd integrations, which the plugin uses
# server-side only, and the Letterboxd API pair (the one Jellyscribe ships, shared with the Plex
# job) its diary logging signs requests with. Each person links their own Letterboxd account in Hera.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyfin-secret
    template:
      data:
        HERATV_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HERATV_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HERATV_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HERATV_SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
        HERATV_LETTERBOXD_API_KEY: "{{ .LETTERBOXD_API_KEY }}"
        HERATV_LETTERBOXD_API_SECRET: "{{ .LETTERBOXD_API_SECRET }}"
  dataFrom:
    - extract:
        key: seerr
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
    - extract:
        key: letterboxd
