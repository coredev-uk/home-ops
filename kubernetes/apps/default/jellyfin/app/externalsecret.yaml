---
# Pulls ghcr.io/coredev-uk/jellyfin-hera-tv (containers/jellyfin-hera-tv), the Hera TV plugin's
# init container. GHCR_PULL_TOKEN is the read:packages token Clarence pulls private
# ghcr.io/coredev-uk images with.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyfin-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: bot-clarence
---
# API keys for Hera TV's Seerr, Sonarr, Radarr and SABnzbd integrations, which the plugin uses
# server-side only.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyfin-secret
    template:
      data:
        HERATV_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HERATV_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HERATV_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HERATV_SABNZBD_API_KEY: "{{ .SABNZBD_API_KEY }}"
  dataFrom:
    - extract:
        key: seerr
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: sabnzbd
