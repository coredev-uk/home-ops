---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  values:
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Hera TV (containers/jellyfin-hera-tv): copies the plugin into /config/plugins/HeraTV,
          # replacing whatever build was there, before the server loads its plugins.
          hera-tv:
            image:
              repository: ghcr.io/coredev-uk/jellyfin-hera-tv
              tag: 13ac69a6912afa45034cd27eda58111147026b8c@sha256:26c2e66c54932ea415e81e0a942d288a144937b6972ff66dc6439f74cb5d4bfa
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            env:
              TZ: Europe/London
              JELLYFIN_PublishedServerUrl: https://jellyfin.hera.ac
              # Hera TV's integrations; API keys come from jellyfin-secret.
              HERATV_SEERR_URL: http://seerr.default.svc.cluster.local
              HERATV_SEERR_PUBLIC_URL: https://seerr.hera.ac
              # Jellyfin username=Seerr user id: requests are made as that Seerr user.
              HERATV_SEERR_USERS: pthompson=1,bthompson=3,kthompson=5
              HERATV_MAINTAINERR_URL: http://maintainerr.default.svc.cluster.local
              HERATV_SONARR_URL: http://sonarr.default.svc.cluster.local
              HERATV_RADARR_URL: http://radarr.default.svc.cluster.local
              HERATV_SABNZBD_URL: http://sabnzbd.default.svc.cluster.local
              # Where an administrator's "Open in Sonarr/Radarr/SABnzbd" buttons go.
              HERATV_SONARR_PUBLIC_URL: https://sonarr.hera.ac
              HERATV_RADARR_PUBLIC_URL: https://radarr.hera.ac
              HERATV_SABNZBD_PUBLIC_URL: https://sabnzbd.hera.ac
            envFrom:
              - secretRef:
                  name: jellyfin-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu-tier
                    operator: In
                    values:
                      - high
      imagePullSecrets:
        - name: jellyfin-pull
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: jellyfin-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /health
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      cache:
        type: emptyDir
      media:
        type: nfs
        server: expanse.internal
        path: /var/nfs/shared/Media
        globalMounts:
          - readOnly: true
      tmp:
        type: emptyDir
