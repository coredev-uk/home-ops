---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./resourceclaimtemplate.yaml
# Back up Jellyfin's database and settings, not what it regenerates: images and metadata
# (metadata) and seek previews (trickplay), refetched after a restore. The SnapshotPolicy comes
# from the kopiur/statefulset component in ks.yaml (a patch there would be replaced by flux-system's own).
patches:
  - target:
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - /data/trickplay/
            - /log/
            - /metadata/
