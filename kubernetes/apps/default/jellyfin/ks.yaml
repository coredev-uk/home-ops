---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  interval: 1h
  # Back up Jellyfin's database and settings, not what it regenerates: images and metadata
  # (metadata) and seek previews (trickplay), refetched after a restore.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |-
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - /data/trickplay/
              - /log/
              - /metadata/
  path: ./kubernetes/apps/default/jellyfin/app
  postBuild:
    substitute:
      APP: jellyfin
      KOPIUR_CAPACITY: 20Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
