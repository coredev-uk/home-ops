---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: mealie
        password: "{{ .POSTGRES_MEALIE_PASSWORD }}"
        uri: "postgres://mealie:{{ .POSTGRES_MEALIE_PASSWORD | urlquery }}@mealie-postgres-rw:5432/mealie?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: postgresql
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-postgres-import
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-postgres-import
    template:
      data:
        password: "{{ .POSTGRES_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: postgresql
