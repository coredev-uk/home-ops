---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: outline-secret
    template:
      data:
        DATABASE_URL: "postgres://outline:{{ .POSTGRES_PASSWORD | urlquery }}@outline-postgres-rw:5432/outline?sslmode=disable"
        REDIS_URL: "redis://outline-valkey:6379"
        SECRET_KEY: "{{ .OUTLINE_SECRET_KEY }}"
        UTILS_SECRET: "{{ .OUTLINE_UTILS_SECRET }}"
        OIDC_CLIENT_ID: "{{ .OUTLINE_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OUTLINE_OIDC_CLIENT_SECRET }}"
        OIDC_LOGOUT_URI: "{{ .OUTLINE_OIDC_LOGOUT_URI }}"
        NOTION_CLIENT_ID: "{{ .NOTION_CLIENT_ID }}"
        NOTION_CLIENT_SECRET: "{{ .NOTION_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: outline
