---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: outline-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: outline
        password: "{{ .POSTGRES_PASSWORD }}"
        uri: "postgres://outline:{{ .POSTGRES_PASSWORD | urlquery }}@outline-postgres-rw:5432/outline?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: outline
