---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./backendtrafficpolicy.yaml
  - ./helmrelease.yaml
  - ./resourceclaimtemplate.yaml
# Back up Plex's database and settings, not what it regenerates: thumbnails and previews (Media),
# posters and metadata (Metadata) and downloads. After a restore Plex refetches these over a few
# hours; custom posters uploaded by hand are the one thing lost. The SnapshotPolicy comes from the
# kopiur/statefulset component in ks.yaml (a patch there would be replaced by flux-system's own).
patches:
  - target:
      kind: SnapshotPolicy
    patch: |-
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - /Library/Application Support/Plex Media Server/Cache/
            - /Library/Application Support/Plex Media Server/Codecs/
            - /Library/Application Support/Plex Media Server/Crash Reports/
            - /Library/Application Support/Plex Media Server/Drivers/
            - /Library/Application Support/Plex Media Server/Logs/
            - /Library/Application Support/Plex Media Server/Media/
            - /Library/Application Support/Plex Media Server/Metadata/
