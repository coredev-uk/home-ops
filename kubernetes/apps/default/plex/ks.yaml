---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  interval: 1h
  # Back up Plex's database and settings, not what it regenerates: thumbnails and previews
  # (Media), posters and metadata (Metadata) and downloads. After a restore Plex refetches
  # these over a few hours; custom posters uploaded by hand are the one thing lost.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |-
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - /Library/Application Support/Plex Media Server/Cache/
              - /Library/Application Support/Plex Media Server/Codecs/
              - /Library/Application Support/Plex Media Server/Crash Reports/
              - /Library/Application Support/Plex Media Server/Drivers/
              - /Library/Application Support/Plex Media Server/Logs/
              - /Library/Application Support/Plex Media Server/Media/
              - /Library/Application Support/Plex Media Server/Metadata/
  path: ./kubernetes/apps/default/plex/app
  postBuild:
    substitute:
      APP: plex
      KOPIUR_CAPACITY: 50Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plex-tools
spec:
  interval: 1h
  path: ./kubernetes/apps/default/plex/tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
