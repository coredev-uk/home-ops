---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex-letterboxd
spec:
  chartRef:
    kind: OCIRepository
    name: plex-letterboxd
  interval: 1h
  values:
    controllers:
      plex-letterboxd:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          # Nightly, after the day's viewing but before kometa's 05:00 run.
          schedule: 0 4 * * *
          backoffLimit: 0
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command:
              - python3
              - /app/sync.py
            env:
              TZ: Europe/London
              TAUTULLI_URL: http://tautulli.default.svc.cluster.local
              # Required - the job refuses to start without it, so a shared
              # server's other users never reach your diary. cmd=get_users lists
              # the ids.
              TAUTULLI_USER_ID: "778751750"
              # Also catches films scrubbed to the end without finishing.
              COMPLETION_THRESHOLD: "85"
              # Empty means never backfill: a first run starts from "now", so
              # bulk history stays with Letterboxd's own import. A YYYY-MM-DD
              # date starts from that point instead.
              SYNC_SINCE: "2026-09-28"
              # Stops an unexpectedly large delta flooding the diary in one go.
              MAX_PER_RUN: "50"
              # Off because kometa's mass_user_rating_update: tmdb overwrites
              # Plex's userRating nightly, so that field holds TMDB averages
              # rather than your own stars. Only enable if that stops.
              SYNC_RATINGS: "false"
              STATE_DIR: /data
              PYTHONDONTWRITEBYTECODE: "1"
            envFrom:
              - secretRef:
                  name: plex-letterboxd-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      # The sync cursor.
      state:
        existingClaim: plex-letterboxd
        globalMounts:
          - path: /data
      script:
        type: configMap
        name: plex-letterboxd-configmap
        globalMounts:
          - path: /app/sync.py
            subPath: sync.py
