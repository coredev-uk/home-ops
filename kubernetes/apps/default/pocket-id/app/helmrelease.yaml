---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id
  interval: 1h
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.2@sha256:3ee23895d6a3adb5dd5de801a4fd31fc31b960e6dfbea9b5200e33cf477695eb
            env:
              APP_URL: https://id.hera.ac
              TRUST_PROXY: true
              PUID: 1000
              PGID: 1000
              TZ: Europe/London
              ANALYTICS_DISABLED: true
              METRICS_ENABLED: true
              OTEL_METRICS_EXPORTER: prometheus
              OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
              OTEL_EXPORTER_PROMETHEUS_PORT: &metricsPort 9464
              EMAILS_VERIFIED: true
              ALLOW_OWN_ACCOUNT_EDIT: false
              UI_CONFIG_DISABLED: true
              APP_NAME: HyperionID
              SESSION_DURATION: 120
              # Meridian's gilt, lifted just past the 0.55 luminance at which Pocket ID
              # labels a button dark instead of white: gilt itself (#c9a24f) would get
              # a white label at 2.3:1. This one gives a dark label at 12.6:1.
              ACCENT_COLOR: "#e5c77f"
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 1411
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - id.hera.ac
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # The tab icon and logos are configurable, but the home-screen and PWA
          # icons are bundled PNG/SVGs. These paths are answered from the
          # branding images instead; the email logo slot holds the 512px icon,
          # since no SMTP is configured.
          - backendRefs: &backendRefs
              - identifier: app
                port: *port
            matches:
              - path:
                  type: Exact
                  value: /img/static-logo-512.png
              - path:
                  type: Exact
                  value: /img/static-logo-rounded-512.png
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /api/application-images/email
          - backendRefs: *backendRefs
            matches:
              - path:
                  type: Exact
                  value: /img/static-logo.svg
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /api/application-images/logo
          - backendRefs: *backendRefs
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      # The HyperionID mark (resources/branding): the letters ID, with a gilt
      # half sun rising inside the D (Hyperion, Titan of light). Mounted over the PVC's
      # application-images so the images live in git; Pocket ID only falls back
      # to its bundled logo when a name is missing. logoEmail.png is the 512px
      # home-screen icon (see the route).
      # background.jpg: "Dover at night" by Alexey Komarov, 22 October 2016
      # (https://commons.wikimedia.org/wiki/File:Dover_at_night.jpg), CC BY-SA 4.0
      # (https://creativecommons.org/licenses/by-sa/4.0); resized to 2560px wide,
      # and this copy is under the same licence.
      branding:
        type: configMap
        name: "{{ .Release.Name }}-branding"
        globalMounts:
          - path: /app/data/uploads/application-images/logoLight.svg
            subPath: logoLight.svg
            readOnly: true
          - path: /app/data/uploads/application-images/logoDark.svg
            subPath: logoDark.svg
            readOnly: true
          - path: /app/data/uploads/application-images/favicon.ico
            subPath: favicon.ico
            readOnly: true
          - path: /app/data/uploads/application-images/logoEmail.png
            subPath: logoEmail.png
            readOnly: true
          - path: /app/data/uploads/application-images/background.jpg
            subPath: background.jpg
            readOnly: true
      tmp:
        type: emptyDir
