---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: pocket-id-branding
    files:
      - ./resources/branding/logoLight.svg
      - ./resources/branding/logoDark.svg
      - ./resources/branding/favicon.ico
      - ./resources/branding/logoEmail.png
generatorOptions:
  disableNameSuffixHash: true
