---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: pocket_id
      owner: pocket_id
      secret:
        name: pocket-id-postgres-credentials
