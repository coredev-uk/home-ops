---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: pocket_id
        password: "{{ .POSTGRES_POCKET_ID_PASSWORD }}"
        uri: "postgres://pocket_id:{{ .POSTGRES_POCKET_ID_PASSWORD | urlquery }}@pocket-id-postgres-rw:5432/pocket_id?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: postgresql
