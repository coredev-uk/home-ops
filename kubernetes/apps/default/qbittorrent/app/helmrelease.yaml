---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    global:
      templateEvaluation:
        # gluetun fills in {{PORT}} and {{VPN_INTERFACE}} itself.
        excludePaths:
          - [controllers, qbittorrent, initContainers, gluetun, env, VPN_PORT_FORWARDING_UP_COMMAND]
    controllers:
      qbittorrent:
        initContainers:
          # ProtonVPN WireGuard tunnel for qBittorrent alone; Prowlarr stays on
          # the UniFi VPN VLAN, whose gateway tunnel tops out near 170 Mbit/s.
          # A native sidecar (restartPolicy Always) whose startup probe gates
          # qBittorrent, so its kill-switch firewall is up before any torrent
          # traffic. The up command points qBittorrent at the port Proton
          # forwards and binds it to the tunnel; qBittorrent may still be
          # starting, so it retries in the background.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: Switzerland
              PORT_FORWARD_ONLY: "on"
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c '(until wget -qO- --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1/api/v2/app/setPreferences; do sleep 5; done) &'
              # qBittorrent only rebinds a reconnected tunnel once its port changes.
              VPN_PORT_FORWARDING_DOWN_COMMAND: >-
                /bin/sh -c 'wget -qO- --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1/api/v2/app/setPreferences'
              # The web UI and kubelet probes arrive on the pod network.
              FIREWALL_INPUT_PORTS: "80"
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            restartPolicy: Always
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities: { add: ["NET_ADMIN"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            # libtorrent 2.1 build: the write-through disk write mode (set in
            # qBittorrent.conf) keeps unwritten data from filling memory.
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.1@sha256:fcdbc4ac4a66d8c205ac67e4fe1b578158aaee0a50369c3d04918977f4f359c4
            env:
              TZ: Europe/London
              QBT_WEBUI_PORT: &port 80
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # 30-day RSS p95 44Mi, daily peak 113Mi (2026-11-13). The 2Gi limit stays: unpacking bursts reach ~1Gi.
            resources:
              requests:
                cpu: 100m
                memory: 1216Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # gluetun's DNS server, which resolves through the tunnel.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: expanse.internal
        path: /var/nfs/shared/Media
      tmp:
        type: emptyDir
