---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent-libtorrentv1
              tag: 5.3.0@sha256:74a9dd7824d960e1c3355ab07ba23c9946aa18236eebac0c51fe9f5cac35ff8f
            env:
              TZ: Europe/London
              QBT_WEBUI_PORT: &port 80
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # 30-day RSS p95 44Mi, daily peak 113Mi (2026-11-13). The 2Gi limit stays: unpacking bursts reach ~1Gi.
            resources:
              requests:
                cpu: 100m
                memory: 1216Mi
              limits:
                memory: 2Gi
          # ProtonVPN only forwards a port while a NAT-PMP lease on 10.2.0.1
          # is held. Proton picks the port, so this renews the 60s lease and
          # points qBittorrent's listen port at it. Relies on qBittorrent's
          # localhost auth bypass. The UniFi gateway DNATs tunnel ports
          # 1024-65535 to this pod's VPN address.
          port-forward:
            image:
              repository: docker.io/library/python
              tag: 3.13.18-alpine3.24@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
            command:
              - python
              - -c
              - |
                import json, socket, struct, time, urllib.parse, urllib.request

                QBT = "http://localhost/api/v2/app"

                def lease(op):
                    # Public port 1 for private port 0: Proton assigns the port.
                    with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                        s.settimeout(5)
                        s.sendto(struct.pack("!BBHHHI", 0, op, 0, 0, 1, 60), ("10.2.0.1", 5351))
                        _, _, result, _, _, port, _ = struct.unpack("!BBHIHHI", s.recv(16))
                    if result:
                        raise RuntimeError(f"NAT-PMP result code {result}")
                    return port

                while True:
                    try:
                        port = lease(1)
                        if lease(2) != port:
                            raise RuntimeError("UDP and TCP leases got different ports")
                        current = json.load(urllib.request.urlopen(f"{QBT}/preferences", timeout=5))["listen_port"]
                        if current != port:
                            body = urllib.parse.urlencode({"json": json.dumps({"listen_port": port})}).encode()
                            urllib.request.urlopen(f"{QBT}/setPreferences", body, timeout=5)
                            print(f"listen port {current} -> {port}", flush=True)
                        time.sleep(45)
                    except Exception as e:
                        print(f"port forward: {e}", flush=True)
                        time.sleep(10)
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vpn",
            "namespace": "kube-system",
            "ips": ["192.168.120.15/24"]
          }]
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    podLabels:
      vpn: "true"
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: expanse.internal
        path: /var/nfs/shared/Media
      tmp:
        type: emptyDir
