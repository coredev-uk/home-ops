---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qui-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: qui
        password: "{{ .POSTGRES_QUI_PASSWORD }}"
        uri: "postgres://qui:{{ .POSTGRES_QUI_PASSWORD | urlquery }}@qui-postgres-rw:5432/qui?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: postgresql
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-postgres-import
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qui-postgres-import
    template:
      data:
        password: "{{ .POSTGRES_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: postgresql
