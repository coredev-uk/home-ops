---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: seerr-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: seerr
      owner: seerr
      secret:
        name: seerr-postgres-credentials
      # Offline, one-shot import from the Bitnami `postgresql` release in the `db`
      # namespace. Only honoured at bootstrap; safe to drop (together with
      # `externalClusters` below) once the migration is complete.
      import:
        type: microservice
        databases:
          - seerr
        source:
          externalCluster: bitnami-postgresql
  externalClusters:
    - name: bitnami-postgresql
      connectionParameters:
        host: postgresql.db.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: disable
      password:
        name: seerr-postgres-import
        key: password
