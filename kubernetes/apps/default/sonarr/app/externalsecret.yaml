---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        SONARR__AUTH__OIDCCLIENTID: "{{ .SONARR_OIDC_CLIENT_ID }}"
        SONARR__AUTH__OIDCCLIENTSECRET: "{{ .SONARR_OIDC_CLIENT_SECRET }}"
        SONARR__AUTH__OIDCUSERIDENTIFIER: "{{ .SONARR_OIDC_USER_IDENTIFIER }}"
  dataFrom:
    - extract:
        key: sonarr
