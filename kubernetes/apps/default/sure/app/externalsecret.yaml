---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sure-secret
    template:
      data:
        DATABASE_URL: "postgres://sure:{{ .POSTGRES_PASSWORD | urlquery }}@sure-postgres-rw:5432/sure?sslmode=disable"
        REDIS_URL: "redis://sure-valkey:6379/1"
        SECRET_KEY_BASE: "{{ .SURE_SECRET_KEY_BASE }}"
        # Set explicitly so rotating SECRET_KEY_BASE can't make the stored
        # Lunch Flow / Trading 212 credentials unreadable. All three or none.
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{{ .SURE_AR_PRIMARY_KEY }}"
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{{ .SURE_AR_DETERMINISTIC_KEY }}"
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{{ .SURE_AR_KEY_DERIVATION_SALT }}"
        OIDC_CLIENT_ID: "{{ .SURE_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .SURE_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: sure
