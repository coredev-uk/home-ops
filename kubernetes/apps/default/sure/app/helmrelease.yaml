---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
spec:
  chartRef:
    kind: OCIRepository
    name: sure
  interval: 1h
  values:
    controllers:
      sure:
        type: statefulset
        # Web and worker share the RWO storage claim, so they live in one pod.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/we-promise/sure
              tag: 0.7.6-hotfix.2@sha256:08f4fb26cedd0e5743792178ee744c1ea8b3ccd8cd9da1941ffc3ba7ef16ae6c
            # Default CMD `./bin/rails server`: the image entrypoint runs
            # `db:prepare` (migrations) before starting Puma.
            env: &env
              TZ: Europe/London
              SELF_HOSTED: "true"
              APP_DOMAIN: sure.hera.ac
              PORT: &port 3000
              # Envoy terminates TLS; assume_ssl also stops plain-HTTP probes
              # on /up from being redirected by force_ssl.
              RAILS_ASSUME_SSL: "true"
              RAILS_FORCE_SSL: "true"
              BOOTSNAP_READONLY: "true"
              ONBOARDING_STATE: closed
              OIDC_ISSUER: https://id.hera.ac
              OIDC_REDIRECT_URI: https://sure.hera.ac/auth/openid_connect/callback
              OIDC_BUTTON_LABEL: HyperionID
              AUTH_LOCAL_LOGIN_ENABLED: "false"
              AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "false"
              # OIDC logins only link to existing users; nobody new can sign up.
              AUTH_JIT_MODE: link_only
              AUTO_SYNC_TIME: "06:30"
              AUTO_SYNC_TIMEZONE: Europe/London
              MARKET_DATA_SYNC_TIME: "17:30"
              MARKET_DATA_SYNC_TIMEZONE: Europe/London
              EXCHANGE_RATE_PROVIDER: yahoo_finance
              SECURITIES_PROVIDER: yahoo_finance
              # AI chat, categorisation and merchant detection (which finds the
              # websites Brandfetch needs for merchant logos) via OpenRouter.
              OPENAI_URI_BASE: https://openrouter.ai/api/v1
              OPENAI_MODEL: google/gemini-3.8-flash
            envFrom: &envFrom
              - secretRef:
                  name: sure-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 848Mi
              limits:
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          worker:
            image: *image
            # args only, so the entrypoint still preloads jemalloc.
            args: ["bundle", "exec", "sidekiq"]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 1152Mi
              limits:
                memory: 1472Mi
            securityContext: *securityContext
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 2Gi
              storageClass: ceph-block
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
              advancedMounts:
                app:
                  - path: /rails/storage
                worker:
                  - path: /rails/storage
      # Brandfetch shows a letter for brands it has no icon for; swap those
      # merchant logos for the site's favicon via Google's favicon service.
      logo-fallback:
        type: cronjob
        cronjob:
          # After the 06:30 sync and the rules run that follows it.
          schedule: 0 7 * * *
          backoffLimit: 0
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image: *image
            args: ["./bin/rails", "runner", "/app/logo-fallback.rb"]
            env: *env
            envFrom: *envFrom
            resources: &jobResources
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
      # Sure can't model the PCP's interest or final payment; after each
      # monthly payment this sets the finance balance from the agreement.
      pcp-schedule:
        type: cronjob
        cronjob:
          schedule: 30 7 * * *
          backoffLimit: 0
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image: *image
            args: ["./bin/rails", "runner", "/app/pcp-schedule.rb"]
            env: *env
            envFrom: *envFrom
            resources: *jobResources
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: sure
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Ruby's Dir.tmpdir rejects a world-writable dir without the sticky
      # bit. A disk emptyDir lacks it; a tmpfs (Memory) one has it.
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
      # Only the dirs `rails server` creates at boot are writable:
      # /rails/tmp/cache holds the build-time bootsnap cache, which
      # BOOTSNAP_READONLY reads but never writes.
      pids:
        type: emptyDir
        globalMounts:
          - path: /rails/tmp/pids
      sockets:
        type: emptyDir
        globalMounts:
          - path: /rails/tmp/sockets
      logo-fallback:
        type: configMap
        name: sure-logo-fallback
        advancedMounts:
          logo-fallback:
            app:
              - path: /app/logo-fallback.rb
                subPath: logo-fallback.rb
      # Coloured initials for anything without a logo; see the file's header.
      initials-avatar:
        type: configMap
        name: sure-initials-avatar
        globalMounts:
          - path: /rails/config/initializers/initials_avatar.rb
            subPath: initials_avatar.rb
      pcp-schedule:
        type: configMap
        name: sure-pcp-schedule
        advancedMounts:
          pcp-schedule:
            app:
              - path: /app/pcp-schedule.rb
                subPath: pcp-schedule.rb
