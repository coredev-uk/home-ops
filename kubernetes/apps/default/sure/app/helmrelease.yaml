---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
spec:
  chartRef:
    kind: OCIRepository
    name: sure
  interval: 1h
  values:
    controllers:
      sure:
        # Web and worker share the RWO storage PVC, so they live in one pod
        # and the pod must be replaced rather than surged.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/we-promise/sure
              tag: 0.7.6@sha256:61cd4c1fa9917200f8db4434b45d968235f375c52cdbdc81bf4a4df555a2f090
            # Default CMD `./bin/rails server`: the image entrypoint runs
            # `db:prepare` (migrations) before starting Puma.
            env: &env
              TZ: Europe/London
              SELF_HOSTED: "true"
              APP_DOMAIN: sure.hera.ac
              PORT: &port 3000
              # Envoy terminates TLS; assume_ssl also stops plain-HTTP probes
              # on /up from being redirected by force_ssl.
              RAILS_ASSUME_SSL: "true"
              RAILS_FORCE_SSL: "true"
              BOOTSNAP_READONLY: "true"
              ONBOARDING_STATE: closed
              OIDC_ISSUER: https://id.hera.ac
              OIDC_REDIRECT_URI: https://sure.hera.ac/auth/openid_connect/callback
              OIDC_BUTTON_LABEL: HyperionID
              AUTH_LOCAL_LOGIN_ENABLED: "false"
              AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "false"
              # link_only blocks JIT creation of the very first user (there is
              # no invitation and local login is off), so the first OIDC login
              # needs create_and_link. After your account exists, switch this
              # to `link_only` to close signups.
              AUTH_JIT_MODE: create_and_link
              AUTO_SYNC_TIME: "06:30"
              AUTO_SYNC_TIMEZONE: Europe/London
              MARKET_DATA_SYNC_TIME: "17:30"
              MARKET_DATA_SYNC_TIMEZONE: Europe/London
              EXCHANGE_RATE_PROVIDER: yahoo_finance
              SECURITIES_PROVIDER: yahoo_finance
            envFrom: &envFrom
              - secretRef:
                  name: sure-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                memory: 832Mi
              limits:
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          worker:
            image: *image
            # args only, so the entrypoint still preloads jemalloc.
            args: ["bundle", "exec", "sidekiq"]
            env: *env
            envFrom: *envFrom
            resources:
              requests:
                cpu: 50m
                memory: 1152Mi
              limits:
                memory: 1472Mi
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      storage:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /rails/storage
      # Ruby's Dir.tmpdir rejects a world-writable dir without the sticky
      # bit. A disk emptyDir lacks it; a tmpfs (Memory) one has it.
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
      # Only the dirs `rails server` creates at boot are writable:
      # /rails/tmp/cache holds the build-time bootsnap cache, which
      # BOOTSNAP_READONLY reads but never writes.
      pids:
        type: emptyDir
        globalMounts:
          - path: /rails/tmp/pids
      sockets:
        type: emptyDir
        globalMounts:
          - path: /rails/tmp/sockets
