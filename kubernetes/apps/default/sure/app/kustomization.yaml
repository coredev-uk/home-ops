---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: sure-logo-fallback
    files:
      - ./resources/logo-fallback.rb
  - name: sure-initials-avatar
    files:
      - ./resources/initials_avatar.rb
  - name: sure-pcp-schedule
    files:
      - ./resources/pcp-schedule.rb
generatorOptions:
  disableNameSuffixHash: true
