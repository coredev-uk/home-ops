---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-components
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  podMetricsEndpoints:
    - honorLabels: true
      port: http-prom
      metricRelabelings:
        # Dashboards read gotk_reconcile_duration_seconds_count/_sum, never the buckets.
        - action: drop
          regex: "gotk_reconcile_duration_seconds_bucket|workqueue_work_duration_seconds_bucket"
          sourceLabels: [__name__]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
