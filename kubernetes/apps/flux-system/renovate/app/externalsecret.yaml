---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-github-app-secret
    template:
      data:
        key: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-bot
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  # Installation tokens expire after 60 minutes and that is not configurable,
  # so this has to stay well under it.
  refreshInterval: 30m
  target:
    name: renovate-secret
    template:
      data:
        RENOVATE_TOKEN: "{{ .token }}"
        RENOVATE_SECRETS: |-
          {"OCHARTED_USERNAME":"{{ .OCHARTED_USERNAME }}","OCHARTED_PASSWORD":"{{ .OCHARTED_PASSWORD }}"}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate
    - extract:
        key: ocharted
