---
# Mints a short-lived GitHub App installation token so no long-lived PAT is
# needed. repositories/permissions down-scope it to the minimum Renovate uses,
# which is narrower than the App's own installation scope.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate
spec:
  appID: "2908989"
  installID: "111348871"
  repositories:
    - home-ops
  permissions:
    checks: write
    contents: write
    issues: write
    pull_requests: write
    statuses: write
    workflows: write
    vulnerability_alerts: read
  auth:
    privateKey:
      secretRef:
        name: renovate-github-app-secret
        key: key
