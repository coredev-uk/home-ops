---
# Pulls ghcr.io/coredev-uk/kandev-worker (containers/kandev-worker) for the task pods, which name
# it in imagePullSecrets (pod-template.yaml there). GHCR_PULL_TOKEN is the read:packages token
# Clarence pulls private ghcr.io/coredev-uk images with.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kandev-worker-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kandev-worker-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: bot-clarence
