---
# Pulls ghcr.io/coredev-uk/kandev (containers/kandev) for the control plane, which names it in
# imagePullSecrets (helmrelease.yaml). GHCR_PULL_TOKEN is the read:packages token Clarence pulls
# private ghcr.io/coredev-uk images with.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kandev-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kandev-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: bot-clarence
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kandev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kandev-secret
    template:
      data:
        # Pi's claude-bridge in this pod runs the utility agents (helmrelease.yaml).
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .KANDEV_CLAUDE_CODE_OAUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: kandev
