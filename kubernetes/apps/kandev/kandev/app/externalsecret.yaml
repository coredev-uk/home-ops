---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kandev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kandev-secret
    template:
      data:
        # Pi's claude-bridge in this pod runs the utility agents (helmrelease.yaml).
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .KANDEV_CLAUDE_CODE_OAUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: kandev
