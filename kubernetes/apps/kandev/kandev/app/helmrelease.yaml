---
# Kandev (github.com/kdlbs/kandev): a kanban board that runs coding agents (Pi, on Claude through
# pi-claude-bridge) on tasks and reviews what they change. This pod is the control plane: the web
# UI, the API and the board's SQLite database. The agents run in task pods its Kubernetes
# executor creates in kandev-agents, on hyperion-0 or hyperion-2
# (containers/kandev-worker/pod-template.yaml).
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kandev
spec:
  chartRef:
    kind: OCIRepository
    name: kandev
  interval: 1h
  values:
    controllers:
      # SQLite has one writer, and Kandev holds a lock on its home: one replica, Recreate.
      kandev:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: kandev
        pod:
          # The Kubernetes executor's in-cluster connection (kandev-agents' executor Role).
          automountServiceAccountToken: true
          imagePullSecrets:
            - name: kandev-pull
        containers:
          app:
            image:
              # Kandev 0.98.0 with Pi offered on remote executors (containers/kandev). 0.99.0
              # fails every Pi session (github.com/kdlbs/kandev/issues/5090); .renovaterc.json5
              # skips it. Each Kandev workflow run's summary names its build.
              repository: ghcr.io/coredev-uk/kandev
              tag: 097cb13129bd1b57a4bef173d1cc7fd4816b22a5@sha256:b4f3f3d978bfdfee62ebc6ee9cbd8f19c7d107bb7d32c53f898214aca61ac38c
            env:
              TZ: Europe/London
              KANDEV_LOG_LEVEL: info
              KANDEV_FEATURES_AUTH: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 38429
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
              # Migrations run on start, before /ready answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The image's entrypoint only chowns /data as root; as UID 1000 it starts Kandev directly
      # and fsGroup makes the volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      kandev:
        forceRename: kandev
    service:
      app:
        forceRename: kandev
        ports:
          http:
            port: *port
    # envoy-protected signs users in with Pocket ID: Kandev's own login is off, and only Envoy
    # reaches the pod (networkpolicy.yaml).
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-protected
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
