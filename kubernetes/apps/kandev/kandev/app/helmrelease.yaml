---
# Kandev (github.com/kdlbs/kandev): a kanban board that runs coding agents (Pi, on Claude through
# pi-claude-bridge) on tasks and reviews what they change. This pod is the control plane: the web
# UI, the API and the board's SQLite database. The agents run in task pods its Kubernetes
# executor creates in kandev-agents, on hyperion-0 or hyperion-2
# (containers/kandev-worker/pod-template.yaml).
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kandev
spec:
  chartRef:
    kind: OCIRepository
    name: kandev
  interval: 1h
  values:
    controllers:
      # SQLite has one writer, and Kandev holds a lock on its home: one replica, Recreate.
      kandev:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: kandev
        pod:
          # The Kubernetes executor's in-cluster connection (kandev-agents' executor Role).
          automountServiceAccountToken: true
          imagePullSecrets:
            - name: kandev-pull
        containers:
          app:
            image:
              # Kandev 0.100.0 with Pi offered on remote executors (containers/kandev). Each Kandev
              # workflow run's summary names its build.
              repository: ghcr.io/coredev-uk/kandev
              tag: 24977ae2e3923f02d8d2b13235967b176ac4e549@sha256:6cf6050b95c68ffed117289bfa3d686b2bbfb0cfde0d2b813bd3074107af89b0
            env:
              TZ: Europe/London
              KANDEV_LOG_LEVEL: info
              # Task pods fetch per-repository GitHub leases here for git and gh; without it they
              # get no GitHub credentials and push fails.
              KANDEV_GITHUB_CREDENTIAL_BROKER_PUBLIC_BASE_URL: https://kandev.hera.ac
              # Caches stay off the data volume (and its backups) and go with the pod: npm's
              # (the agent CLIs' npx trees, which Kandev reinstalls on demand, as in every fresh
              # task pod), Go's build and module caches, and the rest of XDG's.
              XDG_CACHE_HOME: /cache
              NPM_CONFIG_CACHE: /cache/npm
              GOMODCACHE: /cache/go-mod
            envFrom:
              - secretRef:
                  name: kandev-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 38429
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
              # Migrations run on start, before /ready answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The image's entrypoint only chowns /data as root; as UID 1000 it starts Kandev directly
      # and fsGroup makes the volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      kandev:
        forceRename: kandev
    service:
      app:
        forceRename: kandev
        ports:
          http:
            port: *port
    # envoy-kandev (LAN only) signs users in with Pocket ID: Kandev's own login is off, and only
    # Envoy reaches the pod (networkpolicy.yaml).
    route:
      app:
        forceRename: kandev
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-kandev
            namespace: network
      # Task pods redeem and reissue GitHub credential leases here and cannot sign in:
      # securitypolicy-broker.yaml lifts Pocket ID for these paths alone, and Kandev checks the
      # lease itself. Kandev hands task pods the /api/v1/git broker URL; /api/v1/github serves
      # the same handlers. Each prefix holds only resolve and reissue.
      broker:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-kandev
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/v1/git/credentials/
              - path:
                  type: PathPrefix
                  value: /api/v1/github/credentials/
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
      cache:
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /cache
