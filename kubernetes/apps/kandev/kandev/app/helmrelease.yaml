---
# Kandev (github.com/kdlbs/kandev): a kanban board that runs coding agents (Claude Code on the
# Claude Max plan) on tasks and reviews what they change. This pod is the control plane: the web
# UI, the API and the board's SQLite database. The agents run in task pods its Kubernetes
# executor creates in kandev-agents (containers/kandev-worker/pod-template.yaml), on the same node.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kandev
spec:
  chartRef:
    kind: OCIRepository
    name: kandev
  interval: 1h
  values:
    controllers:
      # SQLite has one writer, and Kandev holds a lock on its home: one replica, Recreate.
      kandev:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: kandev
        pod:
          # The Kubernetes executor's in-cluster connection (kandev-agents' executor Role).
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: ghcr.io/kdlbs/kandev
              tag: 0.98.0@sha256:f9aab231d3b3d3c09b0cfd247c8aa007bac2bc0788d1ae776af79c5307bbf628
            env:
              TZ: Europe/London
              KANDEV_LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 38429
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
              # Migrations run on start, before /ready answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The board and its agents stay on one node (containers/kandev-worker/pod-template.yaml
      # pins the task pods).
      nodeSelector:
        kubernetes.io/hostname: hyperion-0
      # The image's entrypoint only chowns /data as root; as UID 1000 it starts Kandev directly
      # and fsGroup makes the volume writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    serviceAccount:
      kandev:
        forceRename: kandev
    service:
      app:
        forceRename: kandev
        ports:
          http:
            port: *port
    # envoy-protected signs users in with Pocket ID: Kandev's own login is off, and only Envoy
    # reaches the pod (networkpolicy.yaml).
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-protected
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
