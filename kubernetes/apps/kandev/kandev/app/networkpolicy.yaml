---
# Kandev's own login is off (Envoy's OIDC stands in), so only Envoy may reach the pod: an agent in
# kandev-agents, or any other pod, would otherwise reach the API and the secrets it stores
# unauthenticated. The host entity keeps the kubelet's probes. Egress stays open: GitHub, npm and
# the Kubernetes API, which carries the executor's exec and port-forward to task pods.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kandev
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kandev
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "38429"
              protocol: TCP
    - fromEntities:
        - host
