---
# Lifts Pocket ID for the kandev-github route (helmrelease.yaml): a policy on a route replaces the
# gateway's (network/envoy-gateway/app/securitypolicy-oidc.yaml). The route matches only GitHub
# App webhooks, which Kandev verifies by HMAC, and the credential broker, whose callers prove
# themselves with a task-scoped lease.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kandev-github
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kandev-github
  authorization:
    defaultAction: Allow
