---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kandev
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/kandev/kandev/app
  postBuild:
    substitute:
      APP: kandev
      # The database, its master.key (which decrypts Kandev's stored secrets), the repositories
      # it clones and the agent CLIs it installs (.npm-global). Task workspaces are PVCs of their
      # own in kandev-agents; caches go to an emptyDir (helmrelease.yaml): npm's and Go's filled
      # the old 10Gi.
      KOPIUR_CAPACITY: 30Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kandev
