---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Pocket ID client secret for securitypolicy.yaml, which reads the `client-secret` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ui-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-ui-oidc
    template:
      data:
        client-secret: "{{ .KOPIUR_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: KOPIUR_OIDC_CLIENT_SECRET
      remoteRef:
        key: kopiur
        property: KOPIUR_OIDC_CLIENT_SECRET
