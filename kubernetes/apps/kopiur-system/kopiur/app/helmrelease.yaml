---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/home-operations/charts/kopiur
      ref:
        tag: 0.11.2
  interval: 1h
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    # 30-day RSS p95 172Mi, daily peak 188Mi (2026-11-13).
    resources:
      requests:
        cpu: 100m
        memory: 240Mi
      limits:
        memory: 2Gi
    # Web console at kopiur.hera.ac (envoy-internal only), behind Pocket ID: Envoy signs people in
    # (securitypolicy.yaml; client "Kopiur", cluster_admin only) and the NetworkPolicy below admits
    # only envoy-internal, so whoever reaches the console is an admin. Every request runs as that
    # one identity, with the user role: browsing and the action buttons (snapshot, restore, verify).
    ui:
      enabled: true
      # Chart's requests; the limit leaves room for streaming downloads (1Gi max file, chunked).
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 512Mi
      auth:
        anonymous:
          enabled: true
          user: &uiUser kopiur-ui-admin
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      rbac:
        bindings:
          - role: user
            users:
              - *uiUser
      serviceMonitor:
        enabled: true
