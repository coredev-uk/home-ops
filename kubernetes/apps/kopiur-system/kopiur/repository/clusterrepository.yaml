---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: expanse
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /var/nfs/shared/Kopiur
          server: expanse.internal
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      # Kopia compacts an epoch only after the next one closes, so the index set
      # every mover loads is the uncompacted blobs of the two newest epochs:
      # ~2 x 140 blobs/h x epoch length. Epochs close ~1h after minDuration.
      # 24h (kopia's default) reached 5833 blobs against the 1000 warn threshold;
      # 3h gave 4h epochs and a steady ~1130 (2026-11-20 repo scan). 90m gives
      # ~2.5h epochs, ~700 blobs. Floor: 3 x refreshFrequency (20m) = 60m.
      minDuration: 90m
  scheduleDefaults:
    timezone: Europe/London
