---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: expanse
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /var/nfs/shared/Kopiur
          server: expanse.internal
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  parameters:
    epoch:
      # Maintenance runs fine, but no epoch can close while younger than this,
      # so index blobs were never compacting (5833 vs the 1000 warn threshold).
      # 24h (kopia's default) outpaced the backup rate here; 6h lets them compact.
      minDuration: 6h
  scheduleDefaults:
    timezone: Europe/London
