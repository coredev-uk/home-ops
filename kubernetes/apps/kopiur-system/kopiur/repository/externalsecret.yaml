---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-b2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-b2-secret
    template:
      data:
        # A bucket-scoped B2 application key (read and write, including deleteFiles).
        B2_KEY_ID: "{{ .B2_KEY_ID }}"
        B2_KEY: "{{ .B2_KEY }}"
        # Unused by the replication (sync-to reuses the source repository's encryption), but it
        # makes this Secret enough on its own to connect a Repository to the B2 copy after a
        # total loss of the NAS.
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: kopiur
