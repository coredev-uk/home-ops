---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/repositoryreplication_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: expanse-b2
spec:
  # The off-site copy: the NAS repository's encrypted blobs, mirrored nightly to Backblaze B2.
  sourceRef:
    kind: ClusterRepository
    name: expanse
  destination:
    b2:
      bucket: coredev-home-ops-kopiur
      auth:
        secretRef:
          name: kopiur-b2-secret
  # After the 03:00 full maintenance (up to 1h jitter); timezone from the repository's
  # scheduleDefaults (Europe/London).
  schedule:
    cron: 0 5 * * *
  sync:
    # Blobs maintenance removes from the NAS are removed from B2 too. Kopia "deletes" on B2 by
    # hiding the file, so the bucket (private, set through the B2 API on 2026-11-25) has a
    # lifecycle rule removing hidden files after 7 days: without it B2 would keep every deleted
    # blob forever. Those 7 days are the undo window if the NAS repository is ever emptied by
    # mistake and this run copies that; KopiurOffsiteCopyStale fires well inside it.
    deleteExtra: true
    # 4 at once drew B2's per-account "too_many_requests" until kopia gave up on a blob
    # (2026-11-25, three runs); the nightly delta is small, so 2 costs nothing in practice.
    parallel: 2
