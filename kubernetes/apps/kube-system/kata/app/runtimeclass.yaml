---
# Kata Containers (siderolabs/kata-containers in talos/schematic.yaml.j2): a pod with
# `runtimeClassName: kata` runs in its own Cloud Hypervisor VM with its own kernel, so root or
# `privileged: true` inside it reaches the guest only. The extension sets
# privileged_without_host_devices, so no host device is passed in. gVisor cannot do this for
# the nixos runner (actions-runner-system): the Nix sandbox fails there to bring up loopback in
# its network namespace, and unsandboxed builds under gVisor were over 10x slower than runc.
#
# The VM gets Kata's default 2048MiB plus the pod's limits, and memory the guest has touched
# (its page cache too) is not handed back to the host. podFixed covers those 2048MiB and
# 256MiB for Cloud Hypervisor and virtiofsd, so the pod cgroup is as big as the VM; a smaller
# overhead lets the VM outgrow its cgroup and die mid-build.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/node.k8s.io/runtimeclass_v1.json
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    cpu: 250m
    memory: 2304Mi
