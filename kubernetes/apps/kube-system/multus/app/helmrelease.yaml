---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  values:
    # 30-day RSS p95 4Mi, daily peak 5Mi (2026-11-13).
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 512Mi
