---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# The IoT VLAN (VLAN 4, 192.168.130.0/24), shared with the HomePod (Apple Home hub and Thread
# border router) and the Wi-Fi IoT devices. Matter and HomeKit need mDNS and IPv6 link-local on
# this L2. No routes and no sbr: only the connected 192.168.130.0/24 goes out this interface, and
# sbr would move the IPv6 fe80::/64 route out of the main table. The tuning sysctl lets the pod
# accept the Thread border routers' Route Information Options (the Thread prefix /64).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "net0.4",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen": "64"
          }
        }
      ]
    }
