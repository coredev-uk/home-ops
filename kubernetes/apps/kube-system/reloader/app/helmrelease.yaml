---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/stakater/charts/reloader
      ref:
        tag: 2.2.21
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      # Restarts a workload by stamping an annotation on its pod template instead of adding an
      # env var, so the rendered spec Flux/Helm manage doesn't drift on every reload.
      reloadStrategy: annotations
      podMonitor:
        enabled: true
