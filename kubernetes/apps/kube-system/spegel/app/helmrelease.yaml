---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - action: drop
          regex: "http_(request_duration_seconds|response_size_bytes)_bucket|libp2p_.*_bucket"
          sourceLabels: [__name__]
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
      mirroredRegistries:
        - _default
      # A peer answers a tag with the digest it last pulled, so a moved tag (kandev-worker:main,
      # pulled Always) kept starting pods on the old image. Tags go to the registry; layers still
      # come from peers by digest.
      resolveTags: false
