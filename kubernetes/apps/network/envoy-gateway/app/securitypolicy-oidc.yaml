---
# Pocket ID signs in every request on envoy-protected's https listener. The cookie is set for
# hera.ac, so one sign-in at auth.hera.ac covers every protected host. Nothing behind the gateway
# checks groups: the Pocket ID client (1Password item envoy) is limited to cluster_admin.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: protected-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-protected
      sectionName: https
  oidc:
    provider:
      issuer: https://id.hera.ac
    clientIDRef:
      name: envoy-oidc-secret
    clientSecret:
      name: envoy-oidc-secret
    redirectURL: https://auth.hera.ac/oauth2/callback
    logoutPath: /logout
    cookieDomain: hera.ac
    scopes:
      - openid
      - profile
      - email
      - groups
    # Apps such as Kandev stay open in a tab for hours; refresh rather than sign in again.
    refreshToken: true
