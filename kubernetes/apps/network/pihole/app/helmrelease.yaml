---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  interval: 1h
  chart:
    spec:
      chart: pihole
      version: 2.35.0
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: network
  values:
    # Replicas are stateless: each pod rebuilds gravity from `adlists` on start
    # and its external-dns sidecar writes the local DNS records into it, so no
    # pod depends on another or on a volume.
    replicaCount: 2
    maxSurge: 1
    maxUnavailable: 0
    antiaff:
      enabled: true
      avoidRelease: pihole
      strict: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    image:
      repository: pihole/pihole
      tag: 2026.10.1
    admin:
      enabled: false
    DNS1: 9.9.9.9
    DNS2: 149.112.112.112
    adlists:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
    extraEnvVars:
      TZ: Europe/London
      FTLCONF_dns_listeningMode: all
      # 2026.10.0 rejects API calls addressed to a name it does not know with
      # 401 when no password is set. Trust the in-cluster Service name used by
      # dynacat; httproute.yaml rewrites the dashboard's Host (pihole.hera.ac)
      # to this name too. The external-dns sidecar uses localhost, which is
      # always trusted.
      FTLCONF_webserver_domain: pihole-web.network.svc.cluster.local
    serviceDns:
      type: LoadBalancer
      mixedService: true
      externalTrafficPolicy: Cluster
      annotations:
        lbipam.cilium.io/ips: 192.168.110.245
    serviceWeb:
      type: ClusterIP
    serviceDhcp:
      enabled: false
    probes:
      liveness:
        enabled: true
        type: command
        command:
          - /bin/sh
          - -c
          - dig @127.0.0.1 quad9.net || exit 1
        initialDelaySeconds: 60
        failureThreshold: 10
        timeoutSeconds: 5
      # A fresh pod must not take traffic before its sidecar has written the
      # local records, or clients cache NXDOMAIN for internal names.
      readiness:
        enabled: true
        type: command
        command:
          - /bin/sh
          - -c
          - dig @127.0.0.1 quad9.net && dig +short @127.0.0.1 internal.hera.ac | grep -q .
        initialDelaySeconds: 30
        failureThreshold: 10
        timeoutSeconds: 5
    podDnsConfig:
      enabled: true
      policy: None
      nameservers:
        - 127.0.0.1
        - 1.1.1.1
    dnsmasq:
      enableCustomDnsMasq: true
      # Off-cluster names that no external-dns source describes
      additionalHostsEntries:
        - 192.168.20.242 protected.hera.ac
        - 192.168.20.248 plex-lan.hera.ac
      customCnameEntries:
        - cname=auth.hera.ac,kopia.hera.ac,notifiarr.hera.ac,protected.hera.ac
    extraContainers:
      # Exits until pihole's API is listening, so expect 1-2 restarts per pod
      # start; the readiness probe holds traffic until its records exist.
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
        args:
          - --log-level=info
          - --log-format=text
          - --interval=1m
          - --events
          - --source=gateway-httproute
          - --source=service
          - --gateway-namespace=network
          - --domain-filter=hera.ac
          - --policy=upsert-only
          - --registry=noop
          - --provider=pihole
          - --pihole-server=http://localhost
        ports:
          - name: external-dns
            containerPort: 7979
        livenessProbe:
          httpGet:
            path: /healthz
            port: external-dns
          initialDelaySeconds: 10
          failureThreshold: 2
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
    monitoring:
      sidecar:
        enabled: true
        image:
          repository: ekofr/pihole-exporter
          tag: v1.3.0@sha256:67dd0ec8c0fbc2f4edeffd6b0c6768f2b962dcc983b230bedd933a33e5a05cd9
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: pihole
            patch: |
              - op: add
                path: /spec/template/spec/serviceAccountName
                value: pihole
