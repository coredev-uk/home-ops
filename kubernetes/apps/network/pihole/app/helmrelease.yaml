---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
spec:
  interval: 1h
  chart:
    spec:
      chart: pihole
      version: 2.35.0
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: network
  values:
    replicaCount: 1
    image:
      repository: pihole/pihole
      tag: 2026.10.0
    admin:
      enabled: false
    DNS1: 9.9.9.9
    DNS2: 149.112.112.112
    adlists:
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
    extraEnvVars:
      TZ: Europe/London
      FTLCONF_dns_listeningMode: all
      # 2026.10.0 rejects API calls addressed to a name it does not know with
      # 401 when no password is set. Trust the in-cluster Service name used by
      # external-dns and dynacat; httproute.yaml rewrites the dashboard's Host
      # (pihole.hera.ac) to this name too.
      FTLCONF_webserver_domain: pihole-web.network.svc.cluster.local
    serviceDns:
      type: LoadBalancer
      mixedService: true
      externalTrafficPolicy: Cluster
      annotations:
        lbipam.cilium.io/ips: 192.168.110.245
    serviceWeb:
      type: ClusterIP
    serviceDhcp:
      enabled: false
    probes:
      liveness:
        enabled: true
        type: command
        command:
          - /bin/sh
          - -c
          - dig @127.0.0.1 quad9.net || exit 1
        initialDelaySeconds: 60
        failureThreshold: 10
        timeoutSeconds: 5
      readiness:
        enabled: true
        type: command
        command:
          - /bin/sh
          - -c
          - dig @127.0.0.1 quad9.net || exit 1
        initialDelaySeconds: 30
        failureThreshold: 10
        timeoutSeconds: 5
    podDnsConfig:
      enabled: true
      policy: None
      nameservers:
        - 127.0.0.1
        - 1.1.1.1
    dnsmasq:
      enableCustomDnsMasq: true
    monitoring:
      sidecar:
        enabled: true
        image:
          repository: ekofr/pihole-exporter
          tag: v1.2.0@sha256:242c53ef3c24b88fcbe8184390b456d05604bd50de5732ca3fd3eb24395585b3
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
    persistentVolumeClaim:
      enabled: true
      size: 2Gi
      storageClass: ceph-block
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
