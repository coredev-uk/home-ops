---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
spec:
  hostnames:
    - pihole.hera.ac
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin/
            statusCode: 302
    # Pi-hole without a password only answers requests addressed to
    # webserver.domain (see helmrelease.yaml), so present that name upstream.
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: pihole-web.network.svc.cluster.local
      backendRefs:
        - name: pihole-web
          port: 80
