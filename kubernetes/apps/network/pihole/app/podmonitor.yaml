---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pihole
spec:
  namespaceSelector:
    matchNames:
      - network
  podMetricsEndpoints:
    - honorLabels: true
      port: prometheus
      path: /metrics
  selector:
    matchLabels:
      app: pihole
      release: pihole
