---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole
---
# Read access for the external-dns sidecar's gateway-httproute and service sources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pihole
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pihole
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pihole
subjects:
  - kind: ServiceAccount
    name: pihole
    namespace: network
