---
# 1Password item nix-cache:
# ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: Attic's JWT signing key, a PKCS#1 RSA key:
#   `openssl genrsa -traditional 4096 | base64 -w0`. Replacing it invalidates every token.
# ATTIC_TOKEN: GitHub Actions' push token (coredev-uk/nixos secret ATTIC_TOKEN), kept here to
#   recover it: `atticadm -f kubernetes/apps/nix-cache/attic/app/resources/server.toml make-token
#   --sub github-actions --validity 10y --pull coredev --push coredev`, with the key above in the
#   environment.
# ATTIC_POSTGRES_PASSWORD: the attic-postgres owner's (../database).
# ATTIC_CACHE_KEYPAIR: the coredev cache's Nix signing keypair, which Attic keeps in its database;
#   kept here to restore it into a rebuilt database (`update cache set keypair = '…'`), so the
#   hosts' trusted key stays coredev:g2+SrYgQg5HPBFIFHqHszqjvH7n52Zi3HVraAlY0kl8=.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: attic-secret
    template:
      data:
        ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: "{{ .ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64 }}"
        ATTIC_SERVER_DATABASE_URL: "postgres://attic:{{ .ATTIC_POSTGRES_PASSWORD | urlquery }}@attic-postgres-rw:5432/attic?sslmode=disable"
  dataFrom:
    - extract:
        key: nix-cache
