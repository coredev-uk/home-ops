---
# ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64 (1Password item nix-cache): Attic's JWT signing key, a
#   PKCS#1 RSA key: `openssl genrsa -traditional 4096 | base64 -w0`. It signs the
#   builder's token (ATTIC_TOKEN in the same item); replacing it invalidates that token. The
#   cache's own Nix signing key is not here: Attic generates it in its database (claim attic).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: attic-secret
    template:
      data:
        ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64: "{{ .ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64 }}"
  dataFrom:
    - extract:
        key: nix-cache
