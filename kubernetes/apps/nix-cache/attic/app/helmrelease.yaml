---
# Attic binary cache server for coredev-uk/nixos. The hosts pull https://attic.hera.ac/coredev
# (public: reading needs no token); CI pushes with its ATTIC_TOKEN. The cache skips
# anything signed by cache.nixos.org, nix-community or nix-citizen (its upstream keys), so it
# holds only the paths nobody else builds: config files, overrides and unfree software.
#
# The image is upstream's last published build (ghcr.io/zhaofengli/attic stopped publishing
# after 90dcbd6, 2025-09-24) and has no version tags, so Renovate cannot bump it: move the tag
# and digest by hand when upstream publishes again.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: attic
spec:
  chartRef:
    kind: OCIRepository
    name: attic
  interval: 1h
  values:
    controllers:
      # SQLite on a ReadWriteOnce claim: one replica, hence Recreate.
      attic:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/zhaofengli/attic
              tag: 90dcbd6acdc70353aa7488b0c914a433b7caee92@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
            args:
              - -f
              - /config/server.toml
            envFrom:
              - secretRef:
                  name: attic-secret
            # TCP, not HTTP: allowed-hosts rejects the kubelet's Host header.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
                memory: 560Mi
              limits:
                memory: 1Gi
          # Prometheus metrics for the Nix Cache dashboard and atlas's Nix view
          # (resources/exporter.py): what the cache holds, from Attic's database.
          exporter:
            image:
              repository: docker.io/library/python
              tag: 3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
            command: ["python", "-u", "-B", "/scripts/exporter.py"]
            env:
              ATTIC_DB: /db/server.db
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &metricsPort 9102
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *metricsPort
                  periodSeconds: 10
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      # hyperion-0 runs Kandev's task pods.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [hyperion-0]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: attic
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    # Pushes bypass Cloudflare, which rejects request bodies over 100 MB, streamed or not: the
    # nixos runner reaches envoy-external directly, and poseidon's weekly build over the tailnet.
    route:
      # clarence:public the hosts substitute from anywhere and Nix can't follow a login, so reads are open; pushes need an Attic token
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://attic.hera.ac/coredev/nix-cache-info
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: metrics
    persistence:
      config:
        type: configMap
        name: attic-config
        advancedMounts:
          attic:
            app:
              - path: /config
                readOnly: true
      scripts:
        type: configMap
        name: nix-cache-exporter
        advancedMounts:
          attic:
            exporter:
              - path: /scripts
                readOnly: true
      # Which store paths the cache holds, and its Nix signing key. Backed up by kopiur (ks.yaml).
      # The exporter mounts it read-write although it only reads: Attic runs SQLite in WAL
      # mode, and a WAL reader has to update the -shm file.
      db:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          attic:
            app:
              - path: /db
            exporter:
              - path: /db
      # The cache contents, compressed and deduplicated, on the NAS. Not backed up: if they are
      # lost, delete the coredev cache (its database rows point at chunks that are gone) and
      # create it again; that also makes a new signing key, which hosts/default.nix then trusts.
      chunks:
        type: nfs
        server: expanse.internal
        path: /var/nfs/shared/NixCache
        advancedMounts:
          attic:
            app:
              - path: /storage
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          attic:
            app:
              - path: /tmp
