---
# Attic binary cache server for coredev-uk/nixos. The hosts pull https://attic.hera.ac/coredev
# (public: reading needs no token); CI pushes with its ATTIC_TOKEN. The cache skips
# anything signed by cache.nixos.org, nix-community or nix-citizen (its upstream keys), so it
# holds only the paths nobody else builds: config files, overrides and unfree software.
#
# The image is upstream's last published build (ghcr.io/zhaofengli/attic stopped publishing
# after 90dcbd6, 2025-09-24) and has no version tags, so Renovate cannot bump it: move the tag
# and digest by hand when upstream publishes again.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: attic
spec:
  chartRef:
    kind: OCIRepository
    name: attic
  interval: 1h
  values:
    controllers:
      attic:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/zhaofengli/attic
              tag: 90dcbd6acdc70353aa7488b0c914a433b7caee92@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
            args:
              - -f
              - /config/server.toml
            envFrom:
              - secretRef:
                  name: attic-secret
            # TCP, not HTTP: allowed-hosts rejects the kubelet's Host header.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # A full push (5 GB of NARs from a cold cache) took it to 851Mi and it kept 842Mi
            # afterwards: room above that, so the next one isn't OOM-killed mid-upload.
            resources:
              requests:
                cpu: 20m
                memory: 896Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: attic
        ports:
          http:
            port: *port
    # Pushes bypass Cloudflare, which rejects request bodies over 100 MB, streamed or not: the
    # nixos runner reaches envoy-external directly, and poseidon's builds over the tailnet.
    route:
      # clarence:public the hosts substitute from anywhere and Nix can't follow a login, so reads are open; pushes need an Attic token
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://attic.hera.ac/coredev/nix-cache-info
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.hera.ac"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: attic-config
        advancedMounts:
          attic:
            app:
              - path: /config
                readOnly: true
      # The cache contents, compressed and deduplicated, on the NAS. Not backed up: if they are
      # lost, delete the coredev cache (its database rows point at chunks that are gone), create
      # it again and restore its keypair (externalsecret.yaml), so the hosts' trusted key holds.
      chunks:
        type: nfs
        server: expanse.internal
        path: /var/nfs/shared/NixCache
        advancedMounts:
          attic:
            app:
              - path: /storage
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          attic:
            app:
              - path: /tmp
