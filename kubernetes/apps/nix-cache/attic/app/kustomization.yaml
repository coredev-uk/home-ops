---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: attic-config
    files:
      - server.toml=./resources/server.toml
  - name: nix-cache-exporter
    files:
      - exporter.py=./resources/exporter.py
  - name: nix-cache-dashboard
    files:
      - nix-cache.json=./resources/nix-cache.json
# The kopiur postBuild substitution (ks.yaml) would blank the dashboard's ${promDatasource}.
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
