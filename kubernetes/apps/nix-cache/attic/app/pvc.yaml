---
# Attic's chunks: the cache contents, compressed and deduplicated. Only paths no upstream cache
# signs, so it stays small. Not backed up: if it is lost, delete the coredev cache (its
# database rows point at chunks that are gone) and the next build pushes everything again;
# deleting the cache also drops its signing key, so atlas needs the new public key.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attic-chunks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: ceph-block
---
# The builder's status file (status.json), read by the exporter beside Attic. CephFS, because
# the builder's VM and Attic's pod can land on different nodes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-cache-status
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-filesystem
