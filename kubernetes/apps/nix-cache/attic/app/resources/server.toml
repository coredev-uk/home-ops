# atticd configuration. The JWT signing key comes from ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
# (attic-secret); changing it invalidates every token, GitHub Actions' ATTIC_TOKEN among them.
listen = "[::]:8080"

# Clients (the hosts, and GitHub Actions pushing) come through envoy-external.
allowed-hosts = ["attic.hera.ac"]
api-endpoint = "https://attic.hera.ac/"

[database]
url = "sqlite:///db/server.db?mode=rwc"

# The NAS share NixCache (expanse.internal), mounted at /storage.
[storage]
type = "local"
path = "/storage"

# 1 MiB chunks, not Attic's default 64 KiB: every chunk is a file on the NAS and a few SQLite
# writes, and with 64 KiB a cold push of discord or zen (hundreds of MB each) queued enough of
# them that uploads timed out waiting for a database connection. Changing this again stops new
# uploads from deduplicating against the chunks already stored.
[chunking]
nar-size-threshold = 1048576
min-size = 262144
avg-size = 1048576
max-size = 4194304

[compression]
type = "zstd"

# A path nobody has fetched for 30 days is dropped. CI pushes whatever it builds, so a dropped
# path that a host still needs comes back the next time CI builds it.
[garbage-collection]
interval = "12 hours"
default-retention-period = "30 days"
