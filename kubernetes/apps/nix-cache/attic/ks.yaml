---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: attic
spec:
  # The kopiur component backs up Attic's SQLite database (claim `attic`), which holds the
  # cache's signing key: losing it means a new public key in the NixOS config.
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/nix-cache/attic/app
  postBuild:
    substitute:
      APP: attic
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65534"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: nix-cache
