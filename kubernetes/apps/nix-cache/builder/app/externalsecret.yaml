---
# 1Password item nix-cache:
# ATTIC_TOKEN: an Attic token that can only pull, push, create and configure the coredev cache,
#   minted with atticadm from ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64 (attic/app/externalsecret.yaml):
#   atticadm -f server.toml make-token --sub nix-cache-builder --validity 10y --pull coredev
#   --push coredev --create-cache coredev --configure-cache coredev
#   --configure-cache-retention coredev
#   (`attic cache configure` always sends a retention period, so it needs the last one too.)
# NIXOS_DEPLOY_KEY: the private half of a write deploy key on coredev-uk/nixos, which pushes the
#   updated flake.lock to main. Main's ruleset needs Deploy keys as a bypass actor, or the push
#   is refused for not coming through a pull request.
# GITHUB_TOKEN: Flux's token (1Password item flux, also dynacat's), so `nix flake update` calls
#   GitHub's API authenticated. Without it the run shares the home IP's 60 requests an hour.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nix-cache-builder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nix-cache-builder-secret
    template:
      data:
        attic-token: "{{ .ATTIC_TOKEN }}"
        # ssh refuses a key file without its final newline.
        deploy-key: |
          {{ .NIXOS_DEPLOY_KEY }}
        github-token: "{{ .GITHUB_TOKEN }}"
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: flux
        property: FLUX_GITHUB_TOKEN
  dataFrom:
    - extract:
        key: nix-cache
