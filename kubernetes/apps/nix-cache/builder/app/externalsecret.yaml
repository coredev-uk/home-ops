---
# 1Password item nix-cache:
# ATTIC_TOKEN: an Attic token that can only pull, push, create and configure the coredev cache,
#   minted with atticadm from ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64 (attic/app/externalsecret.yaml):
#   atticadm -f server.toml make-token --sub nix-cache-builder --validity 10y --pull coredev
#   --push coredev --create-cache coredev --configure-cache coredev
#   --configure-cache-retention coredev
#   (`attic cache configure` always sends a retention period, so it needs the last one too.)
# GITHUB_BOT_APP_CLIENT_ID, GITHUB_BOT_APP_PRIVATE_KEY (1Password item bot-cecil): BOT Cecil, the
#   GitHub App Renovate runs as. run.sh mints tokens from it limited to coredev-uk/nixos and to
#   reading its code and pull requests and setting commit statuses (the nix-cache status), and
#   uses them for GitHub's API when fetching the flake's inputs.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nix-cache-builder
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nix-cache-builder-secret
    template:
      data:
        attic-token: "{{ .ATTIC_TOKEN }}"
        github-app-client-id: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        github-app-private-key: |
          {{ .GITHUB_BOT_APP_PRIVATE_KEY }}
  dataFrom:
    - extract:
        key: nix-cache
    - extract:
        key: bot-cecil
