---
# NixOS cache builder (resources/run.sh): every 30 minutes, build coredev-uk/nixos's new commits on
# main and its open pull requests, push the outputs to Attic and set each commit's nix-cache
# status. Run one now with:
#   kubectl -n nix-cache create job --from=cronjob/nix-cache-builder nix-cache-builder-manual
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nix-cache-builder
spec:
  chartRef:
    kind: OCIRepository
    name: nix-cache-builder
  interval: 1h
  values:
    controllers:
      builder:
        type: cronjob
        cronjob:
          # A run with no new commit stops after a few GitHub API calls, before mounting the store.
          schedule: "*/30 * * * *"
          timeZone: Europe/London
          # The store image takes one writer: two VMs mounting it would corrupt it.
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 0
          # A run cut off here loses nothing: the store keeps what it built, and the commit,
          # unreported, is picked up again by the next run.
          activeDeadlineSeconds: 14400
        pod:
          # The Nix sandbox, the loop mount and qemu-i386's binfmt_misc entry need privilege;
          # under kata it stops at the pod's own VM, with no host device or node filesystem in reach.
          runtimeClassName: kata
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # The status claim is ReadWriteOnce and Attic's exporter has it mounted: run on its node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: attic
                      app.kubernetes.io/controller: attic
          # run.sh passes SIGTERM to Nix and marks the store as cleanly stopped once Nix has
          # cleaned up; past this the VM is killed and the next run checks the whole store.
          terminationGracePeriodSeconds: 300
        containers:
          app:
            image:
              repository: docker.io/nixos/nix
              tag: 2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
            command: ["bash", "/config/run.sh"]
            # resources/nix.conf. Not mounted at /etc/nix/nix.conf: the image's /etc/nix is a link
            # into its base-system store path, which the mount would modify.
            env:
              NIX_CONF_DIR: /config
            securityContext:
              privileged: true
            # Kata sizes the VM from the limits: 5 vCPUs and 10GiB, for evaluation plus two
            # parallel builds of up to four cores each (resources/nix.conf). Requests stay minimal:
            # the big builds follow the flake-update pull request, opened at 23:30 UTC, so they run
            # overnight when the nodes are idle (the RuntimeClass adds 250m and 2304Mi on top).
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                ephemeral-storage: 1Gi
              limits:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 5Gi
    persistence:
      config:
        type: configMap
        name: nix-cache-builder
        globalMounts:
          - path: /config
            readOnly: true
      secrets:
        type: secret
        name: nix-cache-builder-secret
        defaultMode: 0400
        globalMounts:
          - path: /secrets
            readOnly: true
      store:
        existingClaim: nix-cache-builder-store
        globalMounts:
          - path: /store
      status:
        existingClaim: nix-cache-build-status
        globalMounts:
          - path: /status
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
