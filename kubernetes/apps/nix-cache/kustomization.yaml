---
# Nix binary cache for coredev-uk/nixos: Attic at https://attic.hera.ac/coredev. GitHub Actions
# builds atlas and poseidon there and pushes what it built; Attic keeps only the paths that
# cache.nixos.org, nix-community and nix-citizen don't already sign, with its chunks on the NAS.
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nix-cache

components:
  - ../../components/alerts
  - ../../components/kopiur/secret

resources:
  - ./namespace.yaml
  - ./attic/ks.yaml
