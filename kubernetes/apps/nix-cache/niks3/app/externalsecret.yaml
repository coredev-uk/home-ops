---
# 1Password item nix-cache:
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY: an R2 Account API token with Object Read & Write on the
#   nix-cache bucket only (Cloudflare dashboard > R2 > Manage API tokens).
# NIKS3_API_TOKEN: niks3's admin token (>= 36 characters), used by its GC CronJob; CI pushes with
#   GitHub OIDC instead (helmrelease.yaml).
# NIKS3_SIGNING_KEY: `nix key generate-secret --key-name nix-cache.hera.ac-1`; NIKS3_PUBLIC_KEY is its
#   public half, which coredev-uk/nixos's hosts/default.nix trusts.
# POSTGRES_PASSWORD: the niks3 database owner's (database/externalsecret.yaml).
# CLOUDFLARE_ACCOUNT_TAG (item cloudflare): the account id in R2's S3 endpoint.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: niks3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: niks3-secret
    template:
      data:
        uri: "postgres://niks3:{{ .POSTGRES_PASSWORD | urlquery }}@niks3-postgres-rw:5432/niks3?sslmode=disable"
        token: "{{ .NIKS3_API_TOKEN }}"
        access-key: "{{ .R2_ACCESS_KEY_ID }}"
        secret-key: "{{ .R2_SECRET_ACCESS_KEY }}"
        nix-cache.hera.ac-1: "{{ .NIKS3_SIGNING_KEY }}"
        r2-endpoint: "{{ .CLOUDFLARE_ACCOUNT_TAG }}.r2.cloudflarestorage.com"
  dataFrom:
    - extract:
        key: nix-cache
    - extract:
        key: cloudflare
