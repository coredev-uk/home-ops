---
# niks3's API, public for GitHub's runners: every write needs a GitHub OIDC token from
# coredev-uk/nixos or the admin token (helmrelease.yaml). Only /api/: /metrics stays inside the
# cluster. Reads never come here; they go to the bucket at nix-cache.hera.ac.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: niks3
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://niks3.hera.ac/api/cache-config
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - niks3.hera.ac
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: niks3
          port: 80
