---
# niks3's record of what the bucket holds and what references what, for garbage collection.
# Not backed up: the cache itself lives in R2 and is signed with a key from 1Password, so a lost
# database only means objects uploaded before the loss are never collected.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: niks3-postgres
spec:
  instances: 1
  # One instance: a PDB would block every node drain (Talos upgrades). Drains move the primary instead.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart
  enableSuperuserAccess: false
  storage:
    size: 2Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  bootstrap:
    initdb:
      database: niks3
      owner: niks3
      secret:
        name: niks3-postgres-credentials
