---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Gatus's /config volume (the chart's claim): its stored uptime and alert history.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: gatus-sidecar
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: ceph-block
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
  repository:
    kind: ClusterRepository
    name: expanse
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: gatus-sidecar
  volumeSnapshotClassName: csi-ceph-blockpool
