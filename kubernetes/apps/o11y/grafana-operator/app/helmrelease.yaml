---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  values:
    # Watch unlabelled ConfigMaps so a configMapRef dashboard edit reconciles at once, not at the next resync
    enforceCacheLabels: "off"
    # Backstop for any missed event or a Grafana restart; 10m default felt like "didn't update"
    defaultResyncPeriod: 2m
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
