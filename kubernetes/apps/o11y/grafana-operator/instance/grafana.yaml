---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  # Pinned so Renovate keeps it current: left unset, the operator wrote the version it defaulted
  # to when this CR was created (12.4.1) into spec.version and Grafana never moved on.
  # The grafana-image-mirror policy rewrites docker.io/grafana to mirror.gcr.io.
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: 13.3.1
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
      # auto_login would sign straight back in through the still-open Pocket ID
      # session, so sign-out continues to Pocket ID's sign-out page to end it.
      signout_redirect_url: https://id.hera.ac/logout
    auth.basic:
      enabled: "true"
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: HyperionID
      allow_sign_up: "true"
      auto_login: "true"
      # Roles come from Pocket ID's groups claim at every sign-in: cluster_admin
      # becomes Grafana server admin (and Admin of the org), anyone else Viewer.
      skip_org_role_sync: "false"
      allow_assign_grafana_admin: "true"
      scopes: openid profile email groups
      use_pkce: "true"
      use_refresh_token: "true"
      role_attribute_path: contains(groups[*], 'cluster_admin') && 'GrafanaAdmin' || 'Viewer'
    database:
      type: postgres
      host: grafana-postgres-rw.o11y.svc.cluster.local:5432
      name: grafana
      ssl_mode: disable
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
      disable_initial_admin_creation: "false"
    server:
      enable_gzip: "true"
      root_url: https://grafana.hera.ac
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-auth-secret
              env:
                - name: GF_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres-credentials
                      key: username
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-postgres-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              # 30-day RSS p95 333Mi, daily peak 338Mi (2026-11-13).
              resources:
                requests:
                  memory: 416Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              emptyDir: {}
  httpRoute:
    spec:
      hostnames:
        - grafana.hera.ac
      parentRefs:
        - name: envoy-internal
          namespace: network
  disableDefaultSecurityContext: All
