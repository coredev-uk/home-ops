---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: prometheus
    name: prometheus
    # The uid the stack's synced dashboards read the default datasource by.
    uid: VictoriaMetrics
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 30s
    url: http://vmsingle-victoria-metrics.o11y.svc.cluster.local:8428
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: alertmanager
    name: alertmanager
    access: proxy
    jsonData:
      implementation: prometheus
    url: http://vmalertmanager-victoria-metrics.o11y.svc.cluster.local:9093
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
# Logs beside the metrics in Explore and dashboards; the operator installs the plugin.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  plugins:
    - name: victoriametrics-logs-datasource
      # renovate: datasource=github-releases depName=VictoriaMetrics/victorialogs-datasource
      version: 0.34.0
  datasource:
    type: victoriametrics-logs-datasource
    name: victoria-logs
    uid: VictoriaLogs
    access: proxy
    url: http://vlsingle-victoria-metrics.o11y.svc.cluster.local:9428
