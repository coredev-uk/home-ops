---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
spec:
  endpoints:
    - port: grafana
      honorLabels: true
      metricRelabelings:
        - action: drop
          regex: "grafana_(http_response_size_bytes_bucket|feature_toggles_info|apiserver_request_(duration|sli_duration|slo_duration|body_size_bytes)_.*bucket)"
          sourceLabels: [__name__]
  jobLabel: grafana
  namespaceSelector:
    matchNames:
      - o11y
  selector:
    matchLabels:
      dashboards: grafana
