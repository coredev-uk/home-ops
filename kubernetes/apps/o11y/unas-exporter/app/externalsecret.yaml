---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unas-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unas-exporter-secret
    template:
      data:
        UNAS_API_KEY: "{{ .UNAS_API_KEY }}"
  # A key created on the UNAS itself (UniFi OS > Control Plane > Integrations): keys are
  # per console, so the gateway's UNIFI_API_KEY is refused here. Its scope is fixed and
  # read-only for what this reads (storage, SMART, device info).
  data:
    - secretKey: UNAS_API_KEY
      remoteRef:
        key: unas
        property: UNAS_API_KEY
