---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unas-exporter
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      unas-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sharkops-io/unas-protect-exporter
              tag: v0.3.3@sha256:81ce994bd9f684b967c7dd823dbb410edfd5e3e1d3085e1182518685b277d34e
            args:
              - --web.listen-address=:9101
              # The UNAS serves a self-signed console certificate.
              - --unas.insecure-skip-verify
            env:
              UNAS_URL: https://expanse.internal
            envFrom:
              - secretRef:
                  name: unas-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
    service:
      app:
        ports:
          http:
            port: 9101
    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 1m
            # Above the exporter's 25s per-collector timeout.
            scrapeTimeout: 30s
            # Upstream's dashboard matches the exporter's own metrics on this job name.
            relabelings:
              - action: replace
                targetLabel: job
                replacement: unas-protect-exporter
