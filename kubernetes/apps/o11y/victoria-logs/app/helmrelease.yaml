---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  # The chart has no per-dashboard switch. Its Vector dashboard needs metrics from the chart's
  # Vector agent, which is not deployed, so none of its queries return data.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
            patch: |
              $patch: delete
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        hostnames:
          - vlogs.hera.ac
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
