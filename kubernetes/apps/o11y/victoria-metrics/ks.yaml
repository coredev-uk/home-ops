---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
spec:
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-metrics
      namespace: o11y
  interval: 1h
  path: ./kubernetes/apps/o11y/victoria-metrics/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: victoria-metrics
    namespace: flux-system
  targetNamespace: o11y
---
# The VMAlert and VMRule here need CRDs that the victoria-metrics HelmRelease installs.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics-logs-alerts
spec:
  dependsOn:
    - name: victoria-metrics
  interval: 1h
  path: ./kubernetes/apps/o11y/victoria-metrics/logs-alerts
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: victoria-metrics
    namespace: flux-system
  targetNamespace: o11y
