---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Pocket ID client secret for securitypolicy.yaml, which reads the `client-secret` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rook-ceph-dashboard-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rook-ceph-dashboard-oidc
    template:
      data:
        client-secret: "{{ .ROOK_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: ROOK_OIDC_CLIENT_SECRET
      remoteRef:
        key: rook-ceph
        property: ROOK_OIDC_CLIENT_SECRET
