---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 10m
  values:
    cephClusterSpec:
      cephConfig:
        mon:
          mon_cluster_log_level: info
      cleanupPolicy:
        wipeDevicesFromOtherClusters: false
      csi:
        # Unused since CephFS is gone, but the upgrade sends an empty or unset cephfs as null,
        # which the CephCluster CRD rejects.
        cephfs:
          kernelMountOptions: ms_mode=prefer-crc
        readAffinity:
          enabled: false # https://github.com/ceph/ceph-csi/issues/5772
      dashboard:
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.o11y.svc.cluster.local:9090
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      # Chart defaults request 1000m per mon and 500m per mgr; each uses under 100m (7 days of
      # 5m peaks), and on the 6-core nodes those requests left no CPU to schedule into. OSDs
      # request 1000m by default and peaked at 470m over 14 days.
      resources:
        mon:
          requests:
            cpu: 200m
        mgr:
          requests:
            cpu: 200m
        osd:
          requests:
            cpu: 500m
          limits:
            memory: 8Gi # Required for bootstrap
      security:
        cephx:
          allowedCiphers: [aes256k]
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 3
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keepPriorKeyCountMax: 0
            keyType: aes256k # Talos 1.14+ backports the kernel 7.0 aes256k support
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
      storage:
        useAllDevices: false
        useAllNodes: false
        nodes:
          - name: hyperion-0
            devices:
              - name: /dev/disk/by-id/nvme-eui.000000000000000000a07501ead01052
          - name: hyperion-1
            devices:
              - name: /dev/disk/by-id/wwn-0x5001b444a4337ebf
          - name: hyperion-2
            devices:
              # osd.1: a DRAM-less SATA SSD, ~10x the commit latency of the other two. Its primary
              # affinity is 0 (`ceph osd primary-affinity osd.1 0`, kept in the OSD map, not here),
              # so it serves no reads and leads no writes. A replacement OSD starts at 1.
              - name: /dev/disk/by-id/ata-ESSENCORE_SATA_SSD_ESS3D1P06CNA06100
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        # It extrapolates two days of every node filesystem five days ahead, so a one-off step
        # (images landing on a node) reads as a full disk. node-exporter's NodeFilesystemSpaceFillingUp
        # and NodeFilesystemAlmostOutOfSpace (kube-prometheus-stack) cover local disks by free space.
        CephNodeDiskspaceWarning:
          disabled: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.hera.ac
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_algorithm: zstd
            compression_mode: passive
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
            imageFormat: "2"
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: true
    # No CephFS: its only volume held a 2 KiB status file, and the MDS pair plus its CSI driver
    # reserved ~6Gi and ~2.5 cores. The chart creates a filesystem unless this list is empty.
    cephFileSystems: []
    cephFileSystemVolumeSnapshotClass:
      enabled: false
    cephObjectStores: []
