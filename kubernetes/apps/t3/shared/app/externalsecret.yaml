---
# One token for both agents in the pod: omp reads it as ANTHROPIC_OAUTH_TOKEN (it prefers that
# over an API key) and Claude Code, which T3 uses for titles, commit messages and PR text,
# reads CLAUDE_CODE_OAUTH_TOKEN. The GitHub App values come from bot-cliffe's own 1Password item
# (moved there from Kandev's database): git-credential-cliffe and the gh wrapper in the image
# (containers/t3) sign a JWT with the private key and mint hourly installation tokens, so no
# long-lived GitHub token exists in the pod.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: t3-secret
    template:
      data:
        ANTHROPIC_OAUTH_TOKEN: "{{ .T3_CLAUDE_CODE_OAUTH_TOKEN }}"
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .T3_CLAUDE_CODE_OAUTH_TOKEN }}"
        GITHUB_APP_ID: "{{ .GITHUB_BOT_APP_ID }}"
        GITHUB_APP_INSTALLATION_ID: "{{ .GITHUB_BOT_APP_INSTALLATION_ID }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: t3
    - extract:
        key: bot-cliffe
---
# Pulls ghcr.io/coredev-uk/t3 (containers/t3), which the environments name in imagePullSecrets
# (environment/app/helmrelease.yaml). GHCR_PULL_TOKEN is the read:packages token Clarence pulls
# private ghcr.io/coredev-uk images with.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t3-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: t3-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"coredev-uk","password":"{{ .GHCR_PULL_TOKEN }}","auth":"{{ printf "coredev-uk:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: bot-clarence
