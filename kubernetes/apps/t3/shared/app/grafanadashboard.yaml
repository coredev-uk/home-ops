---
# T3 exports no Prometheus metrics and grafana.com has no dashboard for it, so this one is built
# from what the cluster already scrapes: the kubelet, kube-state-metrics, envoy-t3 and kopiur. The
# environment variable picks t3-a, t3-b or both.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: t3
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: t3-dashboard
    key: t3.json
