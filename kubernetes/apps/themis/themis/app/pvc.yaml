---
# Themis's state file (/var/lib/themis/state.db), one per controller: job schedules, the
# command cursor, Jev's answers, proposal history and the last report. Bookkeeping only, so
# plain claims rather than the kopiur component (which backs up one claim named ${APP}).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: themis-home-ops-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: themis-sona-go-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
