---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  # What apps regenerate, at the top of the volume only (a leading `/` anchors to the volume
  # root): logs, caches, crash reports and the *arr apps' cover art. This list replaces Kopiur's
  # defaults, so /lost+found is repeated. Plex and Jellyfin replace it with their own
  # (app/kustomization.yaml).
  files:
    ignoreRules:
      - /lost+found
      - /*.log
      - /*.log.*
      - /.cache/
      - /cache/
      - /log/
      - /logs/
      - /MediaCover/
      - /Sentry/
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ceph-block
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: expanse
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  # Quick checks the repository's blobs nightly; deep restores the latest snapshot into a
  # throwaway volume once a month, the closest thing to a real recovery.
  verification:
    deep:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      storageClassName: ceph-block
      schedule:
        cron: H 5 1 * *
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
