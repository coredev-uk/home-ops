---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  # Every 6 hours unless the app's Kustomization sets KOPIUR_SCHEDULE: hourly
  # where the volume holds data that changes through the day, daily for apps
  # whose volume is configuration and metadata. Apps that keep their data in
  # Postgres are covered by the database's own, more frequent schedule.
  schedule:
    cron: ${KOPIUR_SCHEDULE:=H */6 * * *}
