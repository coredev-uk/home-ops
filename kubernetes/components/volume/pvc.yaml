---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  annotations:
    # Created once, then left alone: a claim that was created with a restore source (which can't
    # be changed) is kept as it is when an app moves to this component.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${VOLUME_CAPACITY:=5Gi}
  storageClassName: ceph-block
