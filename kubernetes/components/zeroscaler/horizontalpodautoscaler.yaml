---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${APP}
spec:
  minReplicas: 0
  maxReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    # The scaled workload's kind: the apps that keep their data on a StatefulSet's claim set it.
    kind: ${CONTROLLER:=Deployment}
    name: ${APP}
  metrics:
    - type: External
      external:
        metric:
          name: ${ZEROSCALER_METRIC_NAME:=probe_success}
          selector:
            matchLabels:
              job: ${ZEROSCALER_JOB_NAME:=nfs_probe}
        target:
          type: Value
          value: "1"
  behavior:
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      # One failed NFS probe must not stop every media app: scale down only after two minutes
      # of the NAS being unreachable.
      stabilizationWindowSeconds: 120
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
